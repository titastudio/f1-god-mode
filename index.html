<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1: God Mode</title>
<style>
/* ==========================================================================
   F1: GOD MODE — stylesheet
   Palette is deliberately the broadcast palette: near-black navy panels,
   Formula 1 red as the only warm accent, and the timing colours (purple /
   green / yellow) reserved strictly for timing meaning. Nothing else in the
   interface is allowed to use them, so a purple square always means one thing.
   ========================================================================== */
:root{
  --bg:#08080E; --bg2:#0D0D16;
  --panel:#12121D; --panel2:#181824; --panel3:#1F1F2D;
  --line:#262636; --line2:#33334A;
  --red:#E10600; --red-dim:#8E0400;
  --ink:#F1F2F7; --ink2:#C4C8D6; --muted:#7C8397;
  --purple:#B57BFF; --green:#00D26A; --yellow:#FFD200; --blue:#4EA8FF;
  --god:#9A4DFF; --bad:#FF4757; --warn:#FF9F2E;
  --r:3px;
  --disp:"Helvetica Neue",Helvetica,Arial,"Segoe UI",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--body);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--muted);font-size:12.5px}
.lede{color:var(--ink2);font-size:15px;margin:0 0 14px}
.eyebrow{
  font-family:var(--disp); text-transform:uppercase; letter-spacing:.22em;
  font-size:10.5px; font-weight:700; color:var(--muted); margin:0 0 10px;
}
h1,h2,h3{font-family:var(--disp);font-weight:800;letter-spacing:-.01em;margin:0}
a{color:var(--red)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- buttons ---------- */
.btn{
  background:var(--panel3); border:1px solid var(--line2); color:var(--ink);
  padding:10px 18px; border-radius:var(--r); cursor:pointer;
  font-family:var(--disp); font-weight:700; font-size:12px;
  text-transform:uppercase; letter-spacing:.10em; transition:background .12s,border-color .12s;
}
.btn:hover:not(:disabled){background:var(--line2)}
.btn:disabled{opacity:.34;cursor:not-allowed}
.btn--primary{background:var(--red);border-color:var(--red);color:#fff}
.btn--primary:hover:not(:disabled){background:#FF1A0E;border-color:#FF1A0E}
.btn--ghost{background:transparent}
.btn--god{background:transparent;border-color:var(--god);color:var(--god)}
.btn--god:hover:not(:disabled){background:rgba(154,77,255,.16)}
.btn--sm{padding:7px 12px;font-size:10.5px}
.iconbtn{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;padding:4px 8px}
.iconbtn:hover{color:var(--ink)}
.linkbtn{background:none;border:0;color:var(--red);cursor:pointer;font-size:12px;
  font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.10em;padding:8px 0}
.linkbtn:hover{color:#FF3A2E}
.pill{
  background:var(--panel2);border:1px solid var(--line);color:var(--ink2);
  padding:8px 16px;border-radius:100px;cursor:pointer;font-size:12px;font-weight:600;
}
.pill.is-on{background:var(--red);border-color:var(--red);color:#fff}
.pill--sm{padding:5px 11px;font-size:11px}
.chipbtn{background:var(--panel2);border:1px solid var(--line);color:var(--ink2);
  padding:6px 11px;border-radius:var(--r);cursor:pointer;font-size:11.5px}
.chipbtn.is-on{border-color:var(--red);color:var(--ink);background:rgba(225,6,0,.14)}
.sel{background:var(--panel2);border:1px solid var(--line2);color:var(--ink);padding:7px 10px;border-radius:var(--r)}
.num-in{background:var(--panel2);border:1px solid var(--line2);color:var(--ink);padding:7px 10px;width:72px;border-radius:var(--r);font-family:var(--mono)}

/* ---------- chrome ---------- */
.chrome{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:24px;
  padding:0 20px;height:54px;background:var(--bg2);
  border-bottom:1px solid var(--line);
}
.chrome::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red)}
.chrome__brand{display:flex;align-items:baseline;gap:8px;padding-left:10px}
.chrome__mark{font-family:var(--disp);font-weight:900;font-size:22px;font-style:italic;color:var(--red);letter-spacing:-.06em}
.chrome__word{font-family:var(--disp);font-weight:800;font-size:11px;letter-spacing:.26em;color:var(--ink)}
.chrome__nav{display:flex;gap:2px;margin-left:12px}
.chrome__tab{
  background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
  padding:16px 14px;cursor:pointer;font-family:var(--disp);font-weight:700;font-size:11px;
  text-transform:uppercase;letter-spacing:.13em;
}
.chrome__tab:hover{color:var(--ink)}
.chrome__tab.is-active{color:var(--ink);border-bottom-color:var(--red)}
.chrome__right{margin-left:auto;display:flex;align-items:center;gap:14px}
.chrome__team{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600}
.chrome__team .dot{width:8px;height:8px;border-radius:50%;background:var(--tc,var(--red));display:block}
.chrome__role{font-family:var(--disp);font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}

/* ---------- page ---------- */
.page{max-width:1440px;margin:0 auto;padding:26px 20px 70px}
.page__h{font-size:30px;line-height:1.1}
.warnbar{
  border-left:3px solid var(--warn);background:rgba(255,159,46,.09);
  padding:11px 15px;margin:14px 0;font-size:13px;color:var(--ink2);border-radius:0 var(--r) var(--r) 0;
}

/* ---------- boot ---------- */
.boot{position:relative;min-height:100vh;padding:70px 24px 60px;max-width:1180px;margin:0 auto}
.boot__grid{
  position:absolute;inset:0;pointer-events:none;opacity:.5;overflow:hidden;
  background-image:linear-gradient(var(--line) 1px,transparent 1px);
  background-size:100% 46px;
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 62%);
  mask-image:linear-gradient(180deg,#000,transparent 62%);
}
.boot__hero{position:relative;max-width:760px}
.boot__eyebrow{font-family:var(--disp);text-transform:uppercase;letter-spacing:.28em;font-size:10.5px;color:var(--muted);margin:0 0 22px}
.boot__title{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 20px}
.boot__title-a{font-size:clamp(64px,13vw,150px);font-weight:900;font-style:italic;color:var(--red);letter-spacing:-.07em;line-height:.82}
.boot__title-b{font-size:clamp(26px,5vw,58px);font-weight:800;letter-spacing:.06em;line-height:1}
.boot__blurb{font-size:17px;color:var(--ink2);max-width:600px;line-height:1.55}
.boot__actions{position:relative;display:flex;gap:12px;flex-wrap:wrap;margin:38px 0 18px}
.boot__foot{position:relative;color:var(--muted);font-size:12px}
.boot__back{position:relative;margin-bottom:26px}
.create__h{position:relative;font-size:clamp(24px,4vw,38px);margin-bottom:24px;max-width:16ch;line-height:1.1}
.create__roles{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:26px}
.rolecard{
  text-align:left;background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--line2);
  padding:16px 15px;cursor:pointer;border-radius:0 0 var(--r) var(--r);color:var(--ink);
}
.rolecard:hover{border-color:var(--line2)}
.rolecard.is-on{border-top-color:var(--red);background:var(--panel2)}
.rolecard__n{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em}
.rolecard h3{font-size:15px;margin:6px 0 7px}
.rolecard p{margin:0;font-size:12px;color:var(--muted);line-height:1.45}
.create__modes{position:relative;display:flex;gap:8px;margin-bottom:16px}
.create__list{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-bottom:26px}
.teamcard{
  text-align:left;background:var(--panel);border:1px solid var(--line);padding:14px;
  cursor:pointer;border-radius:var(--r);position:relative;color:var(--ink);
}
.teamcard.is-on{border-color:var(--tc);background:var(--panel2)}
.teamcard__bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tc)}
.teamcard h3{font-size:15px;margin:0 0 5px;padding-left:8px}
.teamcard__drv{margin:0 0 7px;padding-left:8px;font-size:11.5px;color:var(--ink2);font-family:var(--mono)}
.teamcard__phil{margin:0;padding-left:8px;font-size:11.5px;color:var(--muted);line-height:1.4}
.drvcard{
  display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-left:3px solid var(--tc);padding:10px 12px;cursor:pointer;border-radius:var(--r);color:var(--ink);
}
.drvcard.is-on{background:var(--panel3);border-color:var(--tc)}
.drvcard__num{font-family:var(--mono);color:var(--muted);width:26px;font-size:12px}
.drvcard__name{display:flex;flex-direction:column;line-height:1.2;flex:1;text-align:left}
.drvcard__name b{font-size:13px}
.drvcard__name em{font-style:normal;font-size:10px;color:var(--muted);letter-spacing:.1em}
.drvcard__ovr{font-family:var(--mono);font-weight:700;font-size:14px}
.create__go{position:sticky;bottom:0;z-index:20;display:flex;align-items:center;gap:16px;
  flex-wrap:wrap;margin:24px -24px 0;padding:14px 24px;
  background:linear-gradient(180deg,rgba(8,8,14,0) 0,var(--bg2) 30%);
  border-top:1px solid var(--line)}
.create__pick{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.create__pick-k{font-family:var(--disp);font-size:9px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}
.create__pick-v{font-size:15px;font-weight:600}
.boot--create{padding-bottom:0}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card__head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:13px 16px;border-bottom:1px solid var(--line);background:var(--panel2)}
.card__head h2{font-size:12px;text-transform:uppercase;letter-spacing:.16em}
.card__tag{font-family:var(--mono);font-size:11px;color:var(--muted)}
.card__body{padding:16px}
.card__body--tight{padding:6px 0}
.card__sub{margin:14px 0 8px;font-family:var(--disp);font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.card__cta{width:100%;margin-top:14px}

/* ---------- hub ---------- */
.nextrace{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--red);
  padding:26px 28px;border-radius:var(--r);margin-bottom:14px}
.nextrace__title{font-size:clamp(26px,4vw,42px);line-height:1.05;margin-bottom:6px}
.nextrace__ckt{margin:0 0 10px;color:var(--ink2);font-size:14px}
.nextrace__notes{margin:0 0 18px;color:var(--muted);font-size:13px;max-width:60ch;line-height:1.5}
.nextrace__stats{display:flex;flex-wrap:wrap;gap:22px;margin-bottom:22px}
.stat{display:flex;flex-direction:column;gap:3px}
.stat__k{font-family:var(--disp);font-size:9.5px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}
.stat__v{font-family:var(--mono);font-size:16px;font-weight:600}
.nextrace__go{display:flex;gap:10px;flex-wrap:wrap}
.hub__last{color:var(--muted);font-size:12.5px;margin:0 0 20px}
.hub__cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}

.srow{display:grid;grid-template-columns:26px 3px 1fr 34px 42px;align-items:center;gap:8px;
  padding:7px 14px;position:relative;font-size:13px}
.srow.is-mine{background:rgba(225,6,0,.07)}
.srow__p{font-family:var(--mono);color:var(--muted);font-size:12px}
.srow__bar{background:var(--tc);height:16px;display:block;width:3px}
.srow__n{font-weight:600}
.srow__t{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.srow__pts{font-family:var(--mono);font-weight:700;text-align:right}
.srow__meter{position:absolute;left:0;bottom:0;height:1px;width:var(--w);background:var(--tc);opacity:.55}

.res{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
.resbar,.gbar,.mini,.dna,.rd{display:grid;align-items:center;gap:9px}
.resbar{grid-template-columns:88px 1fr 58px}
.resbar__k,.gbar__k,.mini__k,.dna__k,.rd__k{font-size:11px;color:var(--muted)}
.resbar__t,.gbar__t,.mini__t,.dna__t,.rd__t{height:4px;background:var(--panel3);border-radius:2px;overflow:hidden;display:block}
.resbar__f,.gbar__f,.mini__f,.dna__f,.rd__f{display:block;height:100%;width:var(--w);background:var(--red)}
.resbar__v,.gbar__v,.mini__v{font-family:var(--mono);font-size:11.5px;text-align:right}
.groupbars{display:flex;flex-direction:column;gap:8px}
.gbar{grid-template-columns:96px 1fr 40px}
.gbar__f{background:var(--tc,var(--red))}
.projrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;
  padding:8px 0;border-top:1px solid var(--line);font-size:12px}
.projrow em{font-style:normal;color:var(--muted);font-size:11px}
.projrow__eta{font-family:var(--mono);font-size:11px;color:var(--yellow)}

.feed__row{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:8px 14px;
  border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.45}
.feed__row:last-child{border-bottom:0}
.feed__r{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.feed__row--good .feed__t{color:var(--green)}
.feed__row--warn .feed__t{color:var(--warn)}
.feed__row--bad .feed__t{color:var(--bad)}

/* ---------- standings ---------- */
.stand__grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin:18px 0 14px}
.trow{display:grid;grid-template-columns:28px 1fr 46px 44px 38px 38px 38px;align-items:center;gap:8px;
  padding:8px 14px;border-bottom:1px solid var(--line);font-size:13px}
.trow--c{grid-template-columns:28px 1fr 44px 38px 38px}
.trow--head{color:var(--muted);font-family:var(--disp);font-size:9.5px;text-transform:uppercase;letter-spacing:.14em;background:var(--panel2)}
.trow.is-mine{background:rgba(225,6,0,.07)}
.trow__p{font-family:var(--mono);color:var(--muted)}
.trow__n{display:flex;align-items:center;gap:8px;min-width:0}
.trow__n b{font-weight:600}
.trow__n em{font-style:normal;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow__bar{width:3px;height:15px;background:var(--tc);flex:none}
.trow .num{text-align:right}
.trow .b{font-weight:700}
.resrow{display:grid;grid-template-columns:36px 1.1fr 1.3fr auto;gap:12px;padding:8px 14px;
  border-bottom:1px solid var(--line);font-size:12.5px;align-items:center}
.resrow__r{font-family:var(--mono);color:var(--muted);font-size:11px}
.resrow__p{color:var(--ink2)}
.resrow__f{font-family:var(--mono);font-size:11px;color:var(--purple)}

.forecast{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:16px;
  background:var(--panel);border:1px solid var(--line);padding:10px 14px;border-radius:var(--r)}
.forecast__k{font-family:var(--disp);font-size:9px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);margin-right:4px}
.forecast__s{font-size:11.5px;color:var(--muted);margin-left:8px}
.fc{display:flex;flex-direction:column;align-items:center;gap:3px;width:34px}
.fc__bar{width:100%;height:12px;background:var(--fc);opacity:var(--o);border-radius:2px;display:block}
.fc__t{font-family:var(--mono);font-size:9px;color:var(--muted)}

/* ---------- weekend ---------- */
.wkhead{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;margin-bottom:18px}
.wkhead__wx{display:flex;gap:20px;flex-wrap:wrap}
.wx{display:flex;flex-direction:column;gap:2px}
.wx__k{font-family:var(--disp);font-size:9px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}
.wx__v{font-family:var(--mono);font-size:14px}
.ladder{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin-bottom:16px}
.sess{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--line2);
  padding:13px 14px;cursor:pointer;color:var(--ink);border-radius:0 0 var(--r) var(--r)}
.sess:disabled{opacity:.36;cursor:not-allowed}
.sess.is-next{border-top-color:var(--red);background:var(--panel2)}
.sess.is-done{border-top-color:var(--green)}
.sess__k{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.sess__n{font-family:var(--disp);font-weight:700;font-size:14px}
.sess__s{font-size:11px;color:var(--muted);font-family:var(--mono)}
.sess.is-done .sess__s{color:var(--green)}
.wk__cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.mapwrap{display:flex;justify-content:center;margin-bottom:16px}
.dnabars{display:flex;flex-direction:column;gap:7px}
.dna{grid-template-columns:104px 1fr 40px}
.dna__v{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right}
.mycar{border:1px solid var(--line);border-left:3px solid var(--tc);border-radius:var(--r);padding:13px;margin-bottom:10px}
.mycar__head{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.mycar__num{font-family:var(--mono);color:var(--tc);font-weight:700;font-size:15px}
.mycar__ovr{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.mycar__bars{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.mini{grid-template-columns:74px 1fr 30px}
.mycar__bal{margin:0 0 11px;font-size:11.5px;color:var(--muted)}
.mycar__acts{display:flex;gap:7px}
.note{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
.note__w{font-family:var(--mono);font-size:10.5px;color:var(--red)}
.note__t{color:var(--ink2);line-height:1.45}

/* ---------- track map ---------- */
.trackmap{max-width:100%;height:auto;display:block}
.trackmap__bed{fill:none;stroke:var(--panel3);stroke-width:5.2;stroke-linejoin:round}
.trackmap__line{fill:none;stroke:var(--line2);stroke-width:1.6;stroke-linejoin:round}
.trackmap__sec{fill:var(--muted)}
.trackmap__pit{fill:none;stroke:var(--line2);stroke-width:2.2;stroke-linecap:round;opacity:.75}
.trackmap__start{fill:none;stroke:var(--red);stroke-width:1.2}
.trackmap__cn{fill:var(--muted);font-size:2.6px;font-family:var(--mono);text-anchor:middle}
.trackmap__car{stroke:var(--bg);stroke-width:.7;transition:cx .09s linear,cy .09s linear,opacity .3s}
.trackmap__car.is-pit{stroke:var(--yellow);stroke-width:1.1;transition:none}
.trackmap__car.is-dnf{stroke:var(--bad);stroke-width:1}
.trackmap__line.is-sc{stroke:var(--yellow)}
.trackmap__line.is-vsc{stroke:#9aa44b}
.mycars{display:flex;align-items:center;gap:6px;margin-bottom:11px;flex-wrap:wrap}
.mycars__sel{font-size:11.5px;padding:5px 8px}
.mycars__k{font-family:var(--disp);font-size:8.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.mycars__b{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--tc);
  color:var(--ink2);padding:5px 11px;cursor:pointer;font-size:11.5px;font-weight:600;border-radius:2px}
.mycars__b.is-on{background:var(--panel3);border-color:var(--tc);color:var(--ink)}
@media (prefers-reduced-motion:reduce){.trackmap__car{transition:none}}
.trackmap__car.is-mine{stroke:#fff;stroke-width:1}
.maplegend{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--muted);padding:6px 4px 0}

/* ---------- live session ---------- */
.live{max-width:1600px;margin:0 auto;padding:14px 16px 76px}
.live__bar{display:flex;align-items:center;gap:22px;background:var(--panel);border:1px solid var(--line);
  border-left:3px solid var(--red);padding:11px 16px;border-radius:var(--r);margin-bottom:12px;flex-wrap:wrap}
.live__id{display:flex;align-items:center;gap:11px;font-family:var(--disp);font-weight:700}
.live__flag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;padding:3px 8px;
  border:1px solid var(--line2);color:var(--muted);border-radius:2px}
.live__flag.is-live{background:var(--red);border-color:var(--red);color:#fff}
.live__flag.is-sc{background:var(--yellow);border-color:var(--yellow);color:#000}
.live__flag.is-red{background:var(--red);border-color:var(--red);color:#fff}
.live__clock{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.02em;margin-left:auto}
.live__wx{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);
  padding:4px 9px;border-radius:2px;font-size:11px}
.chip em{font-style:normal;color:var(--muted);font-size:9.5px;text-transform:uppercase;letter-spacing:.12em}
.chip b{font-family:var(--mono);font-weight:600}
.chip__dot{width:7px;height:7px;border-radius:50%;background:var(--cc,var(--yellow))}
.chip--purple b{color:var(--purple)}

.live__grid{display:grid;grid-template-columns:400px minmax(0,1fr) 300px;gap:12px;align-items:start}
.live__tower{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.live__mid{display:flex;flex-direction:column;gap:12px}
.live__map,.live__tele,.live__side{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.live__side{max-height:660px;overflow:hidden;display:flex;flex-direction:column}

.tw__head{display:grid;grid-template-columns:26px 1fr 40px 74px 62px 32px 24px;gap:6px;
  padding:9px 12px;background:var(--panel2);border-bottom:1px solid var(--line);
  font-family:var(--disp);font-size:9px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted)}
.tw__head--race{grid-template-columns:26px 1fr 24px 40px 62px 58px 66px}
.tw__row{display:grid;grid-template-columns:26px 1fr 40px 74px 62px 32px 24px;gap:6px;align-items:center;
  padding:6px 12px;border-bottom:1px solid var(--line);font-size:12.5px;cursor:pointer}
.tw__row--race{grid-template-columns:26px 1fr 24px 40px 62px 58px 66px}
.tw__row:hover{background:var(--panel2)}
.tw__row.is-mine{background:rgba(225,6,0,.09)}
.tw__row.is-sel{box-shadow:inset 2px 0 0 var(--ink),inset -2px 0 0 var(--ink)}
.tw__row::after{content:"";position:absolute}
.tw__row.is-out{opacity:.36}
.tw__row.is-danger .tw__p{color:var(--bad)}
.tw__p{font-family:var(--mono);color:var(--muted)}
.tw__d{display:flex;align-items:center;gap:7px;min-width:0}
.tw__d b{font-family:var(--disp);font-weight:800;letter-spacing:.02em}
.tw__d em{font-style:normal;font-size:10px;color:var(--muted);font-family:var(--mono)}
.tw__bar{width:3px;height:14px;background:var(--tc);flex:none}
.tw__t{font-family:var(--mono);font-size:11px;font-weight:600}
.tw__t.is-warn{opacity:.8}
.tw__t.is-crit{text-decoration:underline}
.tw__b,.tw__g{font-family:var(--mono);font-size:11.5px;text-align:right}
.tw__l{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right}
.tw__s{display:flex;gap:2px}
.sq{width:8px;height:8px;background:var(--panel3);display:block;border-radius:1px}
.sq--purple{background:var(--purple)}
.sq--green{background:var(--green)}
.sq--yellow{background:var(--yellow)}
.tw__cut{background:repeating-linear-gradient(45deg,rgba(255,71,87,.16) 0 8px,transparent 8px 16px);
  border-top:1px solid var(--bad);border-bottom:1px solid var(--bad);
  padding:4px 12px;font-family:var(--disp);font-size:9px;letter-spacing:.2em;color:var(--bad);text-transform:uppercase}

.tele__head{display:flex;align-items:center;gap:10px;margin-bottom:13px;flex-wrap:wrap}
.tele__num{font-family:var(--mono);font-weight:700;font-size:17px;color:var(--tc)}
.tele__mode{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);
  border:1px solid var(--line2);padding:2px 7px;border-radius:2px}
.tele__grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);margin-bottom:13px}
.kv{background:var(--panel);padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.kv__k{font-family:var(--disp);font-size:8.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.kv__v{font-size:13px}
.tele__bars{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.meter{display:grid;grid-template-columns:82px 1fr 30px;gap:9px;align-items:center;font-size:11px}
.meter__k{color:var(--muted)}
.meter__t{height:5px;background:var(--panel3);border-radius:3px;overflow:hidden;display:block}
.meter__f{display:block;height:100%;width:var(--w);background:var(--green)}
.meter--warn .meter__f{background:var(--yellow)}
.meter--bad .meter__f{background:var(--bad)}
.meter__v{font-family:var(--mono);text-align:right}
.pitorders{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}

.side__h{font-family:var(--disp);font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);margin-bottom:11px}
.side__feed{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:1px}
.msg{display:grid;grid-template-columns:38px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:11.5px;line-height:1.45}
.msg__t{font-family:var(--mono);font-size:10px;color:var(--muted)}
.msg--rc .msg__x{color:var(--yellow)}
.msg--purple .msg__x{color:var(--purple)}
.msg--radio .msg__x{color:var(--ink2);font-style:italic}
.msg--team .msg__x{color:var(--blue)}
.msg--warn .msg__x{color:var(--warn)}
.msg--bad .msg__x{color:var(--bad)}
.msg--pass .msg__x{color:var(--green)}

.ctrl{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;gap:9px;
  padding:10px 18px;background:var(--bg2);border-top:1px solid var(--line);flex-wrap:wrap}
.ctrl__play{width:40px;height:34px;background:var(--panel3);border:1px solid var(--line2);color:var(--ink);
  cursor:pointer;border-radius:var(--r);font-size:13px}
.ctrl__play.is-on{background:var(--red);border-color:var(--red);color:#fff}
.ctrl__speeds{display:flex;gap:2px}
.spd{background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:7px 11px;
  cursor:pointer;font-family:var(--mono);font-size:11px;border-radius:var(--r)}
.spd.is-on{background:var(--panel3);border-color:var(--red);color:var(--ink)}
.ctrl__state{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}

/* ---------- garage ---------- */
.gr__head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:14px}
.gr__switch{display:flex;gap:7px}
.gr__cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:14px;align-items:start}
.gr__right{display:flex;flex-direction:column;gap:14px}
.setrow{padding:11px 0;border-bottom:1px solid var(--line)}
.setrow:last-of-type{border-bottom:0}
.setrow__top{display:flex;align-items:baseline;gap:10px;margin-bottom:7px}
.slider__k{font-size:12.5px;font-weight:600}
.setrow__rec{font-family:var(--mono);font-size:10.5px;color:var(--yellow)}
.slider__v{margin-left:auto;font-family:var(--mono);font-size:13px;font-weight:600}
.setrow__in,.slider input[type=range]{width:100%;accent-color:var(--red);background:transparent}
.setrow__hint{display:flex;gap:16px;margin-top:5px;flex-wrap:wrap}
.hint{font-size:10.5px;color:var(--muted)}
.hint--up{color:#8FA9C4}
.hint--dn{color:#C49A8F}
.gr__acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.readout{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
.rd{grid-template-columns:132px 1fr 42px 74px}
.rd__v{font-family:var(--mono);font-size:12px;text-align:right}
.rd__w{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:right}
.estlap{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:14px}
.estlap__k{font-family:var(--disp);font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}
.estlap__v{font-family:var(--mono);font-size:22px;font-weight:600}
.balance{display:grid;grid-template-columns:96px 1fr 90px;gap:10px;align-items:center;margin-bottom:9px}
.balance__k{font-size:11px;color:var(--muted)}
.balance__t{position:relative;height:5px;background:var(--panel3);border-radius:3px;display:block}
.balance__t::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line2)}
.balance__m{position:absolute;left:var(--x);top:-3px;width:3px;height:11px;background:var(--red);transform:translateX(-50%)}
.balance__v{font-family:var(--mono);font-size:11px;text-align:right}
.tree__g{font-family:var(--disp);font-size:9.5px;text-transform:uppercase;letter-spacing:.16em;
  color:var(--muted);padding:12px 16px 8px}
.tree{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:6px;padding:0 16px 8px}
.node{background:var(--panel2);border:1px solid var(--line);padding:10px;cursor:pointer;
  border-radius:var(--r);text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:5px}
.node:hover{border-color:var(--red)}
.node__n{font-size:11.5px;font-weight:600}
.node__v{font-family:var(--mono);font-size:15px}
.node__t{height:3px;background:var(--panel3);display:block;border-radius:2px;overflow:hidden}
.node__f{display:block;height:100%;width:var(--v);background:var(--red)}

/* ---------- r&d ---------- */
.rnd__res{display:flex;gap:22px;flex-wrap:wrap}
.rres{display:flex;flex-direction:column;gap:4px;min-width:104px}
.rres__k{font-family:var(--disp);font-size:9px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}
.rres__v{font-size:17px;font-weight:600}
.rres__t{height:3px;background:var(--panel3);display:block;border-radius:2px;overflow:hidden}
.rres__f{display:block;height:100%;width:var(--w);background:var(--red)}
.rnd__cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;align-items:start}
.rnd__comps{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.rnd__types{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin-bottom:16px}
.typecard{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--panel2);
  border:1px solid var(--line);border-top:2px solid var(--line2);padding:12px;cursor:pointer;color:var(--ink)}
.typecard.is-on{border-top-color:var(--red);background:var(--panel3)}
.typecard.is-off{opacity:.34;cursor:not-allowed}
.typecard b{font-size:12.5px}
.typecard span{font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.typecard__g{color:var(--green)!important}
.typecard__r{color:var(--warn)!important}
.proj{display:grid;grid-template-columns:1.1fr .9fr 1.3fr auto;gap:10px;align-items:center;
  padding:9px 16px;border-bottom:1px solid var(--line);font-size:12px}
.proj span{color:var(--muted);font-size:11px}
.proj__eta{font-family:var(--mono);color:var(--yellow)!important}
.proj--delivered .proj__eta{color:var(--green)!important}
.proj--underdelivered .proj__eta{color:var(--warn)!important}
.proj--failed .proj__eta{color:var(--bad)!important}

/* ---------- weekend completion + calendar + grey area ---------- */
.sessdots{display:flex;gap:5px;margin-bottom:18px}
.sessdot{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--muted);
  border:1px solid var(--line2);padding:3px 8px;border-radius:2px}
.sessdot.is-done{border-color:var(--green);color:var(--green)}
.wkdone{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--green);
  padding:20px 24px;border-radius:var(--r);margin-bottom:16px}
.wkdone__h{font-size:22px;margin-bottom:6px}
.wkdone__acts{display:flex;gap:10px;flex-wrap:wrap}
.hub__cal{margin-top:14px}
.calgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:5px;margin-bottom:14px}
.cal{background:var(--panel2);border:1px solid var(--line);border-top:2px solid var(--line2);
  padding:8px 9px;display:flex;flex-direction:column;gap:2px;position:relative;border-radius:0 0 var(--r) var(--r)}
.cal.is-past{opacity:.5}
.cal.is-now{border-top-color:var(--red);background:var(--panel3)}
.cal.is-sprint{border-top-color:var(--yellow)}
.cal.is-now.is-sprint{border-top-color:var(--red);box-shadow:inset 0 2px 0 var(--yellow)}
.cal__r{font-family:var(--mono);font-size:10px;color:var(--muted)}
.cal__n{font-size:11.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal__s{position:absolute;top:7px;right:8px;font-family:var(--mono);font-size:8px;
  letter-spacing:.1em;color:var(--yellow)}
.cal__w{font-family:var(--mono);font-size:10px;color:var(--muted);min-height:13px}
.greyacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-bottom:12px}
.greyact{background:var(--panel2);border:1px solid var(--line);padding:12px;border-radius:var(--r);
  display:flex;flex-direction:column;gap:7px}
.greyact.is-off{opacity:.42}
.greyact--out{border-left:2px solid var(--line2);background:var(--panel)}
.greyact--out .greyact__c{color:var(--muted)}
.greyact__top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.greyact__top b{font-size:12.5px}
.greyact__c{font-family:var(--mono);font-size:10px;color:var(--yellow)}
.greyact p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.45;flex:1}
.greyact .btn{width:100%}

/* ---------- academy ---------- */
.actabs{margin-bottom:18px}
.ac__ctx{margin:0 0 16px;max-width:80ch}
.accards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin:0 0 20px}
.accard{text-align:left;background:var(--panel);border:1px solid var(--line);padding:14px;
  cursor:pointer;border-radius:var(--r);color:var(--ink);display:flex;flex-direction:column;gap:7px}
.accard:hover{border-color:var(--red)}
.accard__top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.accard__top b{font-size:13px}
.accard__st{color:var(--yellow);font-size:12px;letter-spacing:1px;flex:none}
.accard__d{margin:0;font-size:11.5px;color:var(--muted);line-height:1.45;flex:1}
.accard__w{font-family:var(--mono);font-size:10px;color:var(--green)}
.acfact{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:8px}
.acfact__r{display:flex;flex-direction:column;gap:4px}
.acfact__k{font-family:var(--disp);font-size:9px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}
.acfact__r p{margin:0;font-size:13px;color:var(--ink2);line-height:1.5}
.acfeel{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.acfeel__c{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--line2);padding:12px}
.acfeel__c--up{border-left-color:#5AA9E6}
.acfeel__c--dn{border-left-color:#C4785A}
.acfeel__c b{font-size:12px}
.acfeel__c p{margin:6px 0 0;font-size:12px;color:var(--muted);line-height:1.5}
.acchain{display:flex;flex-direction:column;border:1px solid var(--line)}
.acchain__row{display:grid;grid-template-columns:auto 14px auto 14px 1fr;gap:8px;align-items:center;
  padding:8px 12px;border-bottom:1px solid var(--line);font-size:11.5px}
.acchain__row:last-child{border-bottom:0}
.acchain__a{color:var(--muted)}
.acchain__arrow{color:var(--line2)}
.acchain__b{color:var(--ink);font-weight:600}
.acchain__b.is-neg{color:var(--warn)}
.acchain__c{color:var(--ink2)}
.actracks{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.actrack{display:grid;grid-template-columns:1fr 120px 68px;gap:10px;align-items:center;font-size:11.5px}
.actrack__n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actrack__t{height:4px;background:var(--panel3);border-radius:2px;overflow:hidden;display:block}
.actrack__f{display:block;height:100%;width:var(--w);background:var(--green)}
.actrack--low .actrack__f{background:var(--line2)}
.actrack__v{font-family:var(--mono);text-align:right;color:var(--muted)}
.actracks__sep{font-family:var(--disp);font-size:9px;text-transform:uppercase;letter-spacing:.16em;
  color:var(--muted);padding:8px 0 2px;border-top:1px solid var(--line)}
.acpicker{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:16px}
.accols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:14px;align-items:start}
.acdemand{display:grid;grid-template-columns:1fr auto 90px;gap:10px;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.acdemand__s{color:var(--yellow);letter-spacing:1px}
.acdemand__w{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:right}
.acprio{padding:10px 16px;border-bottom:1px solid var(--line)}
.acprio__top{display:flex;align-items:baseline;gap:10px}
.acprio__k{font-size:12.5px;font-weight:600;flex:1}
.acprio__v{font-family:var(--mono);font-size:11.5px;color:var(--yellow)}
.acprio__b{padding:0}
.acprio__why{margin:8px 0 0;font-size:11.5px;color:var(--muted);line-height:1.5}
.accorners{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:4px;margin-top:12px}
.accorner{display:grid;grid-template-columns:26px 1fr 26px;grid-template-areas:"n s g" "t t t";gap:2px 6px;
  background:var(--panel2);border:1px solid var(--line);padding:6px 8px;font-size:10.5px}
.accorner__n{grid-area:n;font-family:var(--mono);color:var(--red)}
.accorner__s{grid-area:s;font-family:var(--mono);text-align:right}
.accorner__g{grid-area:g;font-family:var(--mono);color:var(--muted);text-align:right}
.accorner__t{grid-area:t;color:var(--muted);font-size:9.5px}
.acrank{display:grid;grid-template-columns:170px 84px 1fr 74px 54px;gap:10px;align-items:center;
  padding:7px 16px;border-bottom:1px solid var(--line);font-size:12px}
.acrank__s{color:var(--yellow);font-size:11px;letter-spacing:1px}
.acrank__t{height:4px;background:var(--panel3);border-radius:2px;overflow:hidden;display:block}
.acrank__f{display:block;height:100%;width:var(--w);background:var(--red)}
.acrank__v{font-family:var(--mono);text-align:right;color:var(--green)}
.acrank__v.is-neg,.accard__w.is-neg{color:var(--bad)}
.acmwrap{overflow-x:auto;border:1px solid var(--line);margin-bottom:12px}
.acmatrix{display:inline-block;min-width:100%}
.acmrow{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.acmrow:last-child{border-bottom:0}
.acmrow--head{background:var(--panel2);position:sticky;top:0}
.acmc{width:34px;flex:none;height:30px;display:flex;align-items:center;justify-content:center;font-size:9px}
.acmc--label{width:170px;justify-content:flex-start;padding-left:12px;font-size:11.5px;
  background:var(--panel);position:sticky;left:0;z-index:1;border-right:1px solid var(--line)}
.acmrow--head .acmc--label{background:var(--panel2)}
.acmc--h{color:var(--muted);font-family:var(--mono);letter-spacing:.04em}
.acmc--v{cursor:pointer}
.acmc--v:hover{background:var(--panel3)}
.acmdot{width:16px;height:16px;border-radius:2px;display:block;
  background:color-mix(in srgb, var(--red) calc(var(--f) * 100%), var(--panel3))}
.acconcepts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-bottom:14px}
.acconcept .card__body p{line-height:1.6}
.acdemo__out{margin-top:14px}
.acdemo__lap{display:flex;justify-content:space-between;align-items:baseline;

Engine.PATH_POINTS = 560;

Engine.clamp = function (v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); };
Engine.lerp = function (a, b, t) { return a + (b - a) * t; };

/* Format seconds as m:ss.mmm */
Engine.fmtLap = function (s) {
  if (s == null || !isFinite(s) || s <= 0) return '—';
  const m = Math.floor(s / 60);
  const rem = s - m * 60;
  const str = rem.toFixed(3);
  return m + ':' + (rem < 10 ? '0' : '') + str;
};
Engine.fmtGap = function (s) {
  if (s == null || !isFinite(s)) return '—';
  if (s === 0) return '—';
  return '+' + s.toFixed(3);
};
Engine.fmtSector = function (s) {
  if (s == null || !isFinite(s) || s <= 0) return '—';
  return s.toFixed(3);
};

/* ---------------------------------------------------------------------------
 * CAR MODEL
 *
 * deriveCar() is THE single place where components + setup become performance
 * numbers. Nothing else in the codebase may compute a performance channel.
 * It returns { ch: {channels}, dom: {domains}, why: {channel: [contributions]} }
 * so the UI's "Why?" panel reads the exact numbers the simulation used.
 * -------------------------------------------------------------------------*/
const REF_RATING = 80;   /* a component rated 80 contributes zero */
const RATING_GAIN = 2.2; /* points of channel per point of rating per unit weight */

Engine.deriveCar = function (components, setup, circuit, Data, opts) {
  const ch = {};
  const why = {};
  opts = opts || {};
  for (let i = 0; i < Data.PERF_CHANNELS.length; i++) { ch[Data.PERF_CHANNELS[i]] = 50; why[Data.PERF_CHANNELS[i]] = []; }

  /* 0. Regulation caps. A component developed past its legality ceiling still
     shows its full rating in the factory, but only the legal part reaches the
     track. Running the rest is what a grey-area interpretation is. */
  const caps = opts.caps || null;
  const capped = [];
  const usable = {};
  for (let i = 0; i < Data.COMPONENT_KEYS.length; i++) {
    const k = Data.COMPONENT_KEYS[i];
    let v = components[k] == null ? REF_RATING : components[k];
    if (caps && caps[k] != null && v > caps[k]) { capped.push({ key: k, from: v, to: caps[k] }); v = caps[k]; }
    usable[k] = v;
  }

  /* 1. Component contributions */
  for (let i = 0; i < Data.COMPONENTS.length; i++) {
    const comp = Data.COMPONENTS[i];
    const rating = usable[comp.key];
    const delta = rating - REF_RATING;
    for (const key in comp.affects) {
      if (ch[key] == null) continue;
      const amount = delta * comp.affects[key] * RATING_GAIN;
      ch[key] += amount;
      if (Math.abs(amount) > 0.05) why[key].push({ src: comp.name, kind: 'component', amount });
    }
  }

  /* 2. Setup contributions. Setup values are 0..50 with 25 neutral. */
  const s = setup || Data.defaultSetup();
  const d = k => (s[k] == null ? 25 : s[k]) - 25;
  function add(channel, amount, label) {
    if (ch[channel] == null || Math.abs(amount) < 0.02) return;
    ch[channel] += amount;
    why[channel].push({ src: label, kind: 'setup', amount });
  }
  add('downforceFront', d('frontWing') * 0.95, 'Front wing angle');
  add('drag',           d('frontWing') * 0.34, 'Front wing angle');
  add('downforceRear',  d('rearWing') * 0.92, 'Rear wing angle');
  add('drag',           d('rearWing') * 0.62, 'Rear wing angle');
  add('straightline',  -d('rearWing') * 0.30, 'Rear wing angle');

  /* Lower ride height = more floor, more sensitivity. Note the sign flip. */
  add('downforceFront', -d('rideFront') * 0.42, 'Front ride height');
  add('downforceRear',  -d('rideRear') * 0.46, 'Rear ride height');
  add('aeroEfficiency', -(d('rideFront') + d('rideRear')) * 0.16, 'Ride heights');
  add('rideSensitivity', -(d('rideFront') + d('rideRear')) * 0.50, 'Ride heights');
  add('kerbs',           (d('rideFront') + d('rideRear')) * 0.34, 'Ride heights');

  add('platformStability', (d('springFront') + d('springRear')) * 0.40, 'Spring rates');
  add('mechGrip',         -(d('springFront') + d('springRear')) * 0.30, 'Spring rates');
  add('kerbs',            -(d('springFront') + d('springRear')) * 0.26, 'Spring rates');
  add('tyreKindness',     -(d('springFront') + d('springRear')) * 0.16, 'Spring rates');

  add('platformStability', (d('arbFront') + d('arbRear')) * 0.22, 'Anti-roll bars');
  add('mechGrip',         -(d('arbFront') + d('arbRear')) * 0.18, 'Anti-roll bars');
  add('traction',         -d('arbRear') * 0.24, 'Rear anti-roll');

  add('mechGrip',      (d('camberFront') + d('camberRear')) * 0.26, 'Camber');
  add('braking',      -d('camberFront') * 0.20, 'Front camber');
  add('traction',     -d('camberRear') * 0.22, 'Rear camber');
  add('tyreKindness', -(d('camberFront') + d('camberRear')) * 0.24, 'Camber');

  add('braking',   d('brakeBias') * 0.34, 'Brake bias');
  add('mechGrip', -d('brakeBias') * 0.12, 'Brake bias');

  add('traction',  d('diff') * 0.40, 'Differential');
  add('mechGrip', -d('diff') * 0.22, 'Differential');
  add('tyreKindness', -d('diff') * 0.10, 'Differential');

  add('coolingCapacity',  d('cooling') * 0.72, 'Cooling opening');
  add('drag',             d('cooling') * 0.30, 'Cooling opening');
  add('straightline',    -d('cooling') * 0.16, 'Cooling opening');

  /* 3. Circuit-driven physics: altitude thins the air. */
  if (circuit && circuit.altitude > 400) {
    const thin = (circuit.altitude - 400) / 1800;
    add('downforceFront', -thin * 11, 'Altitude');
    add('downforceRear',  -thin * 11, 'Altitude');
    add('drag',           -thin * 9,  'Altitude');
    add('power',          -thin * 7,  'Altitude');
    add('coolingCapacity',-thin * 12, 'Altitude');
  }

  /* 2b. Family synergy. Members of a family are one device; a brilliant floor
     body behind a mediocre leading edge is a mediocre floor. The bonus (or
     penalty) is driven by how evenly developed the family is, so it can only
     be earned by developing them together. */
  const syn = Engine.synergy(usable, Data);
  for (const fam in syn.families) {
    const f = syn.families[fam];
    const targets = fam === 'floor' ? ['aeroEfficiency', 'downforceFront', 'downforceRear']
                  : fam === 'wings' ? ['aeroEfficiency', 'drag']
                  : fam === 'body'  ? ['aeroEfficiency', 'coolingCapacity']
                  : ['power', 'energyDeploy', 'energyRecovery'];
    targets.forEach(function (t) {
      if (ch[t] == null) return;
      const amount = t === 'drag' ? -f.bonus * 0.6 : f.bonus;
      ch[t] += amount;
      if (Math.abs(amount) > 0.05) why[t].push({ src: Data.FAMILIES[fam].name + ' synergy', kind: 'synergy', amount });
    });
  }

  for (const k in ch) ch[k] = Engine.clamp(ch[k], 1, 130);

  /* 4. Aggregate domains. These are what the lap-time model consumes. */
  const df = (ch.downforceFront + ch.downforceRear) / 2;
  const balance = ch.downforceFront / Math.max(1, ch.downforceFront + ch.downforceRear);
  const lowDrag = 100 - ch.drag;
  const activeAeroBonus = (ch.activeAero - 50) * 0.16;

  const dom = {
    downforce: df,
    balance: balance,
    highSpeed:  0.60 * df + 0.18 * ch.mechGrip + 0.22 * ch.platformStability,
    medSpeed:   0.42 * df + 0.36 * ch.mechGrip + 0.22 * ch.platformStability,
    lowSpeed:   0.16 * df + 0.56 * ch.mechGrip + 0.28 * ch.traction,
    straight:   0.52 * ch.power + 0.42 * lowDrag + 0.06 * ch.straightline + activeAeroBonus,
    braking:    0.52 * ch.braking + 0.26 * df + 0.22 * ch.platformStability,
    traction:   0.54 * ch.traction + 0.24 * ch.mechGrip + 0.22 * ch.downforceRear,
    kerbs:      ch.kerbs,
    cooling:    ch.coolingCapacity - (ch.heat - 50) * 0.7,
    reliability: ch.reliability,
    tyreKindness: ch.tyreKindness,
    energy:     0.44 * ch.energyDeploy + 0.34 * ch.energyRecovery + 0.22 * ch.energyCapacity,
    dirtyAir:   ch.dirtyAir,
    rideRisk:   ch.rideSensitivity
  };

  /* Balance away from neutral costs performance everywhere and hurts one axle's
     tyres. Kept here (not in lapTime) so the garage can show it directly. */
  const balErr = Math.abs(balance - 0.5);
  dom.balanceLoss = balErr * 120;
  dom.highSpeed -= dom.balanceLoss * 0.9;
  dom.medSpeed  -= dom.balanceLoss * 0.7;
  dom.lowSpeed  -= dom.balanceLoss * 0.5;

  return { ch, dom, why, setup: s, synergy: syn, capped, usable };
};

/* Free-standing helper: how strong is this car overall, for standings/UI. */
Engine.carRating = function (derived) {
  const d = derived.dom;
  return Engine.clamp(
    (d.highSpeed * 0.22 + d.medSpeed * 0.22 + d.lowSpeed * 0.14 +
     d.straight * 0.18 + d.braking * 0.10 + d.traction * 0.14) * 1.0, 1, 130);
};

/* ---------------------------------------------------------------------------
 * DRIVER MODEL
 * -------------------------------------------------------------------------*/
Engine.driverHas = function (driver, trait) {
  return driver.traits && driver.traits.indexOf(trait) !== -1;
};

/* One number for a driver in a given context. mode: 'quali' | 'race' */
Engine.driverPace = function (driver, mode, ctx) {
  const s = driver.s;
  let v;
  if (mode === 'quali') v = s.qual * 0.62 + s.cons * 0.14 + s.adapt * 0.12 + s.mental * 0.12;
  else                  v = s.race * 0.46 + s.tyre * 0.18 + s.craft * 0.14 + s.cons * 0.12 + s.mental * 0.10;

  const wet = ctx && ctx.wet ? ctx.wet : 0;
  if (wet > 0.05) v = v * (1 - wet * 0.55) + s.wet * wet * 0.55;

  if (ctx && ctx.form) v += ctx.form * (Engine.driverHas(driver, 'confidence_momentum') ? 3.2 : 1.8);
  if (ctx && ctx.pressure && !Engine.driverHas(driver, 'ice_cold')) {
    v -= ctx.pressure * (100 - s.mental) * 0.055;
  }
  if (mode === 'quali' && Engine.driverHas(driver, 'elite_qualifier')) v += 1.1;
  if (wet > 0.4 && Engine.driverHas(driver, 'rain_monster')) v += 4.0;
  else if (wet > 0.4 && Engine.driverHas(driver, 'rain_master')) v += 2.4;
  if (ctx && ctx.dirtyAir > 0 && Engine.driverHas(driver, 'dirty_air_genius')) v += ctx.dirtyAir * 3.0;
  return v;
};

/* ---------------------------------------------------------------------------
 * TYRE MODEL
 * A tyre object: { compound, laps, wear (0..100), temp, state }
 * -------------------------------------------------------------------------*/
Engine.newTyre = function (compound, startWear) {
  return { compound, laps: 0, wear: startWear || 0, temp: 40, graining: 0, blister: 0, flatSpot: 0 };
};

/* Grip multiplier applied to lap time. 1.0 = new tyre in its window. */
Engine.tyreGrip = function (tyre, Data, conditions) {
  const c = Data.COMPOUNDS[tyre.compound];
  let g = c.grip;

  /* Wear: gentle to ~65%, then the cliff. */
  const w = tyre.wear;
  let wearLoss;
  if (w < 65) wearLoss = w * 0.00014;
  else wearLoss = 65 * 0.00014 + (w - 65) * 0.0034;
  g -= wearLoss;

  /* Temperature window. */
  const off = Math.abs(tyre.temp - c.optTemp);
  if (off > c.window) g -= (off - c.window) * 0.0016;

  g -= tyre.graining * 0.0011;
  g -= tyre.blister * 0.0009;
  g -= tyre.flatSpot * 0.0007;

  /* Wrong tyre for the conditions is catastrophic, in both directions. */
  const wet = conditions ? conditions.wet : 0;
  if (c.wet === 0 && wet > 0.15) g -= (wet - 0.15) * 0.62;
  if (c.wet === 1 && wet > 0.75) g -= (wet - 0.75) * 0.30;
  if (c.wet === 1 && wet < 0.12) g -= (0.12 - wet) * 0.55;
  if (c.wet === 2 && wet < 0.55) g -= (0.55 - wet) * 0.42;

  return Engine.clamp(g, 0.55, 1.05);
};

/* Advance a tyre by one lap. Mutates the tyre. Returns applied wear. */
Engine.tyreLap = function (tyre, Data, opts) {
  const c = Data.COMPOUNDS[tyre.compound];
  const circuit = opts.circuit, derived = opts.derived, driver = opts.driver;
  const push = Data.PUSH_MODES[opts.push || 'NORMAL'];

  let rate = c.wearRate * (circuit.tyreWear || 1) * push.wear;
  rate *= 1 - (derived.dom.tyreKindness - 50) * 0.0042;
  rate *= 1 - (driver.s.tyre - 85) * 0.0060;
  if (Engine.driverHas(driver, 'tyre_whisperer')) rate *= 0.92;

  /* Balance error dumps load onto one axle and accelerates wear. */
  rate *= 1 + Math.abs(derived.dom.balance - 0.5) * 1.6;
  const wet = opts.wet || 0;
  if (wet > 0.2 && c.wet === 0) rate *= 1.9;
  if (wet > 0.2 && c.wet > 0) rate *= 0.72;
  rate *= 1 + (opts.trackTemp - 34) * 0.010;
  /* Running in another car's wake: less front load, more sliding, higher
     surface temperature. This is why a train of cars destroys its tyres and a
     car in clear air does not. */
  if (opts.dirtyAir) rate *= 1 + Math.min(0.45, opts.dirtyAir * 0.26);
  /* A heavy car works its tyres harder. The opening laps of a stint on full
     fuel cost far more life than the closing ones. */
  if (opts.fuelKg != null) rate *= 1 + Engine.clamp((opts.fuelKg - 35) / 70, -0.18, 0.34);
  /* Behind a safety car nobody is loading the tyre at all. */
  if (opts.sc) rate *= 0.30;

  tyre.wear = Engine.clamp(tyre.wear + rate, 0, 100);
  tyre.laps += 1;

  /* Temperature converges to a target driven by push level and track temp. */
  let target = c.optTemp + (push.pace * 14) + (opts.trackTemp - 34) * 0.6 - wet * 26;
  if (opts.dirtyAir) target += opts.dirtyAir * 9;    /* overheating in the wake */
  if (opts.sc) target -= 22;                          /* and going cold behind the car */
  tyre.temp += (target - tyre.temp) * (tyre.laps < 2 ? 0.55 : 0.34);

  if (tyre.temp < c.optTemp - c.window && tyre.wear < 40) tyre.graining = Engine.clamp(tyre.graining + 2.4, 0, 60);
  else tyre.graining = Math.max(0, tyre.graining - 1.6);
  if (tyre.temp > c.optTemp + c.window * 1.4) tyre.blister = Engine.clamp(tyre.blister + 1.8, 0, 60);
  tyre.flatSpot = Math.max(0, tyre.flatSpot - 0.6);
  return rate;
};

/* ---------------------------------------------------------------------------
 * ENERGY MODEL — 2026 rules: big electrical contribution, Manual Override.
 * -------------------------------------------------------------------------*/
Engine.newEnergy = function (derived) {
  return { charge: 82, deployRate: 0, recovery: 0, mode: 'AUTO', effective: 'BALANCED',
           overrideAvail: true, heat: 60,
           capacity: 60 + (derived.dom.energy - 50) * 0.5 };
};

Engine.energyLap = function (energy, derived, Data, opts) {
  opts = opts || {};
  const ctx = opts.ctx || {};
  const circuit = opts.circuit;

  /* Choose the effective map. In AUTO the engineers respond to the situation:
     that is what a real energy strategy is, rather than one setting held for a
     whole race. A forced mode is always obeyed — overriding the engineers is
     the point of the game. */
  let key = energy.mode || 'BALANCED';
  if (key === 'AUTO') {
    if (ctx.sc) key = 'HARVEST';
    else if (energy.charge < 24) key = 'HARVEST';
    else if (ctx.attacking && energy.charge > 40) key = 'ATTACK';
    else if (ctx.defending && energy.charge > 30) key = 'DEFEND';
    else if (energy.charge > 86) key = 'ATTACK';        /* a full store is wasted store */
    else if (ctx.clearAir && ctx.lapsLeft > 6) key = 'BALANCED';
    else key = 'BALANCED';
  }
  energy.effective = key;
  const mode = Data.ENERGY_MODES[key] || Data.ENERGY_MODES.BALANCED;

  /* Straight-heavy circuits both spend and recover more. */
  const straightBias = 0.5 + circuit.dna.straight;
  let deploy = (14 + (derived.ch.energyDeploy - 50) * 0.16) * mode.deploy * straightBias;
  /* Calibrated so a BALANCED map is roughly break-even at a typical circuit:
     the store should hover, not fill up and stay full. ATTACK then genuinely
     drains it and HARVEST genuinely rebuilds it, which is what makes the map
     choice a decision rather than a label. */
  let recover = (11.4 + (derived.ch.energyRecovery - 50) * 0.16) * mode.harvest *
                (0.62 + circuit.dna.braking * 2.2);

  /* A draggy car spends charge just holding terminal speed, so wing level and
     energy strategy are the same decision. */
  deploy *= 1 + (derived.ch.drag - 50) * 0.0045;
  /* Following another car costs recovery: less braking energy, and the driver
     is off-throttle in dirty air rather than hard on the brakes. */
  if (ctx.dirtyAir) recover *= 1 - Math.min(0.30, ctx.dirtyAir * 0.20);
  /* Neutralisations are a free recharge. Everyone comes out of a safety car
     period with a full store, which is why restarts are chaotic. */
  if (ctx.sc) { deploy *= 0.25; recover *= 1.5; }

  energy.deployRate = deploy;
  energy.recovery = recover;
  energy.charge = Engine.clamp(energy.charge + (recover - deploy), 4, 100);

  const heatIn = 10 * mode.heat * (1 + (derived.ch.heat - 50) * 0.010) *
                 (1 + (ctx.dirtyAir || 0) * 0.16);   /* no clean air over the radiators */
  const heatOut = 9.4 * (1 + (derived.dom.cooling - 50) * 0.014) *
                  (1 - ((opts.airTemp || 22) - 22) * 0.012) *
                  (ctx.sc ? 1.25 : 1);
  energy.heat = Engine.clamp(energy.heat + heatIn - heatOut, 30, 130);

  /* Lap-time effect of the energy state, in fractional terms. */
  let effect = 0;
  if (energy.charge < 22) effect += (22 - energy.charge) * 0.00030;
  effect -= (deploy - 14) * 0.00022;
  if (energy.heat > 104) effect += (energy.heat - 104) * 0.00050;   /* derate */
  return effect;
};

/* Manual Override becomes available only within striking distance, as the
   regulation intends: it is a tool for the following car, not a free boost. */
Engine.overrideReady = function (energy, ctx) {
  return !!(energy.overrideAvail && energy.charge > 24 && ctx && ctx.attacking);
};

/* Manual Override: extra deployment for a following car. */
Engine.manualOverride = function (energy, derived) {
  if (!energy.overrideAvail || energy.charge < 24) return null;
  const punch = 0.28 + (derived.ch.energyDeploy - 50) * 0.0026;
  energy.charge = Engine.clamp(energy.charge - 19, 4, 100);
  energy.overrideAvail = false;
  energy.heat += 5;
  return { gain: punch, kph: 12 + (derived.ch.energyDeploy - 50) * 0.14 };
};

/* ---------------------------------------------------------------------------
 * LAP TIME — the centre of the whole game.
 *
 * Returns { time, sectors:[3], why:[{label, delta}] } where every entry in
 * `why` is a signed number of seconds. The sum of `why` deltas plus the
 * circuit base equals `time` exactly (see PROJECT_HANDOFF invariant #3).
 * -------------------------------------------------------------------------*/
const PERF_TO_TIME = 0.0026; /* fraction of lap time per point of perf index */
const PERF_REFERENCE = 72;

Engine.lapTime = function (o) {
  const derived = o.derived, driver = o.driver, circuit = o.circuit, Data = o.Data;
  const rng = o.rng, dna = circuit.dna;
  const why = [];
  const base = circuit.base;
  let t = base;

  /* 1. Car performance, weighted by where this circuit spends its lap. */
  const dom = derived.dom;
  const perfIndex =
    dna.highSpeed * dom.highSpeed + dna.medSpeed * dom.medSpeed + dna.lowSpeed * dom.lowSpeed +
    dna.straight * dom.straight + dna.braking * dom.braking + dna.traction * dom.traction;
  const carDelta = base * (PERF_REFERENCE - perfIndex) * PERF_TO_TIME;
  t += carDelta;
  why.push({ label: 'Car performance', delta: carDelta, detail: 'Perf index ' + perfIndex.toFixed(1) });

  /* Per-domain split, used by the "why are we slow" report. */
  const domainSplit = [];
  const domKeys = [['highSpeed', 'High-speed corners'], ['medSpeed', 'Medium-speed corners'],
                   ['lowSpeed', 'Low-speed corners'], ['straight', 'Straights'],
                   ['braking', 'Braking zones'], ['traction', 'Traction zones']];
  for (let i = 0; i < domKeys.length; i++) {
    const k = domKeys[i][0];
    domainSplit.push({ key: k, label: domKeys[i][1], weight: dna[k],
                       delta: base * dna[k] * (PERF_REFERENCE - dom[k]) * PERF_TO_TIME, value: dom[k] });
  }

  /* 2. Driver */
  const ctx = { wet: o.wet || 0, form: o.form || 0, pressure: o.pressure || 0, dirtyAir: o.dirtyAir || 0 };
  const dp = Engine.driverPace(driver, o.mode === 'quali' ? 'quali' : 'race', ctx);
  const drvDelta = base * (85 - dp) * 0.00050;
  t += drvDelta;
  why.push({ label: 'Driver', delta: drvDelta, detail: driver.name + ' index ' + dp.toFixed(1) });

  /* 3. Tyres */
  const grip = Engine.tyreGrip(o.tyre, Data, { wet: o.wet || 0 });
  const tyreDelta = base * (1 - grip) * 1.0;
  t += tyreDelta;
  why.push({ label: 'Tyres', delta: tyreDelta,
             detail: Data.COMPOUNDS[o.tyre.compound].name + ', ' + o.tyre.wear.toFixed(0) + '% worn, ' + o.tyre.temp.toFixed(0) + 'C' });

  /* 4. Fuel — 0.030s per kg for a reference lap, scaled by lap length. */
  const fuelDelta = (o.fuelKg || 0) * 0.030 * (base / 90);
  t += fuelDelta;
  if (fuelDelta > 0.01) why.push({ label: 'Fuel load', delta: fuelDelta, detail: (o.fuelKg || 0).toFixed(1) + ' kg on board' });

  /* 5. Track grip / rubber evolution */
  const gripDelta = base * (0.96 - (o.trackGrip == null ? 0.9 : o.trackGrip)) * 0.28;
  t += gripDelta;
  why.push({ label: 'Track evolution', delta: gripDelta, detail: ((o.trackGrip || 0.9) * 100).toFixed(0) + '% grip' });

  /* 6. Weather. Applied per sector when sector data is available, so a wet
     third sector costs time in the third sector and nowhere else. Averaging it
     first — which is what this used to do — made a soaked S3 and a soaked S1
     produce identical laps. */
  const shares0 = o.sectorShares || [0.34, 0.38, 0.28];
  const ws = o.wetSectors;
  let wetDelta = 0;
  const sectorWet = [0, 0, 0];
  if (ws) {
    for (let k = 0; k < 3; k++) {
      sectorWet[k] = ws[k];
      wetDelta += base * shares0[k] * ws[k] * 0.48;
    }
  } else {
    wetDelta = base * (o.wet || 0) * 0.16;
    for (let k = 0; k < 3; k++) sectorWet[k] = o.wet || 0;
  }
  if (wetDelta > 0.01) {
    t += wetDelta;
    why.push({ label: 'Wet track', delta: wetDelta,
               detail: ws ? 'S1 ' + Math.round(ws[0] * 100) + '%  S2 ' + Math.round(ws[1] * 100) +
                            '%  S3 ' + Math.round(ws[2] * 100) + '%'
                          : ((o.wet || 0) * 100).toFixed(0) + '% wet' });
  }

  /* 7. Energy state */
  const eDelta = base * (o.energyEffect || 0);
  if (Math.abs(eDelta) > 0.005) { t += eDelta; why.push({ label: 'Energy', delta: eDelta, detail: 'Charge ' + (o.charge || 0).toFixed(0) + '%' }); }

  /* 8. Dirty air. Reduced by chassis dirtyAir channel and driver trait. */
  if (o.dirtyAir > 0) {
    const sens = 1 - (dom.dirtyAir - 50) * 0.008;
    const daDelta = base * o.dirtyAir * 0.014 * Math.max(0.3, sens) * (0.4 + dna.highSpeed + dna.medSpeed);
    t += daDelta;
    why.push({ label: 'Dirty air', delta: daDelta, detail: 'Following at ' + (o.dirtyAir).toFixed(1) + 's' });
  }

  /* 8b. Lift and coast. A car short of fuel gives up lap time on purpose,
     which is far cheaper than stopping on the last lap. */
  if (o.fuelSave > 0) {
    const fsDelta = base * o.fuelSave * 0.016;
    t += fsDelta;
    why.push({ label: 'Fuel saving', delta: fsDelta, detail: 'Lifting and coasting to reach the flag' });
  }

  /* 8c. Backmarkers. Even a dominant leader loses time getting past cars a lap
     down, and it is the classic way a comfortable lead evaporates. */
  if (o.traffic > 0) {
    const trDelta = base * o.traffic * 0.006 * (1 - circuit.overtaking * 0.5);
    t += trDelta;
    why.push({ label: 'Traffic', delta: trDelta, detail: 'Lapping slower cars' });
  }

  /* 8d. Blue flags. Being waved out of the way costs the lapped car real time,
     which is why a driver a lap down still falls further back. */
  if (o.blueFlag) {
    const bfDelta = base * 0.010;
    t += bfDelta;
    why.push({ label: 'Blue flags', delta: bfDelta, detail: 'Yielding to the leaders' });
  }

  /* 9. Push level */
  const push = Data.PUSH_MODES[o.push || 'NORMAL'];
  const pushDelta = -base * push.pace * 0.0055;
  if (Math.abs(pushDelta) > 0.005) { t += pushDelta; why.push({ label: 'Push level', delta: pushDelta, detail: push.name }); }

  /* 10. Kerb and ride-height risk on bumpy circuits */
  const kerbPen = base * Math.max(0, (dom.rideRisk - 50)) * 0.00016 * (circuit.dna.lowSpeed + 0.2);
  if (kerbPen > 0.005) { t += kerbPen; why.push({ label: 'Ride sensitivity', delta: kerbPen, detail: 'Bottoming and kerb strikes' }); }

  /* 11. Noise — driver consistency sets the spread. */
  const sd = base * (0.0016 + (100 - driver.s.cons) * 0.000055) * (1 + (o.wet || 0) * 1.4);
  const noise = rng ? rng.gauss(0, sd) : 0;
  t += noise;
  why.push({ label: 'Execution', delta: noise, detail: 'Lap-to-lap variance' });

  /* Mistakes. A big error costs real time. */
  let mistake = null;
  if (rng) {
    const riskBase = (100 - driver.s.cons) * 0.00042 * push.risk * (1 + (o.wet || 0) * 2.2);
    if (rng.chance(riskBase)) {
      const cost = rng.range(0.35, 2.2) * (1 + (o.wet || 0));
      t += cost;
      mistake = { cost, kind: rng.chance(0.18) ? 'off' : 'lockup' };
      why.push({ label: 'Mistake', delta: cost, detail: mistake.kind === 'off' ? 'Ran wide' : 'Locked up' });
    }
  }

  t = Math.max(base * 0.80, t);

  /* Sector split. Weighted so purple sectors mean something: each sector gets
     a share of the lap plus its own slice of noise. */
  /* Sector split. The wet penalty is redistributed to the sectors that are
     actually wet, so the timing screen shows a driver losing time exactly where
     the rain is. */
  const shares = shares0;
  const sectors = [];
  let acc = 0;
  const dry = t - wetDelta;
  for (let i = 0; i < 3; i++) {
    let sec = dry * shares[i] + base * shares[i] * sectorWet[i] * (ws ? 0.48 : 0.16);
    if (rng && i < 2) { const j = rng.gauss(0, t * 0.0011); sec += j; acc += j; }
    else sec -= acc;
    sectors.push(Math.max(0.5, sec));
  }

  return { time: t, sectors, why, domainSplit, perfIndex, mistake, grip };
};

/* Sector shares derived deterministically from the circuit, so a given track
   always splits the same way. */
Engine.sectorShares = function (circuit) {
  const r = Engine.rng(circuit.seed * 7919 + 13);
  let a = 0.30 + r.next() * 0.10, b = 0.30 + r.next() * 0.12;
  const c = 1 - a - b;
  return [a, b, c];
};

/* ---------------------------------------------------------------------------
 * FUEL
 * -------------------------------------------------------------------------*/
Engine.raceFuel = function (circuit, laps) {
  return Math.min(110, laps * (circuit.length * 0.33) * (circuit.fuelUse || 1) + 2);
};
Engine.fuelPerLap = function (circuit, derived, push) {
  const p = push ? (1 + push.pace * 0.10) : 1;
  return (circuit.length * 0.33) * (circuit.fuelUse || 1) *
         (1 - (derived.ch.fuelEfficiency - 50) * 0.0030) * p;
};

/* How hard does this car have to save to reach the flag?
   Returns 0 when it is comfortable and rises towards 1 as the margin vanishes.
   Real teams lift and coast rather than run dry, and it costs real lap time. */
Engine.fuelSaving = function (o) {
  const need = o.lapsLeft * Engine.fuelPerLap(o.circuit, o.derived);
  if (need <= 0) return 0;
  const margin = (o.fuelKg - need) / need;
  if (margin > 0.03) return 0;
  return Engine.clamp(-margin * 6 + 0.05, 0, 1);
};

/* ---------------------------------------------------------------------------
 * WEATHER — per-sector, with a front that moves across the track.
 * -------------------------------------------------------------------------*/
Engine.newWeather = function (circuit, rng) {
  const willRain = rng.chance(circuit.rainChance);
  return {
    sectors: [0, 0, 0],
    airTemp: circuit.airTemp + rng.gauss(0, 2.5),
    trackTemp: circuit.trackTemp + rng.gauss(0, 3.5),
    windSpeed: Math.abs(rng.gauss(3.4, 1.9)),
    windDir: rng.pick(['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW']),
    humidity: 44 + rng.next() * 40,
    rainProb: willRain ? rng.range(0.35, 0.9) : rng.range(0.0, 0.22),
    front: willRain ? { at: rng.range(0.15, 0.75), strength: rng.range(0.4, 1.0), speed: rng.range(0.010, 0.030) } : null,
    forecast: []
  };
};

/* Build a forecast for the session ahead by running the weather model forward
   on a copy. It is a real projection of what the model will do, blurred by the
   meteorologists' confidence — not a separate guess that might disagree with
   what then happens. */
Engine.forecast = function (weather, steps, rng) {
  const copy = JSON.parse(JSON.stringify(weather));
  const out = [];
  for (let i = 0; i < steps; i++) {
    Engine.weatherStep(copy, 1 / steps, rng);
    const wet = Engine.wetLevel(copy);
    /* Confidence falls the further out you look, so the far end of the
       forecast is deliberately vaguer. */
    const confidence = Engine.clamp(0.95 - i / steps * 0.55, 0.35, 0.95);
    const blur = (1 - confidence) * 0.5;
    out.push({
      at: (i + 1) / steps,
      wet: Engine.clamp(wet + rng.gauss(0, blur * 0.35), 0, 1),
      sectors: copy.sectors.slice(),
      airTemp: copy.airTemp + rng.gauss(0, blur * 3),
      trackTemp: copy.trackTemp + rng.gauss(0, blur * 5),
      confidence: confidence
    });
  }
  weather.forecast = out;
  return out;
};

/* Advance weather by `dt` in normalised session progress (0..1). */
Engine.weatherStep = function (w, dt, rng) {
  if (w.front) {
    w.front.at += w.front.speed * dt * 12;
    const centre = w.front.at;
    for (let i = 0; i < 3; i++) {
      const pos = (i + 0.5) / 3;
      const dist = Math.abs(pos - (centre % 1.6));
      const intensity = Math.max(0, 1 - dist * 3.4) * w.front.strength;
      w.sectors[i] = Engine.clamp(w.sectors[i] + (intensity - w.sectors[i]) * 0.32, 0, 1);
    }
    if (w.front.at > 2.4) w.front = null;
  } else {
    for (let i = 0; i < 3; i++) w.sectors[i] = Math.max(0, w.sectors[i] - 0.05 * dt * 12);
  }
  const wet = Engine.wetLevel(w);
  w.trackTemp += ((w.airTemp + 10 - wet * 14) - w.trackTemp) * 0.05 * dt * 12;
};

Engine.wetLevel = function (w) { return (w.sectors[0] + w.sectors[1] + w.sectors[2]) / 3; };
Engine.weatherLabel = function (wet, Data) {
  if (wet < 0.04) return Data.WEATHER[0];
  if (wet < 0.16) return Data.WEATHER[1];
  if (wet < 0.42) return Data.WEATHER[2];
  if (wet < 0.72) return Data.WEATHER[3];
  return Data.WEATHER[4];
};

/* Which tyre should be on the car right now, for AI decisions. */
Engine.bestCompoundFor = function (wet) {
  if (wet > 0.66) return 'W';
  if (wet > 0.24) return 'I';
  return null; /* null = a dry compound, chosen by strategy */
};

/* ---------------------------------------------------------------------------
 * TRACK GEOMETRY — procedural but deterministic per circuit, so every track
 * has a distinct recognisable shape without shipping 36 hand-drawn SVGs.
 * Returns { pts:[{x,y}], corners:[{i,idx,speed}], length }
 * -------------------------------------------------------------------------*/

/* Resample an authored outline to the same 220-point closed loop the
   procedural generator produces, with Catmull-Rom smoothing so the corners
   read as curves rather than as the polygon they are stored as. */
Engine.authoredPath = function (circuit, spec) {
  const raw = spec.trim().split(/\s+/).map(function (pair) {
    const xy = pair.split(',');
    return { x: Number(xy[0]) / 100, y: Number(xy[1]) / 100 };
  });
  const m = raw.length, n = Engine.PATH_POINTS;
  const dense = [];
  const perSeg = Math.ceil(n / m) + 2;
  for (let i = 0; i < m; i++) {
    const p0 = raw[(i - 1 + m) % m], p1 = raw[i], p2 = raw[(i + 1) % m], p3 = raw[(i + 2) % m];
    for (let k = 0; k < perSeg; k++) {
      const t = k / perSeg, t2 = t * t, t3 = t2 * t;
      dense.push({
        x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
        y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3)
      });
    }
  }
  /* Resample by arc length so cars move at a constant rate along the outline
     rather than bunching where the source points were dense. */
  const cum = [0];
  for (let i = 1; i <= dense.length; i++) {
    const a = dense[i - 1], b = dense[i % dense.length];
    cum.push(cum[i - 1] + Math.hypot(b.x - a.x, b.y - a.y));
  }
  const total = cum[dense.length];
  const pts = [];
  let j = 0;
  for (let i = 0; i < n; i++) {
    const want = (i / n) * total;
    while (j < dense.length - 1 && cum[j + 1] < want) j++;
    const seg = cum[j + 1] - cum[j] || 1;
    const t = (want - cum[j]) / seg;
    const a = dense[j], b = dense[(j + 1) % dense.length];
    pts.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
  }
  Engine.normalisePath(pts);
  return Engine.detectCorners(pts, circuit);
};

/* A pit lane running alongside the start/finish straight, offset to the inside
   of the circuit. Both the drawn map and the race marker placement use this, so
   a car in the pits sits on something rather than floating off the track. */
Engine.pitLane = function (path, width) {
  const n = path.pts.length;
  const w = width == null ? 0.030 : width;
  const from = Math.round(n * 0.93), count = Math.round(n * 0.13);
  const out = [];
  for (let k = 0; k <= count; k++) {
    const i = (from + k) % n;
    const a = path.pts[(i - 4 + n) % n], b = path.pts[(i + 4) % n];
    let dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy) || 1;
    /* Inward normal: the side the centroid is on. */
    const nx = -dy / len, ny = dx / len;
    const px = path.pts[i].x, py = path.pts[i].y;
    const sign = ((0.5 - px) * nx + (0.5 - py) * ny) >= 0 ? 1 : -1;
    /* Taper in and out so it reads as a lane, not a parallel track. */
    const taper = Math.sin(Math.PI * (k / count));
    out.push({ x: px + nx * w * sign * taper, y: py + ny * w * sign * taper });
  }
  return out;
};

Engine.normalisePath = function (pts) {
  const n = pts.length;
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (let i = 0; i < n; i++) {
    if (pts[i].x < minX) minX = pts[i].x; if (pts[i].x > maxX) maxX = pts[i].x;
    if (pts[i].y < minY) minY = pts[i].y; if (pts[i].y > maxY) maxY = pts[i].y;
  }
  const w = maxX - minX, h = maxY - minY, sc = 1 / Math.max(w, h);
  for (let i = 0; i < n; i++) {
    pts[i].x = (pts[i].x - minX) * sc + (1 - w * sc) / 2;
    pts[i].y = (pts[i].y - minY) * sc + (1 - h * sc) / 2;
  }
};

/* Shared corner detection: highest-curvature points, spaced out, then speeds
   assigned by rank across a DNA-derived band. Used by both path sources so a
   hand-drawn circuit and a generated one behave identically downstream. */
Engine.detectCorners = function (pts, circuit) {
  const n = pts.length;
  const curv = [];
  for (let i = 0; i < n; i++) {
    const a = pts[(i - 3 + n) % n], b = pts[i], c = pts[(i + 3) % n];
    const v1x = b.x - a.x, v1y = b.y - a.y, v2x = c.x - b.x, v2y = c.y - b.y;
    const cross = Math.abs(v1x * v2y - v1y * v2x);
    const m = Math.sqrt(v1x * v1x + v1y * v1y) * Math.sqrt(v2x * v2x + v2y * v2y) + 1e-9;
    curv.push({ i, k: cross / m });
  }
  curv.sort((a, b) => b.k - a.k);
  const corners = [];
  const minGap = Math.max(3, Math.floor(n / (circuit.corners * 1.7)));
  for (let j = 0; j < curv.length && corners.length < circuit.corners; j++) {
    let ok = true;
    for (let m = 0; m < corners.length; m++) {
      const d = Math.abs(corners[m].i - curv[j].i);
      if (Math.min(d, n - d) < minGap) { ok = false; break; }
    }
    if (ok) corners.push({ i: curv[j].i, k: curv[j].k });
  }
  const byK = corners.slice().sort((a, b) => a.k - b.k);
  const top = Engine.clamp(130 + circuit.dna.highSpeed * 500 + circuit.dna.medSpeed * 120, 150, 295);
  const bottom = Engine.clamp(58 + circuit.dna.straight * 40, 55, 95);
  for (let j = 0; j < byK.length; j++) {
    const rank = byK.length > 1 ? j / (byK.length - 1) : 0;
    byK[j].speed = Math.round(Engine.lerp(top, bottom, Math.pow(rank, 0.85)) / 5) * 5;
  }
  corners.sort((a, b) => a.i - b.i);
  for (let j = 0; j < corners.length; j++) {
    corners[j].num = j + 1;
    corners[j].gear = Engine.clamp(Math.round(corners[j].speed / 40), 1, 8);
    corners[j].pos = corners[j].i / n;
  }
  return { pts, corners, n };
};

Engine.trackPath = function (circuit, Data) {
  /* Real outlines win when we have one. Only the historical fantasy pool falls
     through to the procedural generator, so no two championship circuits ever
     share a shape. */
  const table = (Data && Data.CIRCUIT_PATHS) ||
                (typeof window !== 'undefined' && window.Data ? window.Data.CIRCUIT_PATHS : null);
  if (table && table[circuit.id]) return Engine.authoredPath(circuit, table[circuit.id]);
  const r = Engine.rng(circuit.seed * 104729 + 7);
  const n = Engine.PATH_POINTS;
  const nHarm = 8;
  const harm = [];
  for (let h = 2; h <= nHarm + 1; h++) {
    harm.push({ h, a: (r.next() - 0.5) * (0.62 / (h - 0.4)), p: r.next() * Math.PI * 2 });
  }
  /* Straight bias stretches the loop along one axis for power circuits. */
  const stretch = 1 + circuit.dna.straight * 1.5;
  const pts = [];
  for (let i = 0; i < n; i++) {
    const th = (i / n) * Math.PI * 2;
    let rad = 1;
    for (let k = 0; k < harm.length; k++) rad += harm[k].a * Math.sin(harm[k].h * th + harm[k].p);
    rad = Math.max(0.32, rad);
    pts.push({ x: Math.cos(th) * rad * stretch, y: Math.sin(th) * rad });
  }
  Engine.normalisePath(pts);
  return Engine.detectCorners(pts, circuit);
};

/* ---------------------------------------------------------------------------
 * DEVELOPMENT / R&D
 * -------------------------------------------------------------------------*/
Engine.resolveProject = function (project, team, rng) {
  const type = project.type;
  const expected = project.expectedGain;
  /* Correlation error: what the tunnel promised vs what the track gives. */
  const corr = team.ratings.correlation;
  const sd = expected * (0.55 - (corr - 78) * 0.016);
  let actual = rng.gauss(expected, Math.max(0.15, sd));
  if (rng.chance(type.risk)) actual *= rng.range(-0.15, 0.45); /* development miss */
  actual = Math.round(actual * 100) / 100;
  const reliabilityHit = rng.chance(type.risk * 0.8) ? -rng.range(0.5, 3.0) : 0;
  return { actual, expected, reliabilityHit: Math.round(reliabilityHit * 10) / 10,
           verdict: actual >= expected * 0.9 ? 'delivered' : (actual > 0 ? 'underdelivered' : 'failed') };
};

Engine.projectExpectedGain = function (typeKey, team, componentKey, Data, rng) {
  const type = Data.projectTypeByKey(typeKey);
  const comp = Data.componentByKey(componentKey);
  const aeroGroup = comp && comp.group === 'Aerodynamics';
  const skill = aeroGroup ? team.ratings.aero : (comp && comp.group === 'Power' ? team.ratings.powerUnit : team.ratings.mechanical);
  const scale = 0.6 + (skill - 78) * 0.024 + (team.ratings.devSpeed - 80) * 0.010;
  const mid = (type.gain[0] + type.gain[1]) / 2;
  return Math.round(mid * scale * 100) / 100;
};

/* Diminishing returns: pushing a component past 96 gets very hard. */
Engine.applyGain = function (current, gain) {
  const headroom = Math.max(0.05, (104 - current) / 24);
  return Engine.clamp(current + gain * Math.min(1, headroom), 30, 102);
};

/* ---------------------------------------------------------------------------
 * CALENDAR EVOLUTION
 * Circuits come and go between seasons, the way they do in reality. Anchors
 * never leave; everything else is at risk, and the pool of venues not currently
 * racing supplies the replacements. Over a long career the player sees far more
 * of the world than one fixed 24-round calendar could show.
 * -------------------------------------------------------------------------*/
/* Every circuit's slot is at risk every year, with a probability set by its
   prestige. Nothing is hardcoded as safe: Monaco survives because it is a 98,
   not because it is on a list. That means a fiftieth season is as well defined
   as a second one, and two players' calendars diverge.

   INVARIANT: this must never produce a calendar with a duplicate circuit or a
   different number of rounds. */
Engine.dropChance = function (circuit) {
  /* 98 prestige ~ 1% a year, 45 prestige ~ 30% a year. */
  return Engine.clamp(0.34 - (circuit.prestige - 45) * 0.0062, 0.008, 0.36);
};

Engine.evolveCalendar = function (calendar, Data, rng, opts) {
  opts = opts || {};
  const present = {};
  calendar.forEach(r => { present[r.circuit] = true; });
  const changes = [];
  const maxSwaps = opts.maxSwaps == null ? 4 : opts.maxSwaps;

  /* Who loses their slot this year. */
  const dropping = [];
  for (let i = 0; i < calendar.length; i++) {
    const c = Data.circuitById(calendar[i].circuit);
    if (!c) continue;
    if (rng.next() < Engine.dropChance(c)) dropping.push(i);
    if (dropping.length >= maxSwaps) break;
  }
  if (!dropping.length) return changes;

  /* Who wants the slot. Weighted by prestige, so a classic returning is more
     likely than an obscure venue, but nothing is guaranteed either way. */
  for (let d = 0; d < dropping.length; d++) {
    const candidates = Data.CIRCUITS.filter(c => !present[c.id]);
    if (!candidates.length) break;
    let total = 0;
    for (let i = 0; i < candidates.length; i++) total += Math.pow(candidates[i].prestige, 2.2);
    let roll = rng.next() * total, pick = candidates[candidates.length - 1];
    for (let i = 0; i < candidates.length; i++) {
