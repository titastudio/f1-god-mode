      roll -= Math.pow(candidates[i].prestige, 2.2);
      if (roll <= 0) { pick = candidates[i]; break; }
    }
    const idx = dropping[d];
    const outgoing = calendar[idx].circuit;
    delete present[outgoing];
    present[pick.id] = true;
    calendar[idx] = {
      round: calendar[idx].round,
      circuit: pick.id,
      name: Engine.grandPrixName(pick),
      sprint: calendar[idx].sprint
    };
    changes.push({ index: idx, out: outgoing, in: pick.id });
  }

  /* Sprint rounds are reallocated by how well a circuit suits the format:
     somewhere you can actually overtake. */
  const sprintCount = calendar.filter(r => r.sprint).length;
  calendar.forEach(r => { r.sprint = false; });
  const weights = calendar.map(function (r) {
    const c = Data.circuitById(r.circuit);
    return c ? Math.pow(0.15 + c.overtaking, 2) : 0.2;
  });
  for (let n = 0; n < sprintCount; n++) {
    let total = 0;
    for (let i = 0; i < calendar.length; i++) if (!calendar[i].sprint) total += weights[i];
    if (total <= 0) break;
    let roll = rng.next() * total, chosen = -1;
    for (let i = 0; i < calendar.length; i++) {
      if (calendar[i].sprint) continue;
      roll -= weights[i];
      if (roll <= 0) { chosen = i; break; }
    }
    if (chosen < 0) break;
    calendar[chosen].sprint = true;
  }
  return changes;
};

Engine.grandPrixName = function (circuit) {
  const map = {
    'Bahrain': 'Bahrain', 'Saudi Arabia': 'Saudi Arabian', 'Australia': 'Australian',
    'Japan': 'Japanese', 'China': 'Chinese', 'USA': 'United States', 'Italy': 'Italian',
    'Monaco': 'Monaco', 'Spain': 'Spanish', 'Canada': 'Canadian', 'Austria': 'Austrian',
    'Great Britain': 'British', 'Belgium': 'Belgian', 'Hungary': 'Hungarian',
    'Netherlands': 'Dutch', 'Azerbaijan': 'Azerbaijan', 'Singapore': 'Singapore',
    'Mexico': 'Mexico City', 'Brazil': 'Sao Paulo', 'Qatar': 'Qatar', 'Abu Dhabi': 'Abu Dhabi',
    'Germany': 'German', 'Turkey': 'Turkish', 'South Africa': 'South African',
    'Portugal': 'Portuguese', 'Malaysia': 'Malaysian', 'France': 'French',
    'South Korea': 'Korean', 'India': 'Indian'
  };
  return (map[circuit.country] || circuit.country) + ' Grand Prix';
};

/* ---------------------------------------------------------------------------
 * DRIVER PROGRESSION
 * -------------------------------------------------------------------------*/
Engine.driverSeasonStep = function (driver, xp, rng) {
  const s = driver.s;
  const potential = s.pot;
  const overall = Engine.driverOverall(driver);
  const room = potential - overall;
  const ageFactor = driver.age < 24 ? 1.5 : (driver.age < 30 ? 1.0 : (driver.age < 35 ? 0.45 : -0.35));
  const learn = Engine.driverHas(driver, 'fast_learner') ? 2.0 : 1.0;
  const gain = (room * 0.10 + 0.25) * ageFactor * learn * (0.5 + xp / 1400);
  const keys = ['qual', 'race', 'tyre', 'wet', 'over', 'def', 'cons', 'craft', 'adapt', 'mental'];
  const changes = [];
  for (let i = 0; i < keys.length; i++) {
    const k = keys[i];
    const g = rng.gauss(gain, Math.abs(gain) * 0.7 + 0.15);
    const before = s[k];
    /* Floored at 62 rather than 40: with retirements off a driver can be in the
       sport for thirty seasons, and a grid of forty-rated drivers is not a
       championship. Decline should cost them races, not make them undriveable. */
    s[k] = Engine.clamp(Math.round((s[k] + g) * 10) / 10, 62, potential + 2);
    if (Math.abs(s[k] - before) >= 0.5) changes.push({ key: k, from: before, to: s[k] });
  }
  s.exp = Engine.clamp(s.exp + (100 - s.exp) * 0.16, 40, 100);
  driver.age += 1;
  return changes;
};

Engine.driverOverall = function (driver) {
  const s = driver.s;
  return Math.round(s.qual * 0.20 + s.race * 0.22 + s.tyre * 0.11 + s.wet * 0.07 + s.over * 0.07 +
                    s.def * 0.05 + s.cons * 0.10 + s.craft * 0.10 + s.mental * 0.05 + s.exp * 0.03);
};

/* ---------------------------------------------------------------------------
 * OVERTAKING
 * Called when a chasing car is within striking distance at the end of a lap.
 * -------------------------------------------------------------------------*/
Engine.attemptOvertake = function (att, def, circuit, rng, opts) {
  const paceEdge = (opts.defLap - opts.attLap); /* positive = attacker faster */
  let p = circuit.overtaking * 0.55;
  p += paceEdge * 0.30;
  p += (att.driver.s.over - def.driver.s.def) * 0.0075;
  p += (att.derived.dom.straight - def.derived.dom.straight) * 0.0055;
  if (Engine.driverHas(att.driver, 'late_braker')) p += 0.06;
  if (opts.override) p += 0.22;
  if (opts.drs) p += 0.10;
  if (opts.wet > 0.3) p -= 0.10;
  if (opts.tyreDelta) p += opts.tyreDelta * 0.9; /* fresher tyres */
  p = Engine.clamp(p, 0.01, 0.94);

  if (!rng.chance(p)) {
    /* Failed attempt still costs both cars a little time. */
    return { success: false, attCost: rng.range(0.05, 0.30), defCost: rng.range(0.02, 0.16) };
  }
  const contact = rng.chance(0.030 + (att.driver.h.agg / 100) * 0.030 + (opts.wet || 0) * 0.05);
  return { success: true, attCost: rng.range(0.10, 0.40), defCost: rng.range(0.35, 0.95), contact };
};

/* Wear the bodywork over a lap. Kerbs, debris and simple distance take a car
   apart slowly; before this, health only ever changed through contact, so a car
   that never touched anyone finished every race as new. */
Engine.wearHealth = function (health, o) {
  const circuit = o.circuit, derived = o.derived, rng = o.rng;
  const kerbLoad = (circuit.dna.lowSpeed + circuit.dna.traction) * (1 + Math.max(0, (derived.dom.rideRisk - 50)) * 0.012);
  const push = o.push === 'ATTACK' || o.push === 'PUSH' ? 1.35 : 1;
  const base = 0.055 * push * (1 + (o.wet || 0) * 0.4);
  health.floor = Engine.clamp(health.floor - base * (1 + kerbLoad * 2.2), 0, 100);
  health.frontWing = Engine.clamp(health.frontWing - base * 0.55 * (1 + (o.dirtyAir || 0) * 0.6), 0, 100);
  health.rearWing = Engine.clamp(health.rearWing - base * 0.35, 0, 100);
  health.suspension = Engine.clamp(health.suspension - base * 0.8 * (1 + kerbLoad * 1.6), 0, 100);
  health.brakes = Engine.clamp(health.brakes - base * 1.1 * (circuit.brakeWear || 1), 0, 100);
  /* Occasional debris pickup: a small, visible, annoying loss. */
  if (rng && rng.chance(0.010)) {
    health.floor = Engine.clamp(health.floor - rng.range(1.5, 5), 0, 100);
    return 'debris';
  }
  return null;
};

/* ---------------------------------------------------------------------------
 * RELIABILITY
 * -------------------------------------------------------------------------*/
Engine.reliabilityCheck = function (car, rng, opts) {
  const rel = car.derived.dom.reliability;
  let p = 0.00048 * (1 - (rel - 50) * 0.011);
  if (car.energy.heat > 112) p *= 1 + (car.energy.heat - 112) * 0.07;
  p *= opts.stressMult || 1;
  for (const k in car.health) if (car.health[k] < 70) p *= 1.20;
  if (!rng.chance(Math.max(0, p))) return null;
  const parts = ['MGU-K', 'Energy Store', 'Turbo', 'Gearbox', 'ICE', 'Hydraulics', 'Cooling'];
  const part = rng.pick(parts);
  return { part, terminal: rng.chance(0.62) };
};

/* ---------------------------------------------------------------------------
 * STRATEGY MODELLING — used by both the AI and the player's pre-race screen.
 * -------------------------------------------------------------------------*/
/* INVARIANT: this must apply the same wear terms as Engine.tyreLap(). If they
   drift apart, strategies are planned against a tyre that does not exist and
   every car falls off the cliff mid-stint and makes an unplanned stop.
   The two terms deliberately NOT included are dirty air and fuel load: both are
   race-situation values that a pre-race plan cannot know. They are what makes a
   real stint come in shorter than the plan, which is the correct behaviour —
   `expectedLaps` below exposes the honest planning number to the UI. */
Engine.stintLength = function (compound, circuit, derived, driver, Data) {
  const c = Data.COMPOUNDS[compound];
  let rate = c.wearRate * (circuit.tyreWear || 1);
  rate *= 1 - (derived.dom.tyreKindness - 50) * 0.0042;
  rate *= 1 - (driver.s.tyre - 85) * 0.0060;
  if (Engine.driverHas(driver, 'tyre_whisperer')) rate *= 0.92;
  rate *= 1 + Math.abs(derived.dom.balance - 0.5) * 1.6;
  rate *= 1 + (circuit.trackTemp - 34) * 0.010;
  /* 68, not 100: a stint is planned to end at the edge of the cliff (65),
     which is where real teams stop, not where the tyre gives up entirely. */
  return Math.max(4, Math.round(68 / Math.max(0.5, rate)));
};

/* Enumerate every sensible compound sequence from one to four stops, score
   each, and keep the feasible ones. If a circuit degrades so hard that nothing
   is feasible (Qatar on a tyre-hungry car), the feasibility filter is relaxed
   rather than returning an empty list — callers depend on getting at least one
   strategy back. */
/* Score a strategy by SIMULATING it with the same tyre model the race uses,
   lap by lap, rather than by a separate scoring formula.
   INVARIANT: this must call Engine.tyreLap and Engine.tyreGrip, not reimplement
   them. The previous version scored stints with its own approximation and
   disagreed with the race about what a worn tyre costs — the planner chose
   three stops where the race rewarded one, and running with no plan at all came
   out faster than the plan. One model, used by both, is the only way that
   cannot happen. */
Engine.simulateStrategy = function (o) {
  const { circuit, derived, driver, Data, laps, sequence } = o;
  let total = 0, lap = 0, feasible = true;
  const stints = [];
  const startFuel = Engine.raceFuel(circuit, laps);
  const perLap = Engine.fuelPerLap(circuit, derived);
  const lengths = o.lengths;

  for (let si = 0; si < sequence.length; si++) {
    const compound = sequence[si];
    const len = lengths[si];
    if (len < 1) { feasible = false; break; }
    const tyre = Engine.newTyre(compound, 0);
    tyre.temp = Data.COMPOUNDS[compound].optTemp;
    let worst = 0;
    for (let k = 0; k < len; k++) {
      const fuelKg = Math.max(2, startFuel - perLap * lap);
      const grip = Engine.tyreGrip(tyre, Data, { wet: 0 });
      /* Same shape as the tyre term in Engine.lapTime(). */
      total += circuit.base * (1 + (1 - grip)) + fuelKg * 0.030 * (circuit.base / 90);
      Engine.tyreLap(tyre, Data, {
        circuit, derived, driver, push: 'NORMAL', wet: 0,
        trackTemp: circuit.trackTemp, fuelKg: fuelKg
      });
      if (tyre.wear > worst) worst = tyre.wear;
      lap++;
    }
    /* A stint that ends deep past the cliff is not a plan, it is a hope. */
    if (worst > 92) feasible = false;
    stints.push({ compound, laps: len, endWear: Math.round(worst),
                  maxLaps: Engine.stintLength(compound, circuit, derived, driver, Data) });
  }
  const stops = sequence.length - 1;
  total += stops * circuit.pitLoss;
  /* A stop also costs track position you may never get back. At Monaco that is
     worth far more than the pit loss itself, which is why Monaco is a one-stop
     and Bahrain is not. Without this the planner treats every circuit as if
     passing were free. */
  total += stops * (1 - circuit.overtaking) * 14;
  return { total, stints, feasible };
};

/* Enumerate compound sequences and stint splits, then simulate each. Splits are
   searched rather than assumed, because the best two-stop is rarely three even
   stints. */
Engine.buildStrategies = function (o) {
  const { circuit, derived, driver, Data, laps } = o;
  const dry = Data.DRY_COMPOUNDS;
  const cap = {};
  for (let i = 0; i < dry.length; i++) cap[dry[i]] = Engine.stintLength(dry[i], circuit, derived, driver, Data);

  const seqs = [];
  function expand(prefix, depth) {
    if (prefix.length >= 2) seqs.push(prefix.slice());
    if (prefix.length >= depth) return;
    for (let i = 0; i < dry.length; i++) {
      if (prefix.length >= 2 && prefix[prefix.length - 1] === dry[i] && prefix[prefix.length - 2] === dry[i]) continue;
      expand(prefix.concat(dry[i]), depth);
    }
  }
  for (let i = 0; i < dry.length; i++) expand([dry[i]], 4);

  const out = [];
  for (let i = 0; i < seqs.length; i++) {
    const seq = seqs[i];
    /* Base split proportional to each compound's capacity, then a small search
       either side of it so an unbalanced-but-quicker split can be found. */
    let capTotal = 0;
    for (let j = 0; j < seq.length; j++) capTotal += cap[seq[j]];
    const base = seq.map(c => Math.max(1, Math.round(laps * cap[c] / capTotal)));
    let best = null;
    const shifts = seq.length === 2 ? [-6, -3, 0, 3, 6] : [-4, 0, 4];
    for (let a = 0; a < shifts.length; a++) {
      const lengths = base.slice();
      lengths[0] += shifts[a];
      let used = 0;
      for (let j = 0; j < lengths.length - 1; j++) used += lengths[j];
      lengths[lengths.length - 1] = laps - used;
      if (lengths.some(l => l < 1)) continue;
      const sim = Engine.simulateStrategy({ circuit, derived, driver, Data, laps, sequence: seq, lengths });
      if (!sim.feasible) continue;
      if (!best || sim.total < best.total) best = sim;
    }
    if (!best) continue;
    out.push({ key: seq.join('-'), sequence: seq.slice(), stints: best.stints,
               stops: seq.length - 1, total: best.total,
               confidence: Engine.clamp(92 - (seq.length - 1) * 8, 22, 92) });
  }
  if (!out.length) {
    const seq = ['H', 'M'];
    const lengths = [Math.round(laps * 0.55), laps - Math.round(laps * 0.55)];
    const sim = Engine.simulateStrategy({ circuit, derived, driver, Data, laps, sequence: seq, lengths });
    out.push({ key: 'H-M', sequence: seq, stints: sim.stints, stops: 1, total: sim.total, confidence: 40 });
  }
  out.sort((a, b) => a.total - b.total);
  const trimmed = out.slice(0, 6);
  const best = trimmed[0].total;
  for (let i = 0; i < trimmed.length; i++) trimmed[i].lossToBest = trimmed[i].total - best;
  return trimmed;
};

/* ---------------------------------------------------------------------------
 * ENGINEER FEEDBACK — turns simulation state into the phrases a driver would
 * actually say. Deliberately does NOT hand over the answer: it names the
 * symptom, not the setup change.
 * -------------------------------------------------------------------------*/
Engine.driverFeedback = function (o) {
  const { derived, driver, tyre, circuit, Data, rng } = o;
  const msgs = [];
  const bal = derived.dom.balance;
  const clarity = (driver.h.radio + (Engine.driverHas(driver, 'setup_genius') ? 12 : 0)) / 100;
  const noisy = rng.next() > clarity * 0.9;

  if (bal > 0.522) msgs.push({ t: 'The rear is loose on entry, I have no confidence turning in.', axis: 'rear', conf: clarity });
  else if (bal < 0.478) msgs.push({ t: 'Big understeer mid-corner, the front just will not bite.', axis: 'front', conf: clarity });

  if (tyre && tyre.temp > Data.COMPOUNDS[tyre.compound].optTemp + Data.COMPOUNDS[tyre.compound].window)
    msgs.push({ t: 'Rears are overheating, I am losing them after two laps.', axis: 'temp_hi', conf: clarity });
  if (tyre && tyre.temp < Data.COMPOUNDS[tyre.compound].optTemp - Data.COMPOUNDS[tyre.compound].window)
    msgs.push({ t: 'The front-left is not switching on, no grip on the out lap.', axis: 'temp_lo', conf: clarity });

  if (derived.dom.rideRisk > 62 && circuit.dna.lowSpeed > 0.14)
    msgs.push({ t: 'We are bottoming badly over the kerbs, it is unsettling the car.', axis: 'ride', conf: clarity });
  if (derived.dom.traction < 55 && circuit.dna.traction > 0.10)
    msgs.push({ t: 'I am spinning the rears on every exit, no drive out of the slow corners.', axis: 'traction', conf: clarity });
  if (derived.ch.drag > 66 && circuit.dna.straight > 0.24)
    msgs.push({ t: 'They are pulling away from me on the straight like I am parked.', axis: 'drag', conf: clarity });
  if (derived.dom.cooling < 42)
    msgs.push({ t: 'Temperatures are climbing, I am having to lift and coast already.', axis: 'cooling', conf: clarity });

  if (!msgs.length) msgs.push({ t: 'Car feels decent. I think there is a bit more in it.', axis: 'none', conf: clarity });
  /* Low-clarity drivers occasionally point at the wrong end of the car. */
  if (noisy && msgs.length && rng.chance(0.35)) msgs[0] = { t: 'Something is not right but I cannot tell you where.', axis: 'unclear', conf: clarity };
  return msgs;
};

/* "Why are we slow" — deterministic engineering report vs a chosen rival. */
Engine.paceReport = function (mine, theirs) {
  const total = mine.time - theirs.time;
  const rows = [];
  for (let i = 0; i < mine.domainSplit.length; i++) {
    const a = mine.domainSplit[i], b = theirs.domainSplit[i];
    rows.push({ label: a.label, delta: a.delta - b.delta, mine: a.value, theirs: b.value });
  }
  rows.sort((x, y) => y.delta - x.delta);
  return { total, rows, primary: rows[0], secondary: rows[1] };
};

/* ---------------------------------------------------------------------------
 * TECHNICAL ACADEMY SUPPORT
 *
 * Everything here is derived from the same model the race uses. There is no
 * hand-written "front wing matters 5 stars at Monaco" table: the stars are
 * measured by perturbing the component and asking the lap-time model what
 * happened. That way the teaching cannot drift away from the simulation.
 * -------------------------------------------------------------------------*/

/* How much is one component worth at one circuit, in seconds per lap, for a
   +10 swing in its development rating? */
Engine.componentSensitivity = function (componentKey, circuit, components, setup, Data) {
  const base = Engine.deriveCar(components, setup, circuit, Data);
  const bumped = Object.assign({}, components);
  bumped[componentKey] = Engine.clamp((bumped[componentKey] || 80) + 10, 0, 120);
  const up = Engine.deriveCar(bumped, setup, circuit, Data);
  const dna = circuit.dna;
  function index(d) {
    return dna.highSpeed * d.highSpeed + dna.medSpeed * d.medSpeed + dna.lowSpeed * d.lowSpeed +
           dna.straight * d.straight + dna.braking * d.braking + dna.traction * d.traction;
  }
  const gain = index(up.dom) - index(base.dom);
  return circuit.base * gain * PERF_TO_TIME;   /* seconds per lap */
};

/* Stars for every component at a circuit, normalised against the strongest
   component at that circuit so the scale means "relative to what else matters
   here" rather than an absolute number nobody can interpret. */
Engine.componentStars = function (circuit, components, setup, Data) {
  const raw = [];
  let max = 0;
  for (let i = 0; i < Data.COMPONENTS.length; i++) {
    const k = Data.COMPONENTS[i].key;
    const s = Engine.componentSensitivity(k, circuit, components, setup, Data);
    raw.push({ key: k, seconds: s });
    if (s > max) max = s;
  }
  for (let i = 0; i < raw.length; i++) {
    const frac = max > 0 ? raw[i].seconds / max : 0;
    raw[i].frac = frac;
    raw[i].stars = Engine.clamp(Math.round(frac * 4) + 1, 1, 5);
  }
  raw.sort((a, b) => b.seconds - a.seconds);
  return raw;
};

/* What a circuit demands, and what that implies for the car, straight from
   the DNA weights. */
Engine.circuitProfile = function (circuit) {
  const dna = circuit.dna;
  const demands = [
    { key: 'straight',  label: 'Straight-line efficiency', w: dna.straight },
    { key: 'highSpeed', label: 'High-speed downforce',     w: dna.highSpeed },
    { key: 'medSpeed',  label: 'Medium-speed balance',     w: dna.medSpeed },
    { key: 'lowSpeed',  label: 'Mechanical grip',          w: dna.lowSpeed },
    { key: 'braking',   label: 'Braking performance',      w: dna.braking },
    { key: 'traction',  label: 'Low-speed traction',       w: dna.traction }
  ];
  let max = 0;
  demands.forEach(d => { if (d.w > max) max = d.w; });
  demands.forEach(d => { d.stars = Engine.clamp(Math.round(d.w / max * 4) + 1, 1, 5); });
  demands.sort((a, b) => b.w - a.w);

  /* Downforce demand vs drag cost decides the wing level. */
  const cornering = dna.highSpeed + dna.medSpeed + dna.lowSpeed;
  const wing = cornering - dna.straight;
  const priorities = [
    { label: 'Rear wing', value: wing > 0.30 ? 'High downforce' : (wing > 0.10 ? 'Medium' : 'Low drag'),
      why: 'This lap is ' + Math.round(cornering * 100) + '% cornering and ' + Math.round(dna.straight * 100) +
           '% straight, so ' + (wing > 0.10 ? 'load is worth more than the drag it costs.' : 'drag costs more than the load is worth.') },
    { label: 'Front wing', value: dna.medSpeed + dna.lowSpeed > 0.34 ? 'High' : (cornering > 0.5 ? 'Medium-high' : 'Low-medium'),
      why: 'Front load is set by how much the car has to rotate: ' +
           Math.round((dna.medSpeed + dna.lowSpeed) * 100) + '% of this lap is medium and slow corners.' },
    { label: 'Floor', value: 'Maximum efficiency',
      why: 'The floor is the only surface that produces load without a matching drag penalty, so it is never the thing you compromise.' },
    { label: 'Suspension', value: dna.lowSpeed > 0.2 ? 'Soft, mechanical grip' : 'Stiff, aero platform',
      why: dna.lowSpeed > 0.2 ? 'Slow corners are decided by the tyre contact patch, not by aerodynamic load.'
                              : 'Fast corners need the floor held at a consistent height, which needs a stiff platform.' },
    { label: 'Brake cooling', value: circuit.brakeWear > 1.2 ? 'High' : (circuit.brakeWear > 0.95 ? 'Medium' : 'Low'),
      why: 'Braking energy here is ' + Math.round((circuit.brakeWear || 1) * 100) + '% of a normal circuit\'s.' },
    { label: 'PU cooling', value: circuit.trackTemp > 42 ? 'High' : (circuit.trackTemp > 34 ? 'Medium' : 'Low'),
      why: 'Track temperature runs around ' + circuit.trackTemp + '°C, and every degree of cooling costs drag.' },
    { label: 'Tyre management', value: circuit.tyreWear > 1.2 ? 'Critical' : (circuit.tyreWear > 1.0 ? 'Important' : 'Relaxed'),
      why: 'Tyre energy here is ' + Math.round((circuit.tyreWear || 1) * 100) + '% of a normal circuit\'s.' }
  ];
  return { demands, priorities, cornering, straight: dna.straight };
};

/* "If I change this, what happens?" — the predicted consequences of a proposed
   setup value, before the player commits to it. */
Engine.setupPreview = function (o) {
  const { components, setup, field, value, circuit, driver, Data } = o;
  const next = Object.assign({}, setup);
  next[field] = value;
  const a = Engine.deriveCar(components, setup, circuit, Data);
  const b = Engine.deriveCar(components, next, circuit, Data);

  const rows = [];
  function row(label, from, to, unit, goodHigh) {
    const d = to - from;
    if (Math.abs(d) < 0.05) return;
    rows.push({ label, delta: d, from, to, unit: unit || '', good: goodHigh ? d > 0 : d < 0 });
  }
  row('Front downforce', a.ch.downforceFront, b.ch.downforceFront, '', true);
  row('Rear downforce', a.ch.downforceRear, b.ch.downforceRear, '', true);
  row('Drag', a.ch.drag, b.ch.drag, '', false);
  row('Mechanical grip', a.ch.mechGrip, b.ch.mechGrip, '', true);
  row('Traction', a.dom.traction, b.dom.traction, '', true);
  row('Braking', a.dom.braking, b.dom.braking, '', true);
  row('Platform stability', a.ch.platformStability, b.ch.platformStability, '', true);
  row('Kerb tolerance', a.ch.kerbs, b.ch.kerbs, '', true);
  row('Cooling margin', a.dom.cooling, b.dom.cooling, '', true);
  row('Tyre kindness', a.ch.tyreKindness, b.ch.tyreKindness, '', true);

  const balA = a.dom.balance, balB = b.dom.balance;
  const shares = Engine.sectorShares(circuit);
  function lap(d) {
    return Engine.lapTime({
      Data, rng: null, derived: d, driver, circuit,
      tyre: Engine.newTyre('S', 0), fuelKg: 12, trackGrip: 0.94, wet: 0,
      energyEffect: 0, charge: 80, push: 'ATTACK', mode: 'quali', sectorShares: shares, dirtyAir: 0
    });
  }
  const la = lap(a), lb = lap(b);
  const domains = [];
  for (let i = 0; i < la.domainSplit.length; i++) {
    const d = lb.domainSplit[i].delta - la.domainSplit[i].delta;
    if (Math.abs(d) > 0.002) domains.push({ label: la.domainSplit[i].label, delta: d });
  }
  domains.sort((x, y) => Math.abs(y.delta) - Math.abs(x.delta));

  return {
    rows, domains,
    lapDelta: lb.time - la.time,
    balanceFrom: balA, balanceTo: balB,
    stintFrom: Engine.stintLength('M', circuit, a, driver, Data),
    stintTo: Engine.stintLength('M', circuit, b, driver, Data)
  };
};

/* The cause → effect chain for one component, expanded two levels: which
   channels it feeds, and which lap-time domains those channels decide. */
Engine.effectChain = function (componentKey, circuit, Data) {
  const comp = Data.componentByKey(componentKey);
  if (!comp) return null;
  /* Channel → domain influence, mirroring the aggregation in deriveCar. */
  const map = {
    downforceFront: [['highSpeed', 0.30], ['medSpeed', 0.21], ['lowSpeed', 0.08], ['braking', 0.13]],
    downforceRear:  [['highSpeed', 0.30], ['medSpeed', 0.21], ['lowSpeed', 0.08], ['traction', 0.22], ['braking', 0.13]],
    drag:           [['straight', -0.42]],
    straightline:   [['straight', 0.06]],
    power:          [['straight', 0.52]],
    activeAero:     [['straight', 0.16]],
    mechGrip:       [['lowSpeed', 0.56], ['medSpeed', 0.36], ['highSpeed', 0.18], ['traction', 0.24]],
    platformStability: [['highSpeed', 0.22], ['medSpeed', 0.22], ['braking', 0.22]],
    traction:       [['traction', 0.54], ['lowSpeed', 0.28]],
    braking:        [['braking', 0.52]],
    coolingCapacity:[['reliability', 0.40]],
    heat:           [['reliability', -0.40]],
    tyreKindness:   [['stintLength', 0.60]],
    rideSensitivity:[['kerbRisk', 0.60]],
    energyDeploy:   [['straight', 0.20]],
    energyRecovery: [['straight', 0.14]],
    energyCapacity: [['straight', 0.10]],
    fuelEfficiency: [['raceStart', 0.30]],
    reliability:    [['reliability', 0.60]],
    dirtyAir:       [['following', 0.60]],
    kerbs:          [['kerbRisk', -0.50]],
    aeroEfficiency: [['highSpeed', 0.20], ['medSpeed', 0.16], ['straight', 0.14]],
    weight:         [['lowSpeed', 0.10], ['braking', 0.10]]
  };
  const labels = {
    highSpeed: 'High-speed corners', medSpeed: 'Medium-speed corners', lowSpeed: 'Low-speed corners',
    straight: 'Straights', braking: 'Braking zones', traction: 'Traction zones',
    reliability: 'Reliability', stintLength: 'Stint length', kerbRisk: 'Kerb and bottoming risk',
    following: 'Pace when following', raceStart: 'Race starting weight'
  };
  const chain = [];
  for (const ch in comp.affects) {
    const outs = (map[ch] || []).map(function (m) {
      const weight = circuit && circuit.dna[m[0]] != null ? circuit.dna[m[0]] : 0.14;
      return { key: m[0], label: labels[m[0]] || m[0], strength: m[1], weightHere: weight };
    });
    outs.sort((a, b) => Math.abs(b.strength * b.weightHere) - Math.abs(a.strength * a.weightHere));
    chain.push({ channel: ch, weight: comp.affects[ch], outputs: outs });
  }
  chain.sort((a, b) => Math.abs(b.weight) - Math.abs(a.weight));
  return chain;
};

/* ---------------------------------------------------------------------------
 * SYNERGY
 * A family's bonus comes from how evenly its members are developed, scaled by
 * the family's overall level. Uneven development is actively punished, so a
 * single-component upgrade inside a family is worth less than the same points
 * spread across it.
 * -------------------------------------------------------------------------*/
Engine.synergy = function (components, Data) {
  const families = {};
  let total = 0;
  for (const fam in Data.FAMILIES) {
    const members = Data.FAMILIES[fam].members;
    let sum = 0, min = 999, max = -999;
    for (let i = 0; i < members.length; i++) {
      const v = components[members[i]] == null ? REF_RATING : components[members[i]];
      sum += v; if (v < min) min = v; if (v > max) max = v;
    }
    const mean = sum / members.length;
    const spread = max - min;
    /* Even (spread 0) gives the full bonus; a 12-point spread wipes it out and
       keeps going negative. */
    const evenness = 1 - spread / 12;
    const level = (mean - REF_RATING) / 10;
    const bonus = evenness * (1.4 + Math.max(0, level) * 0.9);
    families[fam] = { mean, spread, evenness, bonus, min, max,
                      name: Data.FAMILIES[fam].name, members };
    total += bonus;
  }
  return { families, total };
};

/* ---------------------------------------------------------------------------
 * REGULATIONS
 * A ruleset is a versioned list. These helpers turn it into the caps,
 * allowances and scalars the rest of the engine consumes.
 * -------------------------------------------------------------------------*/
Engine.ruleset = function (state, Data) {
  return (state && state.regulations) ? state.regulations : Engine.newRuleset(Data);
};
Engine.newRuleset = function (Data) {
  const src = Data.RULESET_2026;
  return {
    version: src.version, name: src.name, season: 2026,
    rules: src.rules.map(r => ({ id: r.id, value: r.value })),
    history: []
  };
};
Engine.ruleDef = function (id, Data) {
  const rs = Data.RULESET_2026.rules;
  for (let i = 0; i < rs.length; i++) if (rs[i].id === id) return rs[i];
  return null;
};
Engine.ruleValue = function (regs, id) {
  for (let i = 0; i < regs.rules.length; i++) if (regs.rules[i].id === id) return regs.rules[i].value;
  const d = null;
  return null;
};

/* Component rating ceilings implied by the current ruleset. */
Engine.regCaps = function (regs, Data) {
  const caps = {};
  for (let i = 0; i < regs.rules.length; i++) {
    const def = Engine.ruleDef(regs.rules[i].id, Data);
    if (!def || !def.effect || def.effect.kind !== 'cap') continue;
    caps[def.effect.component] = regs.rules[i].value;
  }
  /* Floor sub-surfaces share the floor ceiling. */
  if (caps.floorBody != null) {
    ['floorEdge', 'floorFences', 'floorBib', 'plank'].forEach(k => { caps[k] = caps.floorBody + 1; });
  }
  return caps;
};

/* Scalar rules multiply a channel. `at` is the neutral value, `per` the
   fractional change per unit away from it. */
Engine.regScalars = function (regs, Data) {
  const out = {};
  for (let i = 0; i < regs.rules.length; i++) {
    const def = Engine.ruleDef(regs.rules[i].id, Data);
    if (!def || !def.effect || def.effect.kind !== 'scalar') continue;
    const e = def.effect;
    out[e.target] = (out[e.target] || 0) + (regs.rules[i].value - e.at) * e.per;
  }
  return out;
};

Engine.regAllowance = function (regs, Data, target) {
  for (let i = 0; i < regs.rules.length; i++) {
    const def = Engine.ruleDef(regs.rules[i].id, Data);
    if (def && def.effect && def.effect.kind === 'allowance' && def.effect.target === target) return regs.rules[i].value;
  }
  return null;
};

/* Per-component legality status shown in the Academy and the garage. */
Engine.legality = function (componentKey, rating, regs, Data, teamState) {
  const caps = Engine.regCaps(regs, Data);
  const cap = caps[componentKey];
  if (teamState && teamState.illegal && teamState.illegal.component === componentKey) {
    return teamState.fiaSuspicion > 40 ? Data.LEGALITY.INVESTIGATION : Data.LEGALITY.ILLEGAL;
  }
  if (cap == null) return Data.LEGALITY.LEGAL;
  if (rating > cap) return Data.LEGALITY.ILLEGAL;
  if (rating > cap - 2.5) return Data.LEGALITY.RESTRICTED;
  return Data.LEGALITY.LEGAL;
};

/* ---------------------------------------------------------------------------
 * PROCEDURAL REGULATION PROPOSALS
 * Generated from the rulebook itself rather than drawn from a fixed list, so a
 * long career never runs out of proposals and no two careers see the same
 * sequence of rule changes.
 * -------------------------------------------------------------------------*/
Engine.generateProposals = function (regs, Data, rng, count) {
  const mutable = regs.rules.filter(function (r) {
    const d = Engine.ruleDef(r.id, Data);
    return d && d.mutable;
  });
  const out = [], used = {};
  let guard = 40;
  while (out.length < (count || 3) && guard-- > 0) {
    const r = mutable[rng.int(0, mutable.length - 1)];
    if (used[r.id]) continue;
    used[r.id] = true;
    const def = Engine.ruleDef(r.id, Data);
    const dir = rng.chance(0.5) ? 1 : -1;
    /* Magnitude scales with the size of the number so a 768kg weight limit and
       a 97-rating ceiling both move by a sensible amount. */
    const step = Math.max(1, Math.round(Math.abs(r.value) * rng.range(0.02, 0.07)));
    const delta = dir * step;
    out.push({
      id: 'gen-' + r.id + '-' + delta,
      rule: r.id,
      delta: delta,
      title: (dir > 0 ? 'Increase' : 'Reduce') + ' ' + def.name.toLowerCase(),
      pitch: Engine.proposalPitch(def, dir, step)
    });
  }
  return out;
};

Engine.proposalPitch = function (def, dir, step) {
  const up = dir > 0;
  const map = {
    cap: up ? 'Give the aerodynamicists more freedom here and accept that the biggest budgets will use it best.'
            : 'Cut development headroom to bring the field together and reduce the cost of chasing it.',
    scalar: up ? 'Push more performance through this system and reward the teams that master it.'
               : 'Dial it back so the racing depends less on getting this one thing exactly right.',
    allowance: up ? 'Loosen the allocation. More running, more freedom, considerably more money.'
                  : 'Tighten the allocation. Cheaper for everyone, and a great deal more penalties.'
  };
  return (map[def.effect.kind] || 'A change to ' + def.name.toLowerCase() + '.') +
         ' Proposed change: ' + (up ? '+' : '') + (up ? step : -step) + ' ' + def.unit + '.';
};

/* ---------------------------------------------------------------------------
 * DRIVER REGENERATION
 * Drivers retire and are replaced. Without this a fifty-season career ends with
 * a grid of sixty-year-olds and no new talent, which is the single thing that
 * breaks a long save.
 * -------------------------------------------------------------------------*/
Engine.retirementChance = function (driver, form) {
  const age = driver.age;
  if (age < 32) return 0;
  let p = (age - 31) * 0.055;
  if (age > 38) p += (age - 38) * 0.13;
  /* A driver still winning things hangs on; one who is struggling does not. */
  p -= (form || 0) * 0.10;
  p -= (Engine.driverOverall(driver) - 86) * 0.010;
  return Engine.clamp(p, 0, 0.95);
};

Engine.generateDriver = function (Data, rng, o) {
  o = o || {};
  const first = Data.NAME_FIRST[rng.int(0, Data.NAME_FIRST.length - 1)];
  const last = Data.NAME_LAST[rng.int(0, Data.NAME_LAST.length - 1)];
  const potential = Engine.clamp(Math.round(rng.gauss(o.potential || 88, 6)), 72, 99);
  /* A rookie arrives well short of their ceiling; the gap is what they spend a
     career closing, and some never do. */
  const startGap = rng.range(10, 20);
  const b = Engine.clamp(Math.round(potential - startGap), 55, 92);
  function v(spread) { return Engine.clamp(Math.round(rng.gauss(b, spread)), 45, 96); }
  const s = {
    qual: v(4), race: v(4), tyre: v(5), wet: v(6), over: v(5), def: v(5),
    cons: v(5), craft: v(5), adapt: Engine.clamp(Math.round(rng.gauss(88, 6)), 60, 99),
    mental: v(6), pot: potential, exp: Engine.clamp(Math.round(rng.gauss(48, 8)), 30, 66)
  };
  function h() { return Engine.clamp(Math.round(rng.gauss(75, 12)), 40, 99); }
  const traits = [];
  if (rng.chance(0.55)) traits.push('fast_learner');
  if (rng.chance(0.12)) traits.push('elite_qualifier');
  if (rng.chance(0.10)) traits.push('tyre_whisperer');
  if (rng.chance(0.08)) traits.push('rain_master');
  if (rng.chance(0.08)) traits.push('ice_cold');
  return {
    id: 'gen_' + last.toLowerCase().replace(/[^a-z]/g, '') + '_' + rng.int(100, 999),
    code: last.slice(0, 3).toUpperCase(),
    first: first, last: last, name: first + ' ' + last,
    num: o.num || rng.int(2, 99),
    age: rng.int(18, 22),
    nation: Data.NATION_CODES[rng.int(0, Data.NATION_CODES.length - 1)],
    generated: true,
    s: s,
    h: { agg: h(), risk: h(), radio: h(), morale: h(), media: h(), loyal: h(),
         adapt: h(), rain: h(), press: h(), pol: Engine.clamp(Math.round(rng.gauss(55, 12)), 30, 90) },
    traits: traits
  };
};

/* ---------------------------------------------------------------------------
 * FIA WORKING GROUP
 * Each team votes on a proposal according to whether it helps or hurts them,
 * measured by re-deriving their car under the proposed ruleset. Political
 * influence and the player's lobbying shift the count.
 * -------------------------------------------------------------------------*/
Engine.proposalImpact = function (proposal, regs, teamComponents, Data) {
  const before = Engine.regCaps(regs, Data);
  const after = Object.assign({}, regs, {
    rules: regs.rules.map(r => r.id === proposal.rule ? { id: r.id, value: r.value + proposal.delta } : r)
  });
  const afterCaps = Engine.regCaps(after, Data);
  const setup = Data.defaultSetup();
  const a = Engine.deriveCar(teamComponents, setup, null, Data, { caps: before });
  const b = Engine.deriveCar(teamComponents, setup, null, Data, { caps: afterCaps });
  /* A generic circuit weighting, since a rule applies to the whole season. */
  const w = { highSpeed: 0.20, medSpeed: 0.22, lowSpeed: 0.16, straight: 0.22, braking: 0.10, traction: 0.10 };
  function idx(d) {
    return w.highSpeed * d.highSpeed + w.medSpeed * d.medSpeed + w.lowSpeed * d.lowSpeed +
           w.straight * d.straight + w.braking * d.braking + w.traction * d.traction;
  }
  const scalarsA = Engine.regScalars(regs, Data), scalarsB = Engine.regScalars(after, Data);
  let scalarDelta = 0;
  for (const k in scalarsB) scalarDelta += (scalarsB[k] - (scalarsA[k] || 0)) * 0.4;
  return idx(b.dom) - idx(a.dom) + scalarDelta;
};

Engine.runVote = function (proposal, regs, state, Data, rng) {
  const votes = [];
  for (let i = 0; i < Data.TEAMS.length; i++) {
    const team = Data.TEAMS[i];
    const ts = state.teams[team.id];
    const impact = Engine.proposalImpact(proposal, regs, ts.components, Data);
    /* Teams also vote on principle: a team behind on points backs anything that
       shakes the order up. */
    const standing = ts.points;
    let best = 0;
    for (const t in state.teams) if (state.teams[t].points > best) best = state.teams[t].points;
    const behind = best > 0 ? 1 - standing / best : 0;
    let score = impact * 1.0 + behind * 0.35 - 0.05;
    if (ts.lobby && ts.lobby[proposal.id]) score += ts.lobby[proposal.id];
    score += rng.gauss(0, 0.20);
    votes.push({ teamId: team.id, impact, score, vote: score > 0 ? 'for' : 'against' });
  }
  const forCount = votes.filter(v => v.vote === 'for').length;
  return { votes, for: forCount, against: votes.length - forCount, passed: forCount > votes.length / 2 };
};

/* ---------------------------------------------------------------------------
 * COMPONENT LIFE AND GRID PENALTIES
 * -------------------------------------------------------------------------*/
Engine.newElementPool = function (Data) {
  const p = {};
  for (let i = 0; i < Data.PU_ELEMENTS.length; i++) p[Data.PU_ELEMENTS[i].key] = { used: 1, wear: 0, fitted: 1 };
  return p;
};

/* Wear a driver's elements over a race distance. Returns any that failed their
   life and had to be replaced. */
Engine.wearElements = function (pool, Data, o) {
  const replaced = [];
  for (let i = 0; i < Data.PU_ELEMENTS.length; i++) {
    const el = Data.PU_ELEMENTS[i];
    const slot = pool[el.key];
    if (!slot) continue;
    /* Each element has its own design life, so they expire at different points
       in the season and taking a penalty stays a choice about where. */
    let rate = 100 / (el.races || 6);
    rate *= o.stress || 1;
    rate *= 1 - ((o.reliability || 50) - 50) * 0.006;
    if (el.key === 'ice' || el.key === 'turbo') rate *= (o.fuelUse || 1);
    slot.wear += rate;
    if (slot.wear >= 100) {
      slot.wear = 0;
      slot.used += 1;
      slot.fitted += 1;
      replaced.push(el.key);
    }
  }
  return replaced;
};

/* Grid drop for a driver, from how far past the allocation they are. */
Engine.gridPenalty = function (pool, Data, allowance) {
  let places = 0;
  const parts = [];
  for (let i = 0; i < Data.PU_ELEMENTS.length; i++) {
    const el = Data.PU_ELEMENTS[i];
    const slot = pool[el.key];
    if (!slot) continue;
    const over = slot.used - allowance;
    if (over <= 0) continue;
    for (let n = 0; n < over; n++) {
      places += Data.PENALTY_LADDER[Math.min(n, Data.PENALTY_LADDER.length - 1)];
    }
    parts.push({ key: el.key, name: el.name, over });
  }
  if (places >= 15) return { places: 99, backOfGrid: true, parts };
  return { places, backOfGrid: false, parts };
};

/* ---------------------------------------------------------------------------
 * TELEMETRY TRACES
 *
 * Generated on demand from the circuit geometry, the car and a target lap
 * time, rather than stored per lap. A stored trace would be ~200 samples a lap
 * and would bloat every save; regenerating is deterministic and costs nothing.
 * -------------------------------------------------------------------------*/
Engine.lapTrace = function (o) {
  const { circuit, derived, Data, lapTime } = o;
  const path = Engine.trackPath(circuit, Data);
  const n = 200;
  const corners = path.corners;
  const dom = derived.dom;
  const segLen = circuit.length * 1000 / n;
  const accel = 4.6 + (dom.traction - 60) * 0.030;   /* m/s^2 */
  const decel = 34.0 + (dom.braking - 60) * 0.130;   /* m/s^2, aero-assisted */

  /* Corner minimum speeds come from the circuit geometry and the car's
     cornering performance. They are physical, so they are NOT scaled to hit
     the lap time — instead the straight-line ceiling is solved for. Scaling
     everything uniformly produced 118 km/h hairpins at Monza. */
  const cornerScale = 1 + (dom.highSpeed - 60) * 0.0022;

  function profile(vTop) {
    const sp = new Array(n);
    for (let i = 0; i < n; i++) {
      const pos = i / n;
      let nearest = null, nd = 9;
      for (let c = 0; c < corners.length; c++) {
        let d = Math.abs(corners[c].pos - pos);
        d = Math.min(d, 1 - d);
        if (d < nd) { nd = d; nearest = corners[c]; }
      }
      let v = vTop;
      if (nearest) {
        const reach = 0.5 / Math.max(1, corners.length);
        const infl = Math.max(0, 1 - nd / reach);
        v = Engine.lerp(vTop, Math.min(vTop, nearest.speed * cornerScale), Math.pow(infl, 0.7));
      }
      sp[i] = v / 3.6;
    }
    for (let pass = 0; pass < 2; pass++) {
      for (let i = 0; i < n; i++) {
        const prev = sp[(i - 1 + n) % n];
        const lim = Math.sqrt(prev * prev + 2 * accel * segLen);
        if (sp[i] > lim) sp[i] = lim;
      }
      for (let i = n - 1; i >= 0; i--) {
        const next = sp[(i + 1) % n];
        const lim = Math.sqrt(next * next + 2 * decel * segLen);
        if (sp[i] > lim) sp[i] = lim;
      }
    }
    let t = 0;
    for (let i = 0; i < n; i++) t += segLen / Math.max(4, sp[i]);
    return { sp, t };
  }

  /* Bisect on the straight-line ceiling until the profile integrates to the
     lap time we were given — but never above a physically sensible terminal
     speed for this car. On corner-heavy circuits the geometry cannot reach the
     target lap time at a believable top speed; there the trace is a shape and
     the sample times are normalised to the real lap time at the end. */
  const vCeiling = Engine.clamp(248 + circuit.dna.straight * 200 + (dom.straight - 60) * 0.60, 258, 355);
  let lo = 120, hi = vCeiling, out = profile(vCeiling);
  for (let it = 0; it < 14; it++) {
    const mid = (lo + hi) / 2;
    out = profile(mid);
    if (out.t > lapTime) lo = mid; else hi = mid;
  }
  const speed = out.sp.map(v => v * 3.6);
  const vMaxActual = Math.max.apply(null, speed);

  const samples = [];
  let t = 0, charge = 82;
  for (let i = 0; i < n; i++) {
    const nxt = speed[(i + 1) % n];
    const rising = nxt > speed[i] + 1.2;
    const falling = nxt < speed[i] - 1.2;
    const throttle = rising ? 100 : (falling ? 0 : Engine.clamp(40 + (speed[i] / vMaxActual) * 60, 0, 100));
    const brake = falling ? Engine.clamp((speed[i] - nxt) * 3.2, 0, 100) : 0;
    const gear = Engine.clamp(Math.round(speed[i] / (vMaxActual / 8)), 1, 8);
    const deploy = rising && charge > 6 ? Engine.clamp((derived.ch.energyDeploy - 30) * 1.3, 0, 100) : 0;
    const recover = brake > 10 ? Engine.clamp((derived.ch.energyRecovery - 30) * 1.3, 0, 100) : 0;
    charge = Engine.clamp(charge - deploy * 0.020 + recover * 0.022, 2, 100);
    t += segLen / Math.max(12, speed[i] / 3.6);
    samples.push({
      i, dist: (i / n) * circuit.length * 1000, pos: i / n, t,
      speed: Math.round(speed[i]), throttle: Math.round(throttle), brake: Math.round(brake),
      gear, charge: Math.round(charge), deploy: Math.round(deploy), recover: Math.round(recover),
      activeAero: throttle > 95 && speed[i] > vMaxActual * 0.78 ? 1 : 0
    });
  }
  const totalT = samples[n - 1].t || 1;
  for (let i = 0; i < n; i++) samples[i].t = samples[i].t / totalT * lapTime;
  return { samples, corners, vTop: Math.round(vMaxActual), lapTime, length: circuit.length };
};

/* Two traces compared: per-sample delta, plus where the time went. */
Engine.compareTraces = function (a, b) {
  const n = Math.min(a.samples.length, b.samples.length);
  const delta = [];
  for (let i = 0; i < n; i++) delta.push({ pos: a.samples[i].pos, d: b.samples[i].t - a.samples[i].t,
                                           vA: a.samples[i].speed, vB: b.samples[i].speed });
  const thirds = [0, 0, 0];
  for (let i = 0; i < n; i++) {
    const seg = Math.min(2, Math.floor(i / n * 3));
    const prev = i === 0 ? 0 : (b.samples[i - 1].t - a.samples[i - 1].t);
    thirds[seg] += (delta[i].d - prev);
  }
  return { delta, thirds, total: delta[n - 1].d,
           topSpeedA: Math.max.apply(null, a.samples.map(s => s.speed)),
           topSpeedB: Math.max.apply(null, b.samples.map(s => s.speed)) };
};

/* ---------------------------------------------------------------------------
 * PACKAGE DEVELOPMENT
 * -------------------------------------------------------------------------*/
Engine.resolvePackage = function (pkg, team, expected, rng) {
  const results = [];
  for (let i = 0; i < pkg.members.length; i++) {
    const r = Engine.resolveProject({ type: { risk: 0.16 }, expectedGain: expected }, team, rng);
    results.push({ component: pkg.members[i], actual: r.actual, verdict: r.verdict });
  }
  return results;
};
</script>

   Data.DRIVERS is the working roster for the current save: the base grid minus
   whoever has retired, plus whoever has been generated since.

   INVARIANT: nothing may splice Data.BASE_DRIVERS. An earlier version retired
   drivers by removing them from the shipped table, which destroyed the data for
   every subsequent career in the same page session — a new game started after a
   long one began with a grid of fourteen. */
Data.BASE_DRIVERS = Data.DRIVERS.slice();

Data.driverById = function (id) {
  for (let i = 0; i < Data.DRIVERS.length; i++) if (Data.DRIVERS[i].id === id) return Data.DRIVERS[i];
  return null;
};

/* Rebuild the working roster from a save (or from nothing, for a new career). */
Data.restoreRoster = function (generated, retiredIds) {
  const retired = {};
  (retiredIds || []).forEach(function (id) { retired[id] = true; });
  Data.DRIVERS = Data.BASE_DRIVERS.filter(d => !retired[d.id]);
  (generated || []).forEach(function (d) { Data.DRIVERS.push(d); });
};
Data.retireDriver = function (id) {
  for (let i = 0; i < Data.DRIVERS.length; i++) {
    if (Data.DRIVERS[i].id === id) { Data.DRIVERS.splice(i, 1); return; }
  }
};

/* ---------------------------------------------------------------------------
 * CIRCUITS
 * dna weights must sum to ~1.0 — they are the fraction of lap time spent in
 * each performance domain, and Engine.lapTime() uses them directly.
 * `base` is a reference lap time in seconds for a 100-rated car.
 * -------------------------------------------------------------------------*/
/* `prestige` (0..100) drives calendar rotation probabilistically. High-prestige
   venues almost never lose their slot and are the first back when one opens;
   low-prestige ones come and go. Nothing about the calendar past 2026 is
   predetermined, so two players' 2040 calendars will differ. */
function ckt(id, name, country, o) {
  return Object.assign({
    id, name, country, prestige: 55,
    length: 5.0, laps: 57, corners: 15, base: 90, pitLoss: 21.0,
    scChance: 0.22, rainChance: 0.20, airTemp: 24, trackTemp: 38, altitude: 0,
    tyreWear: 1.0, brakeWear: 1.0, fuelUse: 1.0, overtaking: 0.5, gripStart: 0.86,
    dna: { highSpeed: 0.18, medSpeed: 0.20, lowSpeed: 0.14, straight: 0.22, braking: 0.12, traction: 0.14 },
    target: {}, notes: '', seed: 1
  }, o);
}

  if (children != null) {
    const arr = Array.isArray(children) ? children : [children];
    for (let i = 0; i < arr.length; i++) {
      const c = arr[i];
      if (c == null || c === false) continue;
      el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
    }
  }
  return el;
};
App.$ = function (sel, root) { return (root || document).querySelector(sel); };
App.$$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
App.clear = function (el) { while (el && el.firstChild) el.removeChild(el.firstChild); return el; };

/* Timers are registered so screen changes can cancel everything cleanly.
   Any setInterval created outside this helper will leak across screens. */
App.every = function (ms, fn) { const id = setInterval(fn, ms); App._timers.push(id); return id; };
App.after = function (ms, fn) { const id = setTimeout(fn, ms); App._timers.push(id); return id; };
App.stopTimers = function () { for (let i = 0; i < App._timers.length; i++) clearInterval(App._timers[i]); App._timers = []; };

App.fmt = {

  sec: Engine.fmtSector,
  signed: function (v, dp) { const n = Number(v).toFixed(dp == null ? 2 : dp); return (v > 0 ? '+' : '') + n; },
  clock: function (s) {
    s = Math.max(0, Math.floor(s));
    const m = Math.floor(s / 60);
    return m + ':' + String(s % 60).padStart(2, '0');
  },
  money: function (v) { return '$' + Number(v).toFixed(1) + 'M'; }
};

/* ---------------------------------------------------------------------------
 * PERSISTENCE
 * Storage is behind an adapter so the game still runs (in memory) when
 * localStorage is unavailable — sandboxed iframes, private mode, tests.
 * -------------------------------------------------------------------------*/
App.store = (function () {
  let mem = {};
  let ok = false;
  try {
    const k = '__f1probe';
    window.localStorage.setItem(k, '1');
    window.localStorage.removeItem(k);
    ok = true;
  } catch (e) { ok = false; }
  return {
    available: ok,
    get: function (k) { try { return ok ? window.localStorage.getItem(k) : (mem[k] || null); } catch (e) { return mem[k] || null; } },
    set: function (k, v) { try { if (ok) window.localStorage.setItem(k, v); else mem[k] = v; } catch (e) { mem[k] = v; } },
    del: function (k) { try { if (ok) window.localStorage.removeItem(k); else delete mem[k]; } catch (e) { delete mem[k]; } }
  };
})();

App.save = function () {
  if (!App.state) return false;
  App.state.savedAt = Date.now();
  try {
    App.store.set(App.SAVE_KEY, JSON.stringify(App.state));
    return true;
  } catch (e) {
    App.toast('Could not save: ' + e.message, 'bad');
    return false;
  }
};
App.hasSave = function () { return !!App.store.get(App.SAVE_KEY); };
App.load = function () {
  const raw = App.store.get(App.SAVE_KEY);
  if (!raw) return false;
  try {
    const s = JSON.parse(raw);
    if (s.version !== App.VERSION) {
      App.toast('That save was made by an older version of the game and cannot be opened. Start a new career.', 'bad');
      return false;
    }
    /* Rebuild the live roster before anything reads it: generated drivers only
       exist in the save, not in the shipped data tables. */
    Data.restoreRoster(s.generatedDrivers || [], s.retiredDrivers || []);
    App.state = s;
    return true;
  } catch (e) { return false; }
};
App.deleteSave = function () {
  App.store.del(App.SAVE_KEY);
  /* Clear saves written by earlier builds too, so "delete save" really does
     leave a clean slate rather than leaving a stale one to be found later. */
  for (let i = 0; i < App.LEGACY_KEYS.length; i++) App.store.del(App.LEGACY_KEYS[i]);
};

/* ---------------------------------------------------------------------------
 * STATE CREATION
 *
 * INVARIANT: state.teams always has exactly one entry per Data.TEAMS id, and
 * state.drivers exactly one per Data.DRIVERS id. Session code indexes these
 * directly without existence checks.
 * -------------------------------------------------------------------------*/
App.newGame = function (opts) {
  Data.restoreRoster([], []);        /* a new career starts from the real grid */
  /* Guard the preconditions the rest of the game assumes, so a broken roster
     produces a clear message here rather than an undefined read ten screens
     later. See invariants 4.9 and 4.30. */
  if (Data.DRIVERS.length !== Data.BASE_DRIVERS.length) {
    throw new Error('Driver roster is corrupt (' + Data.DRIVERS.length + ' of ' + Data.BASE_DRIVERS.length + ').');
  }
  if (!Data.TEAMS.length || !Data.CIRCUITS.length) throw new Error('Content tables failed to load.');
  const seed = opts.seed || (Date.now() % 2147483647);
  const rng = Engine.rng(seed);
  const st = {
    version: App.VERSION,
    createdAt: Date.now(),
    seed: seed,
    rngSeed: rng.s,
    season: 2026,
    round: 1,
    role: opts.role,
    controlType: opts.controlType,        /* 'team' | 'driver' | 'none' */
    controlId: opts.controlId,
    teams: {},
    drivers: {},
    calendar: Data.CALENDAR_2026.slice(),
    weekend: null,
    results: [],                          /* one entry per completed round */
    log: [],
    interventions: 0,
    regulations: Engine.newRuleset(Data),
    workingGroup: null,
    academy: { done: {}, score: 0, attempts: 0 },
    lab: null,
    generatedDrivers: [],
    retiredDrivers: [],
    settings: { depth: 'DETAILED', speed: 5, autoEngineer: true, eduLevel: 'intermediate',
                driverRetirement: false }
  };

  for (let i = 0; i < Data.TEAMS.length; i++) {
    const t = Data.TEAMS[i];
    st.teams[t.id] = {
      id: t.id,
      components: Data.launchComponents(t),
      ratings: Object.assign({}, t.ratings),
      budget: t.ratings.budget,
      atr: 100,                            /* aerodynamic testing allowance, % */
      cfd: 100,
      points: 0, wins: 0, podiums: 0,
      projects: [],
      spec: 'A',
      setup: {},                           /* circuitId -> setup */
      illegal: null,                       /* {component, gain, risk} if running a grey-area part */
      fiaSuspicion: 0,
      lobby: {},                           /* proposalId -> influence bought this season */
      packages: []
    };
  }
  for (let i = 0; i < Data.DRIVERS.length; i++) {
    const d = Data.DRIVERS[i];
    st.drivers[d.id] = {
      id: d.id,
      teamId: d.teamId,
      age: d.age,
      s: Object.assign({}, d.s),
      h: Object.assign({}, d.h),
      traits: d.traits.slice(),
      points: 0, wins: 0, podiums: 0, poles: 0, dnfs: 0,
      form: 0,          /* -1..+1, moves with results */
      morale: 62,
      xp: 0,
      /* Power unit element allocation, tracked across the season. Exceeding it
         is a grid penalty, which is a strategic choice rather than a failure. */
      elements: Engine.newElementPool(Data),
      gridPenalty: 0
    };
  }
  App.state = st;
  App.logEvent('Career started. ' + Data.ROLES[opts.role].name + ' — ' + App.controlLabel() + '.');
  return st;
};

App.logEvent = function (text, kind) {
  if (!App.state) return;
  App.state.log.unshift({ t: Date.now(), round: App.state.round, text, kind: kind || 'info' });
  if (App.state.log.length > 240) App.state.log.length = 240;
};

App.controlLabel = function () {
  const st = App.state;
  if (!st || st.controlType === 'none') return 'Observing the championship';
  if (st.controlType === 'team') { const t = Data.teamById(st.controlId); return t ? t.name : '—'; }
  const d = Data.driverById(st.controlId); return d ? d.name : '—';
};
App.myTeamId = function () {
  const st = App.state;
  if (!st) return null;
  if (st.controlType === 'team') return st.controlId;
  if (st.controlType === 'driver') { const d = Data.driverById(st.controlId); return d ? d.teamId : null; }
  return null;
};
App.myDriverIds = function () {
  const st = App.state;
  if (!st) return [];
  if (st.controlType === 'driver') return [st.controlId];
  const tid = App.myTeamId();
  if (!tid) return [];
  return Data.DRIVERS.filter(d => d.teamId === tid).map(d => d.id);
};
App.can = function (power) {
  const st = App.state;
  if (!st) return false;
  const role = Data.ROLES[st.role];
  return !!role && role.powers.indexOf(power) !== -1;
};

/* Live driver object = static identity merged with mutable progression. */
App.driver = function (id) {
  const base = Data.driverById(id);
  const live = App.state.drivers[id];
  return { id, code: base.code, name: base.name, first: base.first, last: base.last,
           num: base.num, teamId: live.teamId, age: live.age,
           s: live.s, h: live.h, traits: live.traits, form: live.form, morale: live.morale };
};
App.teamOf = function (driverId) { return Data.teamById(App.state.drivers[driverId].teamId); };

/* Setup for a team at a circuit, creating a sensible default from the
   circuit's engineer recommendation the first time it is asked for. */
App.setupFor = function (teamId, circuitId) {
  const t = App.state.teams[teamId];
  if (!t.setup[circuitId]) {
    const c = Data.circuitById(circuitId);
    const s = Data.defaultSetup();
    for (const k in c.target) s[k] = c.target[k];
    /* AI teams drift off the ideal by an amount set by their engineering rating. */
    if (teamId !== App.myTeamId()) {
      const rng = Engine.rng(App.state.seed + circuitId.length * 31 + teamId.length * 17);
      const err = (100 - t.ratings.engineering) * 0.22;
      for (const k in s) s[k] = Engine.clamp(Math.round(s[k] + rng.gauss(0, err)), 0, 50);
    }
    t.setup[circuitId] = s;
  }
  return t.setup[circuitId];
};

/* INVARIANT: every derived car in the game goes through here, so regulation
   caps and the grey-area bypass are applied in exactly one place. A caller that
   builds its own deriveCar() call will silently ignore the rulebook. */
App.derivedFor = function (driverId, circuitId) {
  const teamId = App.state.drivers[driverId].teamId;
  const team = App.state.teams[teamId];
  const caps = Engine.regCaps(App.state.regulations, Data);
  let comps = team.components;
  if (team.illegal) {
    /* The illegal part is precisely the bit that ignores the ceiling. */
    comps = Object.assign({}, comps);
    const k = team.illegal.component;
    comps[k] += team.illegal.gain;
    caps[k] = Math.max(caps[k] == null ? 0 : caps[k], comps[k]);
  }
  return Engine.deriveCar(comps, App.setupFor(teamId, circuitId), Data.circuitById(circuitId), Data, { caps });
};

/* Should the engineers make this decision for you?
   Rival teams always run themselves. Your own cars only do when the auto
   engineer is on — which is what makes the toggle mean something rather than
   being a switch that writes a field nobody reads. */
App.autoFor = function (driverId) {
  if (App.myDriverIds().indexOf(driverId) === -1) return true;
  return !!(App.state.settings && App.state.settings.autoEngineer);
};

          onclick: function () {
            /* A button that silently does nothing is the worst failure there
               is: the player has no idea whether they mis-clicked, whether the
               game is broken, or whether it is thinking. If starting a career
               fails, say so and offer the one thing that fixes it. */
            try {
              App.newGame({
                role: pick.role,
                controlType: pick.role === 'OBSERVER' ? 'none' : pick.controlType,
                controlId: pick.controlId
              });
            } catch (err) {
              App.startFailed(err);
              return;
            }
            /* A failed save must not stop the career: play on in memory. */
            try { App.save(); } catch (err) {
              App.toast('Could not save to this browser. The career will run but will not persist.', 'bad');
            }
            App.route('hub');
          }
        })
      ]));
      root.appendChild(wrap);
    }
    draw();
  }
};

/* ---------------------------------------------------------------------------
 * ENTRY POINT
 * -------------------------------------------------------------------------*/
/* Shown when a career cannot be created at all. */
App.startFailed = function (err) {
  const body = App.modal('The season could not be started');
  body.appendChild(App.h('p.lede', { text: 'Something went wrong setting up the championship. This is a bug, not something you did.' }));
  body.appendChild(App.h('p.muted', { text: String((err && err.message) || err) }));
  body.appendChild(App.h('p.muted', { text: 'Almost always this is old data left in the browser by a previous version of the game. Clearing it fixes it.' }));
  body.appendChild(App.h('div.godrow', {}, [
    App.h('button.btn.btn--sm.btn--primary', { id: 'btn-reset-all', text: 'Clear stored data and try again', onclick: function () {
      App.resetEverything();
    } }),
    App.h('button.btn.btn--sm.btn--ghost', { text: 'Close', onclick: App.closeModal })
  ]));
};

/* The escape hatch. Wipes every trace of the game from this browser and
   rebuilds the shipped grid, so a player in a broken state can recover without
   opening developer tools. */
App.resetEverything = function () {
  App.deleteSave();
  try {
    const keys = [];
    for (let i = 0; i < window.localStorage.length; i++) {
      const k = window.localStorage.key(i);
      if (k && k.indexOf('f1godmode') === 0) keys.push(k);
    }
    keys.forEach(k => window.localStorage.removeItem(k));
  } catch (e) { /* storage unavailable; nothing to clear */ }
  Data.restoreRoster([], []);
  App.state = null;
  App.closeModal();
  App.toast('Stored data cleared.');
  App.route('boot');
};

App.boot = function () {
  if (!App.$('#toasts')) document.body.appendChild(App.h('div', { id: 'toasts' }));
  App.route('boot');
};

if (typeof window !== 'undefined') {
  window.App = App;
  window.addEventListener('DOMContentLoaded', function () { App.boot(); });
}
</script>

<script>

/* ---------------------------------------------------------------------------
 * STANDINGS
 * -------------------------------------------------------------------------*/
/* Countback: level on points, the driver with more wins is ahead. Level on
   wins, more seconds, then more thirds, and so on all the way down the
   classification. This is how the sporting regulations actually break a tie,
   and it matters — championships have been decided on it. */
App.hub.countbackFor = function (id) {
  const st = App.state;
  const counts = new Array(23).fill(0);
  st.results.forEach(function (r) {
    (r.classification || []).forEach(function (row) {
      if (row.id === id && !row.dnf && !row.dsq) counts[Math.min(22, row.pos)] += 1;
    });
  });
  return counts;
};

App.hub.compareCountback = function (a, b) {
  const ca = App.hub.countbackFor(a), cb = App.hub.countbackFor(b);
  for (let pos = 1; pos <= 22; pos++) {
    if (cb[pos] !== ca[pos]) return cb[pos] - ca[pos];
  }
  return 0;
};

App.hub.driverStandings = function () {
  const st = App.state;
  const arr = Data.DRIVERS.map(function (d) {
    const s = st.drivers[d.id];
    return { id: d.id, teamId: s.teamId, points: s.points, wins: s.wins,
             podiums: s.podiums, poles: s.poles, dnfs: s.dnfs };
  });
  arr.sort(function (a, b) {
    if (b.points !== a.points) return b.points - a.points;
    const cb = App.hub.compareCountback(a.id, b.id);
    if (cb !== 0) return cb;
    if (b.poles !== a.poles) return b.poles - a.poles;
    return a.dnfs - b.dnfs;
  });
  return arr;
};
App.hub.teamStandings = function () {
  const st = App.state;
  const arr = Data.TEAMS.map(function (t) {
    const s = st.teams[t.id];
    return { id: t.id, points: s.points, wins: s.wins, podiums: s.podiums };
  });
  arr.sort(function (a, b) {
    if (b.points !== a.points) return b.points - a.points;
    /* Constructors count back on their best single-car finishes. */
    const da = Data.DRIVERS.filter(d => st.drivers[d.id].teamId === a.id).map(d => d.id);
    const db = Data.DRIVERS.filter(d => st.drivers[d.id].teamId === b.id).map(d => d.id);
    const ca = [0], cb = [0];
    for (let i = 1; i <= 22; i++) {
      ca[i] = da.reduce((s2, id) => s2 + App.hub.countbackFor(id)[i], 0);
      cb[i] = db.reduce((s2, id) => s2 + App.hub.countbackFor(id)[i], 0);
    }
    for (let pos = 1; pos <= 22; pos++) if (cb[pos] !== ca[pos]) return cb[pos] - ca[pos];
    return 0;
  });
  return arr;
};

/* ---------------------------------------------------------------------------
 * SEASON PROGRESSION
 * Called by app_weekend after a race is classified.
 * -------------------------------------------------------------------------*/
App.hub.advanceRound = function () {
  const st = App.state;
  st.round += 1;
  st.weekend = null;

  /* Tick every team's development projects. */
  const rng = Engine.rng(st.rngSeed);
  for (const tid in st.teams) {
    const ts = st.teams[tid];
    const team = Data.teamById(tid);
    const atrMax = Engine.regAllowance(st.regulations, Data, 'atr') || 100;
    ts.atr = Engine.clamp(ts.atr + atrMax * 0.12, 0, atrMax);
    ts.cfd = Engine.clamp(ts.cfd + atrMax * 0.14, 0, atrMax);
    ts.budget += team.ratings.budget / 24;

    for (let i = 0; i < ts.projects.length; i++) {
      const p = ts.projects[i];
      if (p.done) continue;
      p.roundsLeft -= 1;
      if (p.roundsLeft > 0) continue;
      if (p.package) {
        /* Every member moves together, which is what earns the synergy bonus
           in Engine.deriveCar — a package that only half-lands does not. */
        const pk = Data.packageByKey(p.package);
        const results = Engine.resolvePackage(pk, team, p.expectedGain, rng);
        let sum = 0;
        results.forEach(function (r) {
          ts.components[r.component] = Engine.applyGain(ts.components[r.component], r.actual);
          sum += r.actual;
        });
        p.done = true;
        p.actual = Math.round(sum / results.length * 100) / 100;
        p.verdict = p.actual >= p.expectedGain * 0.9 ? 'delivered' : (p.actual > 0 ? 'underdelivered' : 'failed');
        p.results = results;
        if (tid === App.myTeamId()) {
          App.logEvent(pk.name + ' fitted across ' + results.length + ' components: average ' + p.actual.toFixed(2) +
            ' per surface (' + p.verdict + '). The synergy bonus follows the evenness, not the size.',
            p.verdict === 'delivered' ? 'good' : 'warn');
        }
      } else {
        const res = Engine.resolveProject({ type: Data.projectTypeByKey(p.typeKey), expectedGain: p.expectedGain }, team, rng);
        const before = ts.components[p.component];
        ts.components[p.component] = Engine.applyGain(before, res.actual);
        if (res.reliabilityHit) ts.components.chassis = Engine.clamp(ts.components.chassis + res.reliabilityHit * 0.3, 30, 102);
        p.done = true; p.actual = res.actual; p.verdict = res.verdict;
        if (tid === App.myTeamId()) {
          App.logEvent(Data.componentByKey(p.component).name + ' upgrade fitted: expected ' + p.expectedGain.toFixed(2) +
            ', delivered ' + res.actual.toFixed(2) + ' (' + res.verdict + ').', res.verdict === 'delivered' ? 'good' : 'warn');
        }
      }
    }
    /* AI teams keep developing on their own. */
    if (tid !== App.myTeamId()) App.hub.aiDevelop(tid, rng);
  }
  st.rngSeed = rng.s;
  App.save();
};

App.hub.aiDevelop = function (teamId, rng) {
  const st = App.state, ts = st.teams[teamId], team = Data.teamById(teamId);
  const open = ts.projects.filter(p => !p.done).length;
  if (open >= 2) return;
  if (ts.budget < 12) return;
  /* Target the team's own weakest component, weighted by its strengths. */
  let worst = null, worstV = 999;
  for (let i = 0; i < Data.COMPONENT_KEYS.length; i++) {
    const k = Data.COMPONENT_KEYS[i];
    const v = ts.components[k] + rng.gauss(0, 3);
    if (v < worstV) { worstV = v; worst = k; }
  }
  const typeKey = rng.chance(0.30) ? 'major' : (rng.chance(0.6) ? 'standard' : 'minor');
  const type = Data.projectTypeByKey(typeKey);
  if (ts.atr < type.atr || ts.budget < type.cost) return;
  ts.atr -= type.atr; ts.budget -= type.cost;
  ts.projects.push({
    component: worst, typeKey, typeName: type.name, roundsLeft: type.weeks,
    expectedGain: Engine.projectExpectedGain(typeKey, team, worst, Data, rng), done: false
  });
};

App.hub.rollSeason = function () {
  const st = App.state;
  const rng = Engine.rng(st.rngSeed);
  const champ = App.hub.driverStandings()[0];
  const cChamp = App.hub.teamStandings()[0];
  App.logEvent(st.season + ' champions: ' + Data.driverById(champ.id).name + ' and ' + Data.teamById(cChamp.id).name + '.', 'good');

  /* Retirements and rookies. OFF by default: the 2026 grid stays intact, which
     is what most people want from a career. Turn it on in the settings menu and
     drivers retire on an age/form curve and are replaced by generated rookies.
     The machinery below is exercised by the tests either way. */
  const retiring = [];
  if (st.settings && st.settings.driverRetirement) {
    for (const id in st.drivers) {
      const base = Data.driverById(id);
      if (!base) continue;
      if (rng.next() < Engine.retirementChance(App.driver(id), st.drivers[id].form)) retiring.push(id);
    }
  }
  retiring.forEach(function (id) {
    const base = Data.driverById(id);
    const seat = st.drivers[id].teamId;
    const rookie = Engine.generateDriver(Data, rng, {});
    rookie.teamId = seat;
    App.logEvent(base.name + ' retires from Formula 1 after ' + (base.age - 18) +
      ' years in the sport. ' + Data.teamById(seat).name + ' promotes ' + rookie.name + '.', 'info');
    Data.retireDriver(id);
    delete st.drivers[id];
    Data.DRIVERS.push(rookie);
    st.drivers[rookie.id] = {
      id: rookie.id, teamId: seat, age: rookie.age,
      s: Object.assign({}, rookie.s), h: Object.assign({}, rookie.h),
      traits: rookie.traits.slice(),
      points: 0, wins: 0, podiums: 0, poles: 0, dnfs: 0,
      form: 0, morale: 62, xp: 0,
      elements: Engine.newElementPool(Data), gridPenalty: 0
    };
    /* If the player was that driver, they follow the seat rather than the name. */
    if (st.controlType === 'driver' && st.controlId === id) {
      st.controlId = rookie.id;
      App.logEvent('You now guide ' + rookie.name + ' in that seat.', 'info');
    }
  });
  st.generatedDrivers = Data.DRIVERS.filter(d => d.generated);
  st.retiredDrivers = Data.BASE_DRIVERS.filter(d => !Data.driverById(d.id)).map(d => d.id);

  for (const id in st.drivers) {
    const d = st.drivers[id];
    const live = App.driver(id);
    if (!Data.driverById(id)) continue;
    Engine.driverSeasonStep(live, d.xp, rng);
    d.age = live.age;
    d.points = 0; d.wins = 0; d.podiums = 0; d.poles = 0; d.dnfs = 0; d.xp = 0; d.form = 0;
    d.elements = Engine.newElementPool(Data);
    d.gridPenalty = 0;
  }
  for (const tid in st.teams) {
    const ts = st.teams[tid];
    ts.points = 0; ts.wins = 0; ts.podiums = 0;
    ts.atr = 100; ts.cfd = 100;
    ts.projects = [];
    ts.budget = Data.teamById(tid).ratings.budget;
    ts.setup = {};
    ts.spec = String.fromCharCode(ts.spec.charCodeAt(0) + 1);
    /* Regulation drift: everybody converges slightly, nobody stands still. */
    for (const k in ts.components) {
      ts.components[k] = Engine.clamp(ts.components[k] + rng.gauss(0.6, 1.4), 30, 102);
    }
  }
  /* The calendar moves on. Anchors stay; the rest is at the mercy of promoters. */
  const changes = Engine.evolveCalendar(st.calendar, Data, rng);
  changes.forEach(function (ch) {
    App.logEvent('Calendar change for ' + (st.season + 1) + ': ' +
      Data.circuitById(ch.out).name + ' drops off, ' + Data.circuitById(ch.in).name + ' joins.', 'info');
  });
  st.regulations.season = st.season + 1;
  st.workingGroup = null;
  for (const tid in st.teams) st.teams[tid].lobby = {};
  st.season += 1;
  st.round = 1;
  st.results = [];
  st.weekend = null;
  st.rngSeed = rng.s;
  App.logEvent('Season ' + st.season + ' begins. Every car has changed over the winter.', 'info');
  App.save();
  App.route('hub');
};

/* ---------------------------------------------------------------------------
 * TRACK MAP — shared SVG renderer, used by hub, weekend and session screens.
 * `cars` is an optional array of { pos (0..1), colour, code, mine }.
 * -------------------------------------------------------------------------*/
App.trackSVG = function (circuit, opts) {
  opts = opts || {};
  const size = opts.size || 360;
  const path = Engine.trackPath(circuit, Data);
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 100 100');
  svg.setAttribute('class', 'trackmap');
  svg.setAttribute('width', size); svg.setAttribute('height', size);
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Circuit map of ' + circuit.name);

  let dstr = '';
  const pad = 8, span = 100 - pad * 2;
  for (let i = 0; i < path.pts.length; i++) {
    const p = path.pts[i];
    dstr += (i === 0 ? 'M' : 'L') + (pad + p.x * span).toFixed(2) + ' ' + (pad + p.y * span).toFixed(2) + ' ';
  }
  dstr += 'Z';

  const bg = document.createElementNS(NS, 'path');
  bg.setAttribute('d', dstr); bg.setAttribute('class', 'trackmap__bed');
  svg.appendChild(bg);
  const line = document.createElementNS(NS, 'path');
  line.setAttribute('d', dstr); line.setAttribute('class', 'trackmap__line');
  svg.appendChild(line);

  /* Pit lane, drawn from the same geometry the race uses to park cars. */
  if (opts.pitLane !== false) {
    const pl = Engine.pitLane(path);
    let pd = '';
    for (let i = 0; i < pl.length; i++) {
      pd += (i === 0 ? 'M' : 'L') + (pad + pl[i].x * span).toFixed(2) + ' ' + (pad + pl[i].y * span).toFixed(2) + ' ';
    }
    const pit = document.createElementNS(NS, 'path');
    pit.setAttribute('d', pd);
    pit.setAttribute('class', 'trackmap__pit');
    svg.appendChild(pit);
  }

  /* Sector boundaries: thirds of the lap. */
  if (opts.sectors) {
    for (let s = 1; s <= 2; s++) {
      const p = path.pts[Math.floor(path.pts.length * s / 3)];
      const m = document.createElementNS(NS, 'circle');
      m.setAttribute('cx', pad + p.x * span); m.setAttribute('cy', pad + p.y * span);
      m.setAttribute('r', 1.4); m.setAttribute('class', 'trackmap__sec');
      svg.appendChild(m);
    }
  }
  /* Start line */
  const sp = path.pts[0];
  const sl = document.createElementNS(NS, 'circle');
  sl.setAttribute('cx', pad + sp.x * span); sl.setAttribute('cy', pad + sp.y * span);
  sl.setAttribute('r', 2.0); sl.setAttribute('class', 'trackmap__start');
  svg.appendChild(sl);

  if (opts.labels) {
    for (let i = 0; i < path.corners.length; i++) {
      const c = path.corners[i], p = path.pts[c.i];
      const g = document.createElementNS(NS, 'text');
      g.setAttribute('x', pad + p.x * span); g.setAttribute('y', pad + p.y * span - 2.4);
      g.setAttribute('class', 'trackmap__cn'); g.textContent = String(c.num);
      svg.appendChild(g);
    }
  }

  if (opts.cars) {
    for (let i = 0; i < opts.cars.length; i++) {
      const car = opts.cars[i];
      const idx = Math.floor(Engine.clamp(car.pos, 0, 0.9999) * path.pts.length);
      const p = path.pts[idx];
      const dot = document.createElementNS(NS, 'circle');
      dot.setAttribute('cx', pad + p.x * span); dot.setAttribute('cy', pad + p.y * span);
      dot.setAttribute('r', car.mine ? 2.6 : 2.0);
      dot.setAttribute('fill', car.colour);
      dot.setAttribute('class', 'trackmap__car' + (car.mine ? ' is-mine' : ''));
      dot.setAttribute('data-code', car.code);
      svg.appendChild(dot);
    }
  }
  return svg;
};
</script>
