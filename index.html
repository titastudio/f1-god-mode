<script>
/* ============================================================================
 * app_weekend.js — the core gameplay loop, part 1
 * Weekend hub, practice sessions, qualifying sessions, and the shared live
 * session chrome (timing tower, track map, control panel, god pause).
 *
 * The race lives in app_race.js because together they exceed the file size
 * ceiling. They share App.weekend.* helpers defined here.
 * ==========================================================================*/

App.weekend = {};
const WK = App.weekend;

/* ---------------------------------------------------------------------------
 * WEEKEND STATE
 *
 * INVARIANT: state.weekend.cars always contains exactly 22 entries keyed in
 * grid/entry order, one per Data.DRIVERS. Sessions rebuild the mutable parts
 * (tyres, energy, fuel) but never add or remove cars, so index-based lookups
 * stay valid for the whole weekend.
 * -------------------------------------------------------------------------*/
WK.ensure = function () {
  const st = App.state;
  if (st.weekend && st.weekend.round === st.round) return st.weekend;
  const round = st.calendar[st.round - 1];
  if (!round) return null;
  const circuit = Data.circuitById(round.circuit);
  const rng = Engine.rng(st.rngSeed + st.round * 7919);

  const wk = {
    round: st.round,
    circuitId: circuit.id,
    name: round.name,
    sprint: !!round.sprint,
    sessions: (round.sprint ? Data.WEEKEND_SPRINT : Data.WEEKEND_STANDARD).map(function (s) {
      return Object.assign({}, s, { done: false, result: null });
    }),
    index: 0,
    weather: Engine.newWeather(circuit, rng),
    forecastSeed: rng.int(1, 1e9),
    trackGrip: circuit.gripStart,
    shares: Engine.sectorShares(circuit),
    cars: {},
    grid: [],
    sprintGrid: [],
    learned: {},      /* driverId -> what practice taught us */
    notes: [],
    live: null,
    classified: null
  };

  for (let i = 0; i < Data.DRIVERS.length; i++) {
    const d = Data.DRIVERS[i];
    wk.cars[d.id] = {
      driverId: d.id,
      teamId: st.drivers[d.id].teamId,
      health: { frontWing: 100, rearWing: 100, floor: 100, suspension: 100, brakes: 100, mguk: 100, battery: 100, ice: 100 },
      tyreSets: WK.allocateTyres(!!round.sprint),
      penalty: 0,
      gridPenalty: 0
    };
  }
  st.rngSeed = rng.s;
  st.weekend = wk;
  return wk;
};

/* The FIA allocation for a weekend. These are consumed as sets are fitted, so
   a team cannot run new softs all weekend for free — which is the whole reason
   the allocation exists. */
WK.allocateTyres = function (sprint) {
  /* A sprint weekend has one practice session instead of three, so the FIA cuts
     the allocation to match. Twelve sets becomes ten. */
  return sprint ? { S: 6, M: 3, H: 2, I: 4, W: 3 }
                : { S: 8, M: 4, H: 3, I: 4, W: 3 };
};

/* Take a set of `want`, falling back to whatever is left if the allocation is
   exhausted. Returns the compound actually fitted. */
WK.takeSet = function (driverId, want) {
  const wk = App.state.weekend;
  const sets = wk.cars[driverId].tyreSets;
  if (sets[want] > 0) { sets[want] -= 1; return want; }
  const order = Data.COMPOUNDS[want].wet > 0 ? ['I', 'W'] : ['S', 'M', 'H'];
  for (let i = 0; i < order.length; i++) {
    if (sets[order[i]] > 0) { sets[order[i]] -= 1; return order[i]; }
  }
  /* Nothing left at all: a scrubbed set goes back on. */
  return want;
};

WK.circuit = function () { return Data.circuitById(App.state.weekend.circuitId); };
WK.currentSession = function () { const wk = App.state.weekend; return wk.sessions[wk.index]; };

/* ---------------------------------------------------------------------------
 * WEEKEND HUB SCREEN
 * -------------------------------------------------------------------------*/
App.screens.weekend = {
  render: function (root) {
    const st = App.state;
    const wk = WK.ensure();
    root.appendChild(App.chrome('weekend'));

        App.h('p.muted', { text: circuit.name })
      ]),

    ]));

    /* Session ladder */

      main.appendChild(App.h('section.wkdone', {}, [

          App.h('h2.wkdone__h', { text: last && last.round === wk.round
            ? last.podium[0] + ' wins the ' + wk.name

        ]),

          }),

              if (raceSess) WK.showSessionResult(raceSess);
            }
          }) : null
        ])

    }

    const cols = App.h('div.wk__cols');

    /* Left: track + engineer notes */
    const left = App.h('section.card', {}, [
      App.h('header.card__head', {}, [App.h('h2', { text: circuit.name }), App.h('span.card__tag', { text: circuit.length.toFixed(3) + ' km  ·  ' + circuit.laps + ' laps  ·  ' + (circuit.length * circuit.laps).toFixed(0) + ' km' })]),
      App.h('div.card__body', {}, [

    const mine = App.myDriverIds();
    const midBody = App.h('div.card__body');
    if (!mine.length) midBody.appendChild(App.h('p.muted', { text: 'You are observing. Start a session to watch it unfold.' }));
    for (let i = 0; i < mine.length; i++) {
      const d = App.driver(mine[i]);
      const t = Data.teamById(d.teamId);
      const derived = App.derivedFor(d.id, circuit.id);
      const car = wk.cars[d.id];
      midBody.appendChild(App.h('div.mycar', { style: { '--tc': t.colour } }, [

          App.h('b', { text: d.name }),
          App.h('span.mycar__ovr', { text: 'OVR ' + Engine.driverOverall(d) })
        ]),
        App.h('div.mycar__bars', {}, [
          miniBar('Downforce', derived.dom.downforce),

          miniBar('Traction', derived.dom.traction),
          miniBar('Tyre life', derived.dom.tyreKindness),
          miniBar('Cooling', derived.dom.cooling)
        ]),
        App.h('p.mycar__bal', { text: 'Balance ' + (derived.dom.balance * 100).toFixed(1) + '% front' +
          (Math.abs(derived.dom.balance - 0.5) > 0.02 ? '  —  costing ' + derived.dom.balanceLoss.toFixed(1) + ' points of grip' : '  —  neutral') }),
        App.h('div.mycar__acts', {}, [
          App.can('setup') ? App.h('button.btn.btn--sm', { text: 'Setup', onclick: function () { App.route('garage', { driverId: d.id }); } }) : null,
          App.h('button.btn.btn--sm.btn--ghost', { text: 'Strategy', onclick: function () { WK.strategyModal(d.id); } }),
          App.h('button.btn.btn--sm.btn--ghost', { 'data-runplan': d.id, text: 'Run plan', onclick: function () { WK.runPlanModal(d.id); } }),

    function miniBar(k, v) {

        App.h('i.mini__t', {}, [App.h('i.mini__f', { style: { '--w': Engine.clamp((v - 30) / 60 * 100, 2, 100) + '%' } })]),
        App.h('span.mini__v', { text: v.toFixed(0) })
      ]);

  }
};

/* The forecast, as a row of blocks across the session ahead. */
WK.forecastStrip = function (wk) {
  if (!wk.weather.forecast || !wk.weather.forecast.length) {
    Engine.forecast(wk.weather, 8, Engine.rng(wk.forecastSeed || 1));
  }
  const f = wk.weather.forecast;
  const row = App.h('div.forecast');
  row.appendChild(App.h('span.forecast__k', { text: 'Forecast' }));
  f.forEach(function (step) {
    const lab = Engine.weatherLabel(step.wet, Data);
    row.appendChild(App.h('div.fc', {
      style: { '--fc': lab.colour, '--o': step.confidence.toFixed(2) },
      title: lab.name + '  ·  ' + Math.round(step.wet * 100) + '% wet  ·  ' +
             step.trackTemp.toFixed(0) + '°C track  ·  ' +
             Math.round(step.confidence * 100) + '% confidence'
    }, [
      App.h('i.fc__bar'),
      App.h('span.fc__t', { text: step.trackTemp.toFixed(0) + '°' })
    ]));
  });
  const wettest = f.reduce((a, b) => b.wet > a.wet ? b : a, f[0]);
  row.appendChild(App.h('span.forecast__s', {
    text: wettest.wet > 0.15
      ? 'Rain expected around ' + Math.round(wettest.at * 100) + '% through the session, ' +
        Math.round(wettest.confidence * 100) + '% confidence'
      : 'Dry throughout, ' + Math.round(f[0].confidence * 100) + '% confidence'
  }));

};

WK.dnaBars = function (circuit) {
  const rows = [['highSpeed', 'High speed'], ['medSpeed', 'Medium speed'], ['lowSpeed', 'Low speed'],
                ['straight', 'Straights'], ['braking', 'Braking'], ['traction', 'Traction']];
  return rows.map(function (r) {
    return App.h('div.dna', {}, [
      App.h('span.dna__k', { text: r[1] }),
      App.h('i.dna__t', {}, [App.h('i.dna__f', { style: { '--w': (circuit.dna[r[0]] / 0.5 * 100) + '%' } })]),
      App.h('span.dna__v', { text: Math.round(circuit.dna[r[0]] * 100) + '%' })
    ]);
  });
};

WK.weatherStrip = function (wk) {
  const w = wk.weather;
  const wet = Engine.wetLevel(w);
  const lab = Engine.weatherLabel(wet, Data);
  return [
    App.h('div.wx', {}, [App.h('span.wx__k', { text: 'Conditions' }), App.h('span.wx__v', { text: lab.name, style: { color: lab.colour } })]),
    App.h('div.wx', {}, [App.h('span.wx__k', { text: 'Air' }), App.h('span.wx__v', { text: w.airTemp.toFixed(0) + '°C' })]),
    App.h('div.wx', {}, [App.h('span.wx__k', { text: 'Track' }), App.h('span.wx__v', { text: w.trackTemp.toFixed(0) + '°C' })]),
    App.h('div.wx', {}, [App.h('span.wx__k', { text: 'Wind' }), App.h('span.wx__v', { text: w.windSpeed.toFixed(1) + ' m/s ' + w.windDir })]),
    App.h('div.wx', {}, [App.h('span.wx__k', { text: 'Grip' }), App.h('span.wx__v', { text: Math.round(wk.trackGrip * 100) + '%' })]),
    App.h('div.wx', {}, [App.h('span.wx__k', { text: 'Rain' }), App.h('span.wx__v', { text: Math.round(w.rainProb * 100) + '%' })])
  ];
};

/* ---------------------------------------------------------------------------
 * SESSION SETUP
 * -------------------------------------------------------------------------*/
WK.startSession = function () {
  const wk = WK.ensure();
  const sess = WK.currentSession();
  if (!sess) return;
  if (sess.type === 'race') { App.race.start(sess); return; }
  WK.buildLive(sess);
  App.route('session');
};

/* Build the live runtime for a practice or qualifying session. */
WK.buildLive = function (sess) {
  const st = App.state, wk = st.weekend, circuit = WK.circuit();
  const rng = Engine.rng(st.rngSeed + wk.round * 131 + sess.key.length * 977);
  const wet = Engine.wetLevel(wk.weather);

  const cars = [];
  for (let i = 0; i < Data.DRIVERS.length; i++) {
    const d = Data.DRIVERS[i];
    const drv = App.driver(d.id);
    const team = Data.teamById(drv.teamId);
    const derived = App.derivedFor(d.id, circuit.id);
    const c = {
      driverId: d.id, code: d.code, num: d.num, teamId: drv.teamId,
      colour: team.colour, name: drv.name, sur: d.last,
      driver: drv, derived: derived,
      tyre: Engine.newTyre(WK.pickCompound(wet, 'M'), 0),
      energy: Engine.newEnergy(derived),
      fuelKg: sess.type === 'qualifying' ? 12 : 46,
      mode: 'GARAGE', wait: rng.range(0, sess.type === 'qualifying' ? 60 : 420),
      lapProgress: 0, lapTarget: circuit.base * 1.3,
      best: null, last: null, bestSectors: [null, null, null], lastSectors: [null, null, null],
      liveSectors: [null, null, null],
      laps: 0, runLaps: 0, pushMode: 'NORMAL', energyMode: 'AUTO',
      programme: null, runIndex: 0, out: false, eliminated: false, msg: null,
      history: []
    };
    c.runPlan = WK.buildRunPlan(sess, c, rng);
    cars.push(c);
  }

  const segs = sess.type === 'qualifying' ? sess.segments : null;
  /* Refresh the forecast at the start of every session. */
  Engine.forecast(wk.weather, 8, Engine.rng(wk.forecastSeed + sess.key.length * 31));

  wk.live = {
    key: sess.key, name: sess.name, type: sess.type,
    cars: cars,
    seg: segs ? 0 : null,
    segKey: segs ? segs[0] : null,
    clock: segs ? Data.QUALI_SEGMENTS[segs[0]].minutes * 60 : sess.minutes * 60,
    total: segs ? Data.QUALI_SEGMENTS[segs[0]].minutes * 60 : sess.minutes * 60,
    running: false, speed: 5, finished: false, breakTimer: 0,
    red: null, redTimer: 0,
    bestLap: null, bestSectors: [null, null, null],
    messages: [], rngSeed: rng.s, elapsed: 0,
    order: cars.map(c => c.driverId)
  };
  st.rngSeed = rng.s;
  WK.say('Session start — ' + sess.name + ' at ' + circuit.name + '.', 'rc');
  return wk.live;
};

WK.pickCompound = function (wet, dry) {
  const c = Engine.bestCompoundFor(wet);
  return c || dry;
};

WK.buildRunPlan = function (sess, car, rng) {
  const wk = App.state.weekend;
  /* A plan the player wrote always wins over the engineers' default. */
  if (wk.runPlans && wk.runPlans[sess.key + ':' + car.driverId]) {
    return JSON.parse(JSON.stringify(wk.runPlans[sess.key + ':' + car.driverId]));
  }
  /* With the auto engineer off, nobody writes a programme for you. The car
     goes out on a single installation run and waits for instructions. */
  if (!App.autoFor(car.driverId)) {
    WK.say(Data.driverById(car.driverId).last + ': no run plan set. We will do an installation lap and wait.', 'team');
    return [{ programme: 'aero', compound: 'M', laps: 3 }];
  }
  const plan = [];
  if (sess.type === 'qualifying') {
    plan.push({ programme: 'quali', compound: 'S', laps: 2 });
    plan.push({ programme: 'quali', compound: 'S', laps: 2 });
    return plan;
  }
  /* Practice: a realistic mixed programme. Players can override their own. */
  const isFP1 = sess.key === 'FP1';
  if (isFP1) {
    plan.push({ programme: 'aero', compound: 'M', laps: 6 });
    plan.push({ programme: 'setup', compound: 'M', laps: 8 });
    plan.push({ programme: 'quali', compound: 'S', laps: 4 });
  } else {
    plan.push({ programme: 'setup', compound: 'M', laps: 7 });
    plan.push({ programme: 'quali', compound: 'S', laps: 4 });
    plan.push({ programme: rng.chance(0.5) ? 'race' : 'longrun', compound: rng.chance(0.5) ? 'M' : 'H', laps: 14 });
  }
  return plan;
};

WK.say = function (text, kind) {
  const wk = App.state.weekend;
  const live = wk && wk.live;
  if (!live) return;
  /* Stamp the moment now: the feed is read long after the message was made. */
  live.messages.unshift({
    t: live.type === 'race' ? live.lap : live.total - live.clock,
    lap: live.lap || 0, text, kind: kind || 'info'
  });
  if (live.messages.length > 90) live.messages.length = 90;
};

/* ---------------------------------------------------------------------------
 * SESSION SIMULATION — practice and qualifying share one tick function.
 * dt is in session seconds. Pure enough to run headlessly in tests via
 * WK.runToEnd().
 * -------------------------------------------------------------------------*/
/* Large dt values are split into sub-steps. A single huge step would let a car
   cover several laps in one go and would let track evolution overshoot. */
WK.tick = function (dt) {
  const live = App.state.weekend && App.state.weekend.live;
  if (!live || live.finished) return;
  const MAX = 2;
  while (dt > MAX && !live.finished) { WK.step(MAX); dt -= MAX; }
  if (dt > 0 && !live.finished) WK.step(dt);
};

WK.step = function (dt) {
  const st = App.state, wk = st.weekend, live = wk.live, circuit = WK.circuit();
  if (!live || live.finished) return;
  const rng = Engine.rng(live.rngSeed);

  /* Segment break between Q1/Q2/Q3. */
  if (live.breakTimer > 0) {
    live.breakTimer -= dt;
    if (live.breakTimer <= 0) WK.nextSegment(rng);
    live.rngSeed = rng.s;
    return;
  }

  live.clock -= dt;
  live.elapsed += dt;

  /* Weather and rubber evolve across the session. */
  Engine.weatherStep(wk.weather, dt / Math.max(1, live.total), rng);
  const wet = Engine.wetLevel(wk.weather);
  /* Rubber goes down through a session, so the last runners have a better track
     than the first. In qualifying that is worth real lap time and is why nobody
     wants to be first out in Q1. */
  const rubberRate = live.type === 'qualifying' ? 0.26 : 0.14;
  const targetGrip = wet > 0.2 ? 0.72 - wet * 0.16
                   : Math.min(0.995, circuit.gripStart + live.elapsed / 2400 * rubberRate);
  wk.trackGrip = Engine.clamp(wk.trackGrip + (targetGrip - wk.trackGrip) * (1 - Math.exp(-0.05 * dt)), 0.55, 0.995);

  /* A red flag stops a session too, not only a race. The clock is held, cars
     return to the pits, and any lap in progress is lost. */
  if (live.red) {
    live.redTimer -= dt;
    live.clock += dt;                       /* the session clock is stopped */
    if (live.redTimer <= 0) WK.clearRed();
    live.rngSeed = rng.s;
    return;
  }

  for (let i = 0; i < live.cars.length; i++) WK.tickCar(live.cars[i], dt, rng, wet);

  WK.reorder(live);

  if (live.clock <= 0) {
    live.clock = 0;
    /* Let cars on a flying lap finish it. */
    let flying = false;
    for (let i = 0; i < live.cars.length; i++) {
      const c = live.cars[i];
      if (c.mode === 'PUSH' && !c.eliminated) flying = true;
    }
    if (!flying) WK.endSegmentOrSession(rng);
  }
  live.rngSeed = rng.s;
};

WK.tickCar = function (c, dt, rng, wet) {
  const wk = App.state.weekend, live = wk.live, circuit = WK.circuit();
  if (c.eliminated || c.out) return;

  if (c.mode === 'GARAGE') {
    c.wait -= dt;
    if (c.wait > 0) return;
    const run = c.runPlan[c.runIndex];
    if (!run) { c.wait = 1e9; return; }
    /* Do not send a car out with no time left to complete a lap. */
    if (live.clock < circuit.base * 1.6 && live.type === 'qualifying') { c.wait = 1e9; return; }
    c.programme = Data.runProgrammeByKey(run.programme);
    const wantWet = Engine.bestCompoundFor(wet);
    const fitted = WK.takeSet(c.driverId, wantWet || run.compound);
    if (fitted !== (wantWet || run.compound) && App.myDriverIds().indexOf(c.driverId) !== -1) {
      WK.say(c.sur + ': no ' + Data.COMPOUNDS[wantWet || run.compound].name.toLowerCase() +
             ' sets left, going out on ' + Data.COMPOUNDS[fitted].name.toLowerCase() + '.', 'team');
    }
    c.tyre = Engine.newTyre(fitted, 0);
    c.pushMode = c.programme.push;
    c.runLaps = 0;
    c.mode = 'OUT';
    c.lapProgress = 0;
    c.lapTarget = circuit.base * 1.28;
    if (c.driverId === App.myDriverIds()[0]) WK.say(c.sur + ' out of the garage — ' + c.programme.name + ' on ' + Data.COMPOUNDS[c.tyre.compound].name + '.', 'team');
    return;
  }

  c.lapProgress += dt / c.lapTarget;
  if (c.lapProgress < 1) return;
  c.lapProgress = 0;

  if (c.mode === 'OUT') {
    /* Out lap warms the tyre without recording a time. */
    Engine.tyreLap(c.tyre, Data, { circuit, derived: c.derived, driver: c.driver, push: 'CONSERVE', wet, trackTemp: wk.weather.trackTemp });
    c.mode = 'PUSH';
    c.lapTarget = WK.estimateLap(c, wet);
    return;
  }

  if (c.mode === 'PUSH') {
    /* Out-lap traffic. In the closing minutes of a segment the whole field is
       on track at once and someone always gets in the way — the classic Q1
       ruined lap. Cars in clear track see none of this. */
    let traffic = 0;
    if (live.type === 'qualifying') {
      let nearby = 0;
      for (let k = 0; k < live.cars.length; k++) {
        const o = live.cars[k];
        if (o === c || o.eliminated || o.mode === 'GARAGE') continue;
        let d = Math.abs(o.lapProgress - c.lapProgress);
        d = Math.min(d, 1 - d);
        if (d < 0.05) nearby++;
      }
      if (nearby > 0 && rng.chance(0.10 + nearby * 0.05)) {
        traffic = rng.range(0.25, 1.1);
        if (App.myDriverIds().indexOf(c.driverId) !== -1) {
          WK.say(c.sur + ': "Traffic. That lap is gone."', 'radio');
        }
      }
    }
    const res = WK.runLap(c, rng, wet, live.type === 'qualifying' ? 'quali' : 'race', traffic);
    c.runLaps += 1;
    WK.recordLap(c, res);
    const run = c.runPlan[c.runIndex] || { laps: 4 };
    const stintDone = c.runLaps >= (run.laps || 4) || c.tyre.wear > 92;
    if (stintDone) { c.mode = 'IN'; c.lapTarget = circuit.base * 1.32; }
    else {
      /* Push laps in qualifying are separated by a cool-down lap. */
      if (live.type === 'qualifying') { c.mode = 'COOL'; c.lapTarget = circuit.base * 1.34; }
      else c.lapTarget = WK.estimateLap(c, wet);
    }
    return;
  }

  if (c.mode === 'COOL') {
    Engine.tyreLap(c.tyre, Data, { circuit, derived: c.derived, driver: c.driver, push: 'CONSERVE', wet, trackTemp: wk.weather.trackTemp });
    c.mode = 'PUSH';
    c.lapTarget = WK.estimateLap(c, wet);
    return;
  }

  if (c.mode === 'IN') {
    c.mode = 'GARAGE';
    c.runIndex += 1;
    WK.learnFromRun(c);
    if (live.type === 'qualifying') {
      /* Come back out for the final runs. */
      c.wait = Math.max(4, live.clock - circuit.base * 3.4 - rng.range(0, 40));
    } else {
      c.wait = rng.range(240, 620);
    }
    return;
  }
};

/* Big accidents stop a session. Called from the mistake handler in runLap. */
WK.redFlag = function (reason, rng) {
  const live = App.state.weekend.live;
  if (!live || live.red || live.finished) return;
  live.red = reason;
  live.redTimer = rng.range(120, 300);       /* session seconds of stoppage */
  live.cars.forEach(function (c) {
    if (c.eliminated) return;
    /* Anyone mid-lap loses it and returns to the garage. */
    c.mode = 'GARAGE';
    c.wait = live.redTimer + rng.range(20, 180);
    c.lapProgress = 0;
  });
  WK.say('RED FLAG. ' + reason + '. The session is stopped.', 'rc');
};

WK.clearRed = function () {
  const live = App.state.weekend.live;
  live.red = null;
  live.redTimer = 0;
  WK.say('The session will resume. ' + App.fmt.clock(live.clock) + ' remaining.', 'rc');
};

WK.estimateLap = function (c, wet) {
  const circuit = WK.circuit();
  return circuit.base * (1 + wet * 0.2) * 1.02;
};

/* Generate a single timed lap for a car. */
WK.runLap = function (c, rng, wet, mode, traffic) {
  const wk = App.state.weekend, circuit = WK.circuit();
  /* In practice and qualifying a car is on its own programme, so the context is
     clear air unless it is on an out lap. */
  const eEffect = Engine.energyLap(c.energy, c.derived, Data, {
    circuit, airTemp: wk.weather.airTemp,
    ctx: { clearAir: true, dirtyAir: 0, sc: false, lapsLeft: 99, attacking: false, defending: false }
  });
  const res = Engine.lapTime({
    Data, rng, derived: c.derived, driver: c.driver, circuit,
    tyre: c.tyre, fuelKg: c.fuelKg, trackGrip: wk.trackGrip, wet,
    energyEffect: eEffect, charge: c.energy.charge, push: c.pushMode,
    form: c.driver.form, mode, sectorShares: wk.shares, dirtyAir: 0,
    wetSectors: wk.weather.sectors.slice(), traffic: traffic || 0
  });
  Engine.tyreLap(c.tyre, Data, { circuit, derived: c.derived, driver: c.driver, push: c.pushMode, wet, trackTemp: wk.weather.trackTemp, fuelKg: c.fuelKg });
  c.fuelKg = Math.max(2, c.fuelKg - Engine.fuelPerLap(circuit, c.derived, Data.PUSH_MODES[c.pushMode]));
  c.laps += 1;
  if (res.mistake) {
    WK.say(c.sur + ' — ' + (res.mistake.kind === 'off' ? 'runs wide, lap compromised' : 'locks up under braking') + '.', 'warn');
    /* A big enough error puts the car in the barrier and stops the session. */
    if (res.mistake.kind === 'off' && res.mistake.cost > 1.6 && rng.chance(0.22)) {
      c.eliminated = false;
      WK.redFlag(c.sur + ' is in the barrier at turn ' + rng.int(1, WK.circuit().corners), rng);
    }
  }
  return res;
};

WK.recordLap = function (c, res) {
  const live = App.state.weekend.live;
  c.last = res.time;
  c.lastSectors = res.sectors.slice();
  c.history.push({ time: res.time, sectors: res.sectors.slice(), tyre: c.tyre.compound, lap: c.laps, why: res.why, domainSplit: res.domainSplit });
  if (c.history.length > 60) c.history.shift();

  for (let i = 0; i < 3; i++) {
    if (c.bestSectors[i] == null || res.sectors[i] < c.bestSectors[i]) c.bestSectors[i] = res.sectors[i];
    if (live.bestSectors[i] == null || res.sectors[i] < live.bestSectors[i]) {
      live.bestSectors[i] = res.sectors[i];
      c.liveSectors[i] = 'purple';
    } else if (res.sectors[i] <= c.bestSectors[i] + 1e-9) c.liveSectors[i] = 'green';
    else c.liveSectors[i] = 'yellow';
  }
  if (c.best == null || res.time < c.best) {
    c.best = res.time;
    if (live.bestLap == null || res.time < live.bestLap) {
      live.bestLap = res.time;
      WK.say(c.sur + ' goes fastest — ' + Engine.fmtLap(res.time) + '.', 'purple');
    }
  }
};

WK.learnFromRun = function (c) {
  const wk = App.state.weekend;
  if (App.myDriverIds().indexOf(c.driverId) === -1) return;
  const rng = Engine.rng(App.state.rngSeed + c.laps * 17);
  const msgs = Engine.driverFeedback({ derived: c.derived, driver: c.driver, tyre: c.tyre, circuit: WK.circuit(), Data, rng });
  App.state.rngSeed = rng.s;
  for (let i = 0; i < msgs.length && i < 1; i++) {
    /* The same complaint every run is noise, not information. Only record a
       note when the symptom is new or has changed since this driver last spoke. */
    const prev = wk.notes.filter(n => n.who === c.sur)[0];
    if (prev && prev.axis === msgs[i].axis) { prev.count = (prev.count || 1) + 1; continue; }
    wk.notes.unshift({ who: c.sur, text: msgs[i].t, axis: msgs[i].axis, count: 1 });
    WK.say(c.sur + ': "' + msgs[i].t + '"', 'radio');
  }
  if (wk.notes.length > 30) wk.notes.length = 30;
};

WK.reorder = function (live) {
  live.order = live.cars.slice().sort(function (a, b) {
    if (a.eliminated !== b.eliminated) return a.eliminated ? 1 : -1;
    if (a.best == null && b.best == null) return 0;
    if (a.best == null) return 1;
    if (b.best == null) return -1;
    return a.best - b.best;
  }).map(c => c.driverId);
};

/* ---------------------------------------------------------------------------
 * SEGMENT / SESSION COMPLETION
 * -------------------------------------------------------------------------*/
WK.endSegmentOrSession = function (rng) {
  const wk = App.state.weekend, live = wk.live;
  const sess = wk.sessions[wk.index];
  if (live.type !== 'qualifying') { WK.finishSession(rng); return; }

  const segs = sess.segments;
  const segKey = segs[live.seg];
  const advance = Data.QUALI_SEGMENTS[segKey].advance;
  WK.reorder(live);
  const active = live.order.filter(function (id) { return !WK.carById(id).eliminated; });
  const knocked = active.slice(advance);
  for (let i = 0; i < knocked.length; i++) {
    const c = WK.carById(knocked[i]);
    c.eliminated = true;
    c.mode = 'GARAGE'; c.wait = 1e9;
  }
  if (knocked.length) {
    WK.say(segKey + ' complete. Out: ' + knocked.map(id => WK.carById(id).sur).join(', ') + '.', 'rc');
  }
  if (live.seg >= segs.length - 1) { WK.finishSession(rng); return; }
  live.breakTimer = 3;
  live.pendingSeg = live.seg + 1;
};

WK.nextSegment = function (rng) {
  const wk = App.state.weekend, live = wk.live;
  const sess = wk.sessions[wk.index];
  live.seg = live.pendingSeg;
  live.segKey = sess.segments[live.seg];
  const mins = Data.QUALI_SEGMENTS[live.segKey].minutes;
  live.clock = mins * 60; live.total = mins * 60;
  live.bestSectors = [null, null, null];
  live.bestLap = null;
  for (let i = 0; i < live.cars.length; i++) {
    const c = live.cars[i];
    if (c.eliminated) continue;
    c.best = null; c.last = null; c.bestSectors = [null, null, null]; c.liveSectors = [null, null, null];
    c.mode = 'GARAGE';
    c.runIndex = 0; c.runLaps = 0;
    c.runPlan = [{ programme: 'quali', compound: 'S', laps: 2 }, { programme: 'quali', compound: 'S', laps: 2 }];
    c.wait = rng.range(0, 70);
    c.fuelKg = 12;
    c.energy.charge = 88;
  }
  WK.say(live.segKey + ' begins. ' + live.cars.filter(c => !c.eliminated).length + ' cars.', 'rc');
};

WK.finishSession = function (rng) {
  const wk = App.state.weekend, live = wk.live;
  const sess = wk.sessions[wk.index];
  live.finished = true;
  live.running = false;
  WK.reorder(live);

  const top = WK.carById(live.order[0]);
  sess.done = true;
  sess.result = {
    headline: top ? top.sur + '  ' + Engine.fmtLap(top.best) : 'No time set',
    order: live.order.slice(),
    times: live.cars.reduce(function (m, c) { m[c.driverId] = c.best; return m; }, {})
  };

  if (live.type === 'qualifying') {
    const grid = live.order.slice();
    if (sess.sprint) { wk.sprintGrid = WK.applyGridPenalties(grid, true); }
    else {
      const pole = App.state.drivers[grid[0]];
      pole.poles += 1;
      wk.grid = WK.applyGridPenalties(grid);
    }
    WK.say('Pole position: ' + top.last + ', ' + Engine.fmtLap(top.best) + '.', 'purple');
    App.logEvent(sess.name + ' at ' + WK.circuit().name + ': pole for ' + top.name + '.', 'info');
  }
  wk.index += 1;
  App.save();
};

/* Grid penalties are applied after qualifying, not during it: a driver still
   sets a real qualifying time and still takes pole, they just start further
   back. Penalised cars are ordered among themselves by their qualifying
   position, which is how it works in reality. */
WK.applyGridPenalties = function (order, isSprint) {
  const st = App.state;
  const clean = [], penalised = [];
  order.forEach(function (id, i) {
    const p = st.drivers[id].gridPenalty || 0;
    if (!p) clean.push({ id, q: i, drop: 0 });
    else penalised.push({ id, q: i, drop: p });
  });
  if (!penalised.length) return order;

  const out = clean.slice();
  penalised.sort((a, b) => (a.drop === 99 ? 1 : 0) - (b.drop === 99 ? 1 : 0) || a.q - b.q);
  penalised.forEach(function (pen) {
    if (pen.drop === 99) { out.push(pen); return; }
    const target = Math.min(out.length, pen.q + pen.drop);
    out.splice(target, 0, pen);
  });
  penalised.forEach(function (pen) {
    const d = Data.driverById(pen.id);
    WK.say(d.last + ' drops ' + (pen.drop === 99 ? 'to the back of the grid' : pen.drop + ' places') + ' for a power unit change.', 'rc');
    App.logEvent(d.name + ' takes a ' + (pen.drop === 99 ? 'back-of-grid' : pen.drop + '-place') + ' grid penalty.', 'warn');
    /* A penalty applies to the sprint grid too, but it is only served once:
       clearing it happens when the Grand Prix grid is set. */
    if (!isSprint) st.drivers[pen.id].gridPenalty = 0;
  });
  return out.map(x => x.id);
};

WK.carById = function (id) {
  const live = App.state.weekend.live;
  for (let i = 0; i < live.cars.length; i++) if (live.cars[i].driverId === id) return live.cars[i];
  return null;
};

/* Headless-friendly: run the whole session with no timers. Used by tests and
   by the "skip session" button. */
WK.runToEnd = function (maxSteps) {
  const live = App.state.weekend.live;
  if (!live) return;
  let guard = maxSteps || 20000;
  while (!live.finished && guard-- > 0) WK.tick(2);
  if (!live.finished) WK.finishSession(Engine.rng(live.rngSeed));
};

/* ---------------------------------------------------------------------------
 * LIVE SESSION SCREEN
 * -------------------------------------------------------------------------*/
App.screens.session = {
  render: function (root) {
    const wk = App.state.weekend, live = wk && wk.live;
    if (!live) { App.route('weekend'); return; }
    root.appendChild(App.chrome('weekend'));
    const main = App.h('main.live');

    main.appendChild(App.h('div.live__bar', { id: 'live-bar' }));
    const grid = App.h('div.live__grid');
    grid.appendChild(App.h('div.live__tower', { id: 'tower' }));
    grid.appendChild(App.h('div.live__mid', {}, [
      App.h('div.live__map', { id: 'live-map' }),
      App.h('div.live__tele', { id: 'live-tele' })
    ]));
    grid.appendChild(App.h('div.live__side', { id: 'live-side' }));
    main.appendChild(grid);
    main.appendChild(App.h('div.ctrl', { id: 'ctrl' }));
    root.appendChild(main);

    WK.mount();
    /* Sessions start running. Arriving at a frozen screen with a play button
       you have to find reads as a broken page, not as a paused one. */
    live.running = !live.finished;
    App.every(60, function () {
      if (live.running && !live.finished) WK.tick(0.06 * live.speed);
      WK.refresh();
    });
  }
};

/* ---------------------------------------------------------------------------
 * LIVE RENDERING
 *
 * INVARIANT: mount() builds every node once and stashes the references on
 * live.els; refresh() only ever writes text, classes and attributes. Nothing
 * on this screen may be rebuilt on the interval.
 * WHY: at 10fps a rebuild replaces the node under the cursor between mousedown
 * and mouseup, so buttons and rows silently stop responding to clicks. That is
 * what "I click start and then nothing works" was.
 * -------------------------------------------------------------------------*/
WK.mount = function () {
  const live = App.state.weekend.live;
  live.els = { rows: {}, dots: {}, msgSeen: 0 };
  WK.mountBar();
  WK.mountTower();
  WK.mountMap();
  WK.mountTele();
  WK.mountSide();
  WK.mountCtrl();
  WK.refresh();
};

WK.refresh = function () {
  const live = App.state.weekend && App.state.weekend.live;
  if (!live || !live.els || !App.$('#tower')) return;
  WK.refreshBar();
  WK.refreshTower();
  WK.refreshMap();
  WK.refreshTele();
  WK.refreshSide();
  WK.refreshCtrl();
};
/* Kept for callers that want a full repaint after a structural change. */
WK.paintAll = function () {
  const live = App.state.weekend && App.state.weekend.live;
  if (!live || !App.$('#tower')) return;
  if (!live.els) WK.mount(); else WK.refresh();
};
