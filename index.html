<script>
/* ============================================================================
 * app_systems.js — three secondary systems that share a lot of chart code
 *   · Regulations: the ruleset, per-component legality, the FIA working group
 *   · Telemetry: speed/throttle/brake traces, lap comparison, qualifying replay
 *   · Car Lab: a sandbox that runs the wind tunnel then the track
 * ==========================================================================*/

App.sys = {};
const SY = App.sys;

/* ---------------------------------------------------------------------------
 * SHARED CHARTING
 * A tiny SVG line-chart helper. Every trace on these screens goes through it,
 * so they share axes, scaling and styling instead of drifting apart.
 * -------------------------------------------------------------------------*/
SY.chart = function (o) {
  const NS = 'http://www.w3.org/2000/svg';
  const w = o.width || 640, h = o.height || 140;
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
  svg.setAttribute('class', 'chart' + (o.className ? ' ' + o.className : ''));
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', o.label || 'chart');

  let lo = o.min, hi = o.max;
  if (lo == null || hi == null) {
    lo = Infinity; hi = -Infinity;
    o.series.forEach(function (s) {
      s.values.forEach(function (v) { if (v < lo) lo = v; if (v > hi) hi = v; });
    });
    if (o.zero) lo = Math.min(0, lo);
    const pad = (hi - lo) * 0.08 || 1;
    lo -= pad; hi += pad;
  }
  const y = v => h - ((v - lo) / Math.max(1e-6, hi - lo)) * h;

  /* Baseline for delta charts. */
  if (o.baseline != null) {
    const b = document.createElementNS(NS, 'line');
    b.setAttribute('x1', 0); b.setAttribute('x2', w);
    b.setAttribute('y1', y(o.baseline)); b.setAttribute('y2', y(o.baseline));
    b.setAttribute('class', 'chart__base');
    svg.appendChild(b);
  }
  /* Corner markers, so a trace can be read against the circuit. */
  if (o.marks) {
    o.marks.forEach(function (m) {
      const l = document.createElementNS(NS, 'line');
      const x = m.pos * w;
      l.setAttribute('x1', x); l.setAttribute('x2', x);
      l.setAttribute('y1', 0); l.setAttribute('y2', h);
      l.setAttribute('class', 'chart__mark');
      svg.appendChild(l);
    });
  }
  o.series.forEach(function (s) {
    const n = s.values.length;
    let d = '';
    for (let i = 0; i < n; i++) d += (i ? 'L' : 'M') + ((i / (n - 1)) * w).toFixed(2) + ' ' + y(s.values[i]).toFixed(2) + ' ';
    if (s.fill) {
      const f = document.createElementNS(NS, 'path');
      f.setAttribute('d', d + 'L' + w + ' ' + h + ' L0 ' + h + ' Z');
      f.setAttribute('class', 'chart__fill');
      f.setAttribute('style', 'fill:' + s.colour);
      svg.appendChild(f);
    }
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', d);
    path.setAttribute('class', 'chart__line');
    path.setAttribute('style', 'stroke:' + s.colour + (s.dash ? ';stroke-dasharray:4 3' : ''));
    svg.appendChild(path);
  });
  return { svg, lo, hi };
};

SY.chartBlock = function (title, o) {
  const c = SY.chart(o);
  const legend = App.h('div.chart__legend');
  o.series.forEach(function (s) {
    legend.appendChild(App.h('span.chart__key', {}, [
      App.h('i', { style: { background: s.colour } }), App.h('span', { text: s.name })
    ]));
  });
  return App.h('div.chartbox', {}, [
    App.h('div.chartbox__head', {}, [
      App.h('span.chartbox__t', { text: title }),
      App.h('span.chartbox__r', { text: o.unit ? c.lo.toFixed(0) + '–' + c.hi.toFixed(0) + ' ' + o.unit : '' }),
      legend
    ]),
    c.svg
  ]);
};

/* ---------------------------------------------------------------------------
 * REGULATIONS
 * -------------------------------------------------------------------------*/
App.screens.regs = {
  render: function (root, params) {
    const st = App.state;
    root.appendChild(App.chrome('regs'));
    const main = App.h('main.page');
    const regs = st.regulations;

    main.appendChild(App.h('div.gr__head', {}, [
      App.h('div', {}, [
        App.h('p.eyebrow', { text: 'Ruleset ' + regs.version }),
        App.h('h1.page__h', { text: regs.name }),
        App.h('p.muted', { text: 'Rules are data, not hardcoded behaviour. Change a value here and the simulation changes with it — which is exactly what the working group does at the end of every season.' })
      ]),
      App.h('div.rnd__res', {}, [
        App.h('div.rres', {}, [
          App.h('span.rres__k', { text: 'Amendments' }),
          App.h('span.rres__v.num', { text: String(regs.history.length) })
        ])
      ])
    ]));

    const cols = App.h('div.rnd__cols');

    /* --- the articles --- */
    const rBody = App.h('div.card__body.card__body--tight');
    regs.rules.forEach(function (r) {
      const def = Engine.ruleDef(r.id, Data);
      if (!def) return;
      const changed = regs.history.filter(h => h.rule === r.id).length;
      const text = App.h('p.rule__text', { text: def.text, style: { display: 'none' } });
      rBody.appendChild(App.h('div.rule', { 'data-rule': r.id }, [
        App.h('div.rule__top', {}, [
          App.h('span.rule__a', { text: def.article }),
          App.h('span.rule__n', { text: def.name }),
          App.h('span.rule__v.num', { text: r.value + ' ' + def.unit }),
          changed ? App.h('span.rule__c', { text: '±' + changed }) : null,
          App.h('button.linkbtn', { text: 'Text', onclick: function (e) {
            const open = text.style.display !== 'none';
            text.style.display = open ? 'none' : '';
            e.currentTarget.textContent = open ? 'Text' : 'Hide';
          } })
        ]),
        text
      ]));
    });
    cols.appendChild(App.h('section.card', {}, [
      App.h('header.card__head', {}, [App.h('h2', { text: 'Articles in force' })]), rBody
    ]));

    /* --- legality of your car --- */
    const teamId = App.myTeamId();
    const lBody = App.h('div.card__body.card__body--tight');
    if (!teamId) lBody.appendChild(App.h('p.muted', { text: 'You have no car to scrutinise.' }));
    else {
      const ts = st.teams[teamId];
      const caps = Engine.regCaps(regs, Data);
      Data.COMPONENTS.forEach(function (comp) {
        const rating = ts.components[comp.key];
        const leg = Engine.legality(comp.key, rating, regs, Data, ts);
        const cap = caps[comp.key];
        const arts = (Data.COMPONENT_REGS[comp.key] || []).map(function (id) {
          const d = Engine.ruleDef(id, Data); return d ? d.article : id;
        });
        lBody.appendChild(App.h('div.legrow', { 'data-component': comp.key, style: { '--lc': leg.colour } }, [
          App.h('i.legrow__d'),
          App.h('span.legrow__n', { text: comp.name }),
          App.h('span.legrow__v.num', { text: rating.toFixed(1) + (cap != null ? ' / ' + cap : '') }),
          App.h('span.legrow__s', { text: leg.name }),
          App.h('span.legrow__a', { text: arts.join(', ') || '—' })
        ]));
      });
      lBody.appendChild(App.h('p.muted', { text: 'A component developed past its ceiling still reads its full rating in the factory. Only the legal part reaches the track — running the rest is what a grey-area interpretation is.' }));
    }
    cols.appendChild(App.h('section.card', {}, [
      App.h('header.card__head', {}, [App.h('h2', { text: 'Legality' }), App.h('span.card__tag', { text: 'per component' })]), lBody
    ]));

    /* --- working group --- */
    const wBody = App.h('div.card__body');
    if (!st.workingGroup) {
      wBody.appendChild(App.h('p.lede', { text: 'The technical working group meets at the end of the season.' }));
      wBody.appendChild(App.h('p.muted', { text: 'Proposals are put to the eleven teams. Each votes on whether the change helps or hurts their own car, which the game works out by re-deriving their machinery under the proposed ruleset. You can lobby before the vote.' }));
      if (st.round > st.calendar.length) {
        wBody.appendChild(App.h('button.btn.btn--primary', { id: 'btn-convene', text: 'Convene the working group', onclick: function () {
          SY.convene(); App.route('regs');
        } }));
      }
    } else {
      wBody.appendChild(SY.workingGroupPanel());
    }
    cols.appendChild(App.h('section.card', {}, [
      App.h('header.card__head', {}, [App.h('h2', { text: 'FIA working group' })]), wBody
    ]));

    main.appendChild(cols);

    if (regs.history.length) {
      const hBody = App.h('div.card__body.card__body--tight');
      regs.history.slice().reverse().forEach(function (h) {
        const def = Engine.ruleDef(h.rule, Data);
        hBody.appendChild(App.h('div.resrow', {}, [
          App.h('span.resrow__r', { text: String(h.season) }),
          App.h('span.resrow__n', { text: h.title }),
          App.h('span.resrow__p', { text: def ? def.name + ': ' + h.from + ' → ' + h.to : '' }),
          App.h('span.resrow__f', { text: h.for + '–' + h.against })
        ]));
      });
      main.appendChild(App.h('section.card', {}, [
        App.h('header.card__head', {}, [App.h('h2', { text: 'Amendment history' })]), hBody
      ]));
    }
    root.appendChild(main);
  }
};

SY.convene = function () {
  const st = App.state;
  const rng = Engine.rng(st.rngSeed);
  /* Proposals are generated from the rulebook rather than drawn from a fixed
     list, so a fiftieth season has as much to argue about as a second one. */
  const picked = Engine.generateProposals(st.regulations, Data, rng, 3);
  st.workingGroup = { proposals: picked, resolved: null, lobbied: {} };
  st.rngSeed = rng.s;
  App.logEvent('The FIA technical working group has convened. Three proposals are on the table.', 'info');
  App.save();
};

/* Proposals live on the working group, because they are generated for it. */
SY.proposalById = function (id) {
  const wg = App.state.workingGroup;
  if (wg) for (let i = 0; i < wg.proposals.length; i++) if (wg.proposals[i].id === id) return wg.proposals[i];
  return null;
};

SY.workingGroupPanel = function () {
  const st = App.state, wg = st.workingGroup, regs = st.regulations;
  const wrap = App.h('div');
  const teamId = App.myTeamId();

  if (wg.resolved) {
    wrap.appendChild(App.h('p.lede', { text: 'The vote is complete.' }));
    wg.resolved.forEach(function (r) {
      const p = SY.proposalById(r.id);
      wrap.appendChild(App.h('div.vote' + (r.passed ? '.is-passed' : ''), {}, [
        App.h('div.vote__top', {}, [
          App.h('b', { text: p.title }),
          App.h('span.vote__r', { text: r.passed ? 'PASSED' : 'REJECTED' })
        ]),
        App.h('p.muted', { text: r.for + ' for, ' + r.against + ' against.' })
      ]));
    });
    wrap.appendChild(App.h('button.btn.btn--primary', { id: 'btn-close-wg', text: 'Close the meeting', onclick: function () {
      st.workingGroup = null; App.save(); App.route('regs');
    } }));
    return wrap;
  }

  wg.proposals.forEach(function (prop) {
    const id = prop.id, p = prop;
    const def = Engine.ruleDef(p.rule, Data);
    const mine = teamId ? Engine.proposalImpact(p, regs, st.teams[teamId].components, Data) : 0;
    const lob = wg.lobbied[id] || 0;
    wrap.appendChild(App.h('div.prop', { 'data-proposal': id }, [
      App.h('div.prop__top', {}, [
        App.h('b', { text: p.title }),
        App.h('span.prop__d', { text: def.name + ' ' + def.value + ' → ' + (Engine.ruleValue(regs, p.rule) + p.delta) + ' ' + def.unit })
      ]),
      App.h('p.muted', { text: p.pitch }),
      teamId ? App.h('p.prop__me' + (mine > 0 ? '.is-good' : '.is-bad'), {
        text: mine > 0 ? 'This would help your car (' + mine.toFixed(2) + ')' : 'This would hurt your car (' + mine.toFixed(2) + ')'
      }) : null,
      teamId && App.can('rnd') ? App.h('div.godrow', {}, [
        App.h('button.btn.btn--sm' + (lob > 0 ? '.is-on' : ''), {
          'data-lobby-for': id, text: 'Lobby for it  ·  $6M',
          disabled: st.teams[teamId].budget < 6,
          onclick: function () { SY.lobby(id, 1); }
        }),
        App.h('button.btn.btn--sm' + (lob < 0 ? '.is-on' : ''), {
          'data-lobby-against': id, text: 'Lobby against  ·  $6M',
          disabled: st.teams[teamId].budget < 6,
          onclick: function () { SY.lobby(id, -1); }
        }),
        lob ? App.h('span.muted', { text: 'You have swung ' + Math.abs(lob).toFixed(2) + ' ' + (lob > 0 ? 'for' : 'against') }) : null
      ]) : null
    ]));
  });

  wrap.appendChild(App.h('button.btn.btn--primary', { id: 'btn-hold-vote', text: 'Hold the vote', onclick: function () {
    SY.holdVote(); App.route('regs');
  } }));
  wrap.appendChild(App.h('p.muted', { text: 'Lobbying buys influence with the other teams, weighted by your political standing. It does not buy the outcome.' }));
  return wrap;
};

SY.lobby = function (proposalId, dir) {
  const st = App.state, teamId = App.myTeamId();
  const ts = st.teams[teamId];
  if (ts.budget < 6) { App.toast('Not enough budget to lobby.', 'bad'); return; }
  ts.budget -= 6;
  const clout = 0.06 + (ts.ratings.engineering - 78) * 0.004;
  st.workingGroup.lobbied[proposalId] = (st.workingGroup.lobbied[proposalId] || 0) + dir * clout;
  /* Spread the influence to the other teams, which is where the vote is won. */
  for (const t in st.teams) {
    if (t === teamId) continue;
    st.teams[t].lobby = st.teams[t].lobby || {};
    st.teams[t].lobby[proposalId] = (st.teams[t].lobby[proposalId] || 0) + dir * clout * 0.6;
  }
  App.save();
  App.route('regs');
};

SY.holdVote = function () {
  const st = App.state, wg = st.workingGroup, regs = st.regulations;
  const rng = Engine.rng(st.rngSeed);
  const resolved = [];
  wg.proposals.forEach(function (p) {
    const id = p.id;
    const result = Engine.runVote(p, regs, st, Data, rng);
    resolved.push({ id, passed: result.passed, for: result.for, against: result.against });
    if (!result.passed) return;
    const rule = regs.rules.filter(r => r.id === p.rule)[0];
    const from = rule.value;
    rule.value = from + p.delta;
    regs.history.push({ season: st.season, rule: p.rule, title: p.title, from, to: rule.value,
                        for: result.for, against: result.against });
    App.logEvent('Regulation change passed: ' + p.title + '. ' + Engine.ruleDef(p.rule, Data).name +
                 ' moves from ' + from + ' to ' + rule.value + '.', 'warn');
  });
  /* A ruleset with amendments gets a new version number. */
  const n = regs.history.length;
  regs.version = st.season + 1 + '.' + (n + 1);
  wg.resolved = resolved;
  for (const t in st.teams) st.teams[t].lobby = {};
  st.rngSeed = rng.s;
  App.save();
};

/* ---------------------------------------------------------------------------
 * TELEMETRY
 * -------------------------------------------------------------------------*/
App.screens.telemetry = {
  render: function (root, params) {
    const st = App.state;
    root.appendChild(App.chrome('telemetry'));
    const main = App.h('main.page');
    const wk = st.weekend;

    if (!wk) {
      main.appendChild(App.h('h1.page__h', { text: 'Telemetry' }));
      main.appendChild(App.h('p.muted', { text: 'Nothing has run yet. Go to a circuit and complete a session.' }));
      root.appendChild(main);
      return;
    }
    const circuit = Data.circuitById(wk.circuitId);

    /* Every lap set this weekend, from whichever session is live or last ran. */
    const laps = SY.availableLaps();
    main.appendChild(App.h('div.gr__head', {}, [
      App.h('div', {}, [
        App.h('p.eyebrow', { text: circuit.name }),
        App.h('h1.page__h', { text: 'Telemetry and lap comparison' }),
        App.h('p.muted', { text: 'Traces are reconstructed from the circuit geometry, the car and the lap time actually set, so a slower lap really is a slower trace.' })
      ])
    ]));

    if (!laps.length) {
      main.appendChild(App.h('p.muted', { text: 'No completed laps yet this weekend.' }));
      root.appendChild(main);
      return;
    }

    /* Default the comparison to the fastest car from a DIFFERENT team. Two
       laps from the same garage produce two identical traces and teach nothing. */
    const teamOf = id => st.drivers[id].teamId;
    let defaultB = laps[1] ? laps[1].key : laps[0].key;
    for (let i = 1; i < laps.length; i++) {
      if (teamOf(laps[i].driverId) !== teamOf(laps[0].driverId)) { defaultB = laps[i].key; break; }
    }
    const pick = { a: params.a || laps[0].key, b: params.b || defaultB };
    const byKey = {};
    laps.forEach(l => { byKey[l.key] = l; });

    const chooser = App.h('div.lapchoose');
    ['a', 'b'].forEach(function (slot) {
      const sel = App.h('select.sel', { 'data-lap': slot, onchange: function (e) {
        pick[slot] = e.target.value;
        App.route('telemetry', { a: pick.a, b: pick.b });
      } });
      laps.forEach(function (l) {
        sel.appendChild(App.h('option', { value: l.key, text: l.label, selected: l.key === pick[slot] }));
      });
      chooser.appendChild(App.h('label.lapchoose__s', {}, [
        App.h('em', { text: slot === 'a' ? 'Reference' : 'Comparison' }), sel
      ]));
    });
    chooser.appendChild(App.h('button.btn.btn--sm', {
      id: 'btn-replay', text: 'Replay the reference lap',
      onclick: function () { SY.replay(byKeyForReplay[pickForReplay.a], circuit); }
    }));
    main.appendChild(chooser);

    const byKeyForReplay = byKey, pickForReplay = pick;
    const A = byKey[pick.a], B = byKey[pick.b];
    const tA = Engine.lapTrace({ circuit, derived: A.derived, Data, lapTime: A.time });
    const tB = Engine.lapTrace({ circuit, derived: B.derived, Data, lapTime: B.time });
    const cmp = Engine.compareTraces(tA, tB);
    const marks = tA.corners.map(c => ({ pos: c.pos }));

    main.appendChild(App.h('div.telsummary', {}, [
      sumCard(A, tA, '#00D2BE'),
      App.h('div.telsummary__mid', {}, [
        App.h('span.telsummary__d.num' + (cmp.total > 0 ? '.is-loss' : '.is-gain'), { text: App.fmt.signed(cmp.total, 3) + 's' }),
        App.h('span.muted', { text: 'over the lap' }),
        App.h('div.telthirds', {}, cmp.thirds.map(function (d, i) {
          return App.h('span.telthird' + (d > 0 ? '.is-loss' : '.is-gain'), { text: 'S' + (i + 1) + ' ' + App.fmt.signed(d, 3) });
        }))
      ]),
      sumCard(B, tB, '#E10600')
    ]));

    main.appendChild(SY.chartBlock('Speed', {
      series: [
        { name: A.label, colour: '#00D2BE', values: tA.samples.map(s => s.speed) },
        { name: B.label, colour: '#E10600', dash: true, values: tB.samples.map(s => s.speed) }
      ], unit: 'km/h', marks, height: 170
    }));
    main.appendChild(SY.chartBlock('Delta — ' + B.label + ' against ' + A.label, {
      series: [{ name: 'Delta', colour: '#B57BFF', values: cmp.delta.map(d => d.d) }],
      unit: 's', baseline: 0, marks, height: 110
    }));
    main.appendChild(App.h('div.telgrid', {}, [
      SY.chartBlock('Throttle', {
        series: [
          { name: A.label, colour: '#00D2BE', values: tA.samples.map(s => s.throttle) },
          { name: B.label, colour: '#E10600', dash: true, values: tB.samples.map(s => s.throttle) }
        ], min: 0, max: 100, unit: '%', marks, height: 100
      }),
      SY.chartBlock('Brake', {
        series: [
          { name: A.label, colour: '#00D2BE', values: tA.samples.map(s => s.brake) },
          { name: B.label, colour: '#E10600', dash: true, values: tB.samples.map(s => s.brake) }
        ], min: 0, max: 100, unit: '%', marks, height: 100
      }),
      SY.chartBlock('Gear', {
        series: [
          { name: A.label, colour: '#00D2BE', values: tA.samples.map(s => s.gear) },
          { name: B.label, colour: '#E10600', dash: true, values: tB.samples.map(s => s.gear) }
        ], min: 0, max: 8, marks, height: 100
      }),
      SY.chartBlock('Battery charge', {
        series: [
          { name: A.label, colour: '#00D2BE', values: tA.samples.map(s => s.charge) },
          { name: B.label, colour: '#E10600', dash: true, values: tB.samples.map(s => s.charge) }
        ], min: 0, max: 100, unit: '%', marks, height: 100
      })
    ]));

    /* Where the time went, corner by corner. */
    const rows = [];
    for (let i = 0; i < tA.corners.length; i++) {
      const c = tA.corners[i];
      const idx = Math.floor(c.pos * cmp.delta.length);
      const prev = i === 0 ? 0 : cmp.delta[Math.floor(tA.corners[i - 1].pos * cmp.delta.length)].d;
      rows.push({ num: c.num, speed: c.speed, d: cmp.delta[idx].d - prev,
                  vA: cmp.delta[idx].vA, vB: cmp.delta[idx].vB });
    }
    rows.sort((x, y) => Math.abs(y.d) - Math.abs(x.d));
    const cBody = App.h('div.card__body.card__body--tight');
    rows.slice(0, 8).forEach(function (r) {
      cBody.appendChild(App.h('div.acrank', {}, [
        App.h('span.acrank__n', { text: 'Turn ' + r.num + '  ·  ' + r.speed + ' km/h' }),
        App.h('span.acrank__s', { text: r.vA + ' vs ' + r.vB + ' km/h' }),
        App.h('i.acrank__t', {}, [App.h('i.acrank__f', { style: { '--w': Engine.clamp(Math.abs(r.d) / 0.3 * 100, 4, 100) + '%' } })]),
        App.h('span.acrank__v.num' + (r.d > 0 ? '.is-neg' : ''), { text: App.fmt.signed(r.d, 3) + 's' })
      ]));
    });
    main.appendChild(App.h('section.card', {}, [
      App.h('header.card__head', {}, [App.h('h2', { text: 'Biggest differences by corner' })]), cBody
    ]));

    root.appendChild(main);

    function sumCard(L, tr, colour) {
      return App.h('div.telsummary__c', { style: { '--tc': colour } }, [
        App.h('b', { text: L.label }),
        App.h('span.num.telsummary__t', { text: Engine.fmtLap(L.time) }),
        App.h('span.muted', { text: 'Top speed ' + tr.vTop + ' km/h' })
      ]);
    }
  }
};

/* ---------------------------------------------------------------------------
 * QUALIFYING REPLAY
 * A scrubbable lap: the car moves around the circuit while a cursor tracks the
 * traces, so a lap time becomes something you watch rather than a number.
 * Everything is driven off the same Engine.lapTrace() the charts use.
 * -------------------------------------------------------------------------*/
SY.replay = function (lap, circuit) {
  const trace = Engine.lapTrace({ circuit, derived: lap.derived, Data, lapTime: lap.time });
  const path = Engine.trackPath(circuit, Data);
  const body = App.modal('Replay — ' + lap.label, { wide: true });

  const NS = 'http://www.w3.org/2000/svg';
  const svg = App.trackSVG(circuit, { size: 300, sectors: true });
  const dot = document.createElementNS(NS, 'circle');
  dot.setAttribute('r', 3.2);
  dot.setAttribute('class', 'trackmap__car is-mine');
  dot.setAttribute('fill', '#E10600');
  svg.appendChild(dot);

  const readout = App.h('div.replay__read');
  const kv = {};
  ['Speed', 'Gear', 'Throttle', 'Brake', 'Battery', 'Elapsed'].forEach(function (k) {
    const v = App.h('span.kv__v.num', { text: '—' });
    kv[k] = v;
    readout.appendChild(App.h('div.kv', {}, [App.h('span.kv__k', { text: k }), v]));
  });

  const chart = SY.chart({
    series: [{ name: 'Speed', colour: '#E10600', values: trace.samples.map(s => s.speed), fill: true }],
    marks: trace.corners.map(c => ({ pos: c.pos })), height: 120, width: 640
  });
  const cursor = document.createElementNS(NS, 'line');
  cursor.setAttribute('y1', 0); cursor.setAttribute('y2', 120);
  cursor.setAttribute('class', 'chart__cursor');
  chart.svg.appendChild(cursor);

  const scrub = App.h('input.replay__scrub', {
    type: 'range', min: 0, max: trace.samples.length - 1, value: 0, id: 'replay-scrub',
    oninput: function (e) { show(Number(e.target.value)); }
  });

  let playing = false, timer = null, idx = 0;
  const playBtn = App.h('button.ctrl__play', { id: 'replay-play', text: '▶', onclick: function () {
    playing = !playing;
    playBtn.textContent = playing ? '❚❚' : '▶';
    playBtn.classList.toggle('is-on', playing);
    if (playing) tick(); else if (timer) { clearInterval(timer); timer = null; }
  } });
  const speedSel = App.h('select.sel', { id: 'replay-speed' });
  [['1', 1], ['0.5', 0.5], ['0.25', 0.25]].forEach(function (o) {
    speedSel.appendChild(App.h('option', { value: o[1], text: o[0] + '×' }));
  });

  function tick() {
    if (timer) clearInterval(timer);
    const rate = Number(speedSel.value || 1);
    /* Real time: the lap plays back at the speed it was actually driven. */
    const ms = (trace.lapTime * 1000 / trace.samples.length) / rate;
    timer = setInterval(function () {
      idx = (idx + 1) % trace.samples.length;
      scrub.value = idx;
      show(idx);
    }, Math.max(16, ms));
    App._timers.push(timer);
  }

  function show(i) {
    idx = i;
    const s = trace.samples[i];
    const f = s.pos * path.pts.length;
    const i0 = Math.floor(f), t = f - i0;
    const a = path.pts[i0 % path.pts.length], b = path.pts[(i0 + 1) % path.pts.length];
    const pad = 8, span = 100 - pad * 2;
    dot.setAttribute('cx', (pad + Engine.lerp(a.x, b.x, t) * span).toFixed(2));
    dot.setAttribute('cy', (pad + Engine.lerp(a.y, b.y, t) * span).toFixed(2));
    const x = (i / (trace.samples.length - 1)) * 640;
    cursor.setAttribute('x1', x); cursor.setAttribute('x2', x);
    kv.Speed.textContent = s.speed + ' km/h';
    kv.Gear.textContent = String(s.gear);
    kv.Throttle.textContent = s.throttle + '%';
    kv.Brake.textContent = s.brake + '%';
    kv.Battery.textContent = s.charge + '%';
    kv.Elapsed.textContent = s.t.toFixed(2) + 's';
  }

  body.appendChild(App.h('p.muted', { text: 'The lap plays back at the speed it was driven. Drag the slider to stop anywhere on the circuit.' }));
  body.appendChild(App.h('div.replay', {}, [
    App.h('div.replay__map', {}, [svg]),
    App.h('div.replay__side', {}, [readout, App.h('div.chartbox', {}, [chart.svg])])
  ]));
  body.appendChild(App.h('div.replay__ctrl', {}, [
    playBtn, scrub,
    App.h('label.godsel', {}, [App.h('em', { text: 'Speed' }), speedSel])
  ]));
  show(0);
};

/* Every lap available to compare this weekend. */
SY.availableLaps = function () {
  const wk = App.state.weekend;
  const out = [];
  if (!wk) return out;
  const live = wk.live;
  if (live && live.cars) {
    live.cars.forEach(function (c) {
      const hist = c.history || c.lapHistory || [];
      if (!hist.length) return;
      /* Best lap plus the most recent one, which is what anyone actually wants
         to compare. Offering all 57 laps of 22 cars is a menu nobody reads. */
      let best = null;
      hist.forEach(function (l) { if (!best || l.time < best.time) best = l; });
      if (best) out.push({ key: c.driverId + ':best', driverId: c.driverId, derived: c.derived,
                           time: best.time, label: c.code + ' best ' + Engine.fmtLap(best.time) });
      const last = hist[hist.length - 1];
      if (last && last !== best) out.push({ key: c.driverId + ':last', driverId: c.driverId, derived: c.derived,
                                            time: last.time, label: c.code + ' last ' + Engine.fmtLap(last.time) });
    });
  }
  out.sort((a, b) => a.time - b.time);
  return out;
};

/* ---------------------------------------------------------------------------
 * CAR LAB
 * -------------------------------------------------------------------------*/
App.screens.lab = {
  render: function (root, params) {
    const st = App.state;
    root.appendChild(App.chrome('lab'));
    const main = App.h('main.page');
    const teamId = App.myTeamId() || 'mclaren';
    const baseline = Object.assign({}, st.teams[teamId] ? st.teams[teamId].components : Data.launchComponents(Data.teamById(teamId)));

    st.lab = st.lab || { components: Object.assign({}, baseline), setup: Data.defaultSetup(),
                         circuits: ['monza', 'suzuka', 'monaco', 'silverstone'] };
    const lab = st.lab;

    main.appendChild(App.h('div.gr__head', {}, [
      App.h('div', {}, [
        App.h('p.eyebrow', { text: 'Sandbox  ·  nothing here touches your championship' }),
        App.h('h1.page__h', { text: 'Car Lab' }),
        App.h('p.muted', { text: 'Build a car, run it through the wind tunnel, then run it at four circuits at once. The point is to discover that there is no universally quick car.' })
      ]),
      App.h('div.gr__switch', {}, [
        App.h('button.btn.btn--sm.btn--ghost', { id: 'btn-lab-reset', text: 'Reset to your car', onclick: function () {
          lab.components = Object.assign({}, baseline);
          lab.setup = Data.defaultSetup();
          App.route('lab');
        } })
      ])
    ]));

    const cols = App.h('div.gr__cols');

    /* --- inputs --- */
    const iBody = App.h('div.card__body');
    Data.COMPONENT_GROUPS.forEach(function (g) {
      const inGroup = Data.COMPONENTS.filter(c => c.group === g);
      if (!inGroup.length) return;
      iBody.appendChild(App.h('h3.tree__g', { text: g }));
      inGroup.forEach(function (comp) {
        const val = App.h('span.slider__v.num', { text: lab.components[comp.key].toFixed(1) });
        iBody.appendChild(App.h('label.slider', {}, [
          App.h('span.slider__k', { text: comp.name }),
          App.h('input', { type: 'range', min: 50, max: 102, step: 1, value: lab.components[comp.key],
            'data-lab': comp.key,
            oninput: function (e) {
              lab.components[comp.key] = Number(e.target.value);
              val.textContent = Number(e.target.value).toFixed(1);
              SY.labRun();
            } }),
          val
        ]));
      });
    });
    iBody.appendChild(App.h('h3.tree__g', { text: 'Setup' }));
    ['frontWing', 'rearWing', 'rideFront', 'rideRear', 'cooling'].forEach(function (k) {
      const f = Data.setupFieldByKey(k);
      const val = App.h('span.slider__v.num', { text: String(lab.setup[k]) });
      iBody.appendChild(App.h('label.slider', {}, [
        App.h('span.slider__k', { text: f.name }),
        App.h('input', { type: 'range', min: f.min, max: f.max, value: lab.setup[k], 'data-lab-setup': k,
          oninput: function (e) { lab.setup[k] = Number(e.target.value); val.textContent = e.target.value; SY.labRun(); } }),
        val
      ]));
    });
    cols.appendChild(App.h('section.card', {}, [
      App.h('header.card__head', {}, [App.h('h2', { text: 'Build the car' })]), iBody
    ]));

    /* --- outputs --- */
    const right = App.h('div.gr__right');
    right.appendChild(App.h('section.card', {}, [
      App.h('header.card__head', {}, [App.h('h2', { text: 'Wind tunnel' }), App.h('span.card__tag', { text: 'against your race car' })]),
      App.h('div.card__body', {}, [App.h('div', { id: 'lab-tunnel' })])
    ]));
    right.appendChild(App.h('section.card', {}, [
      App.h('header.card__head', {}, [App.h('h2', { text: 'Track simulation' }), App.h('span.card__tag', { text: 'four circuits at once' })]),
      App.h('div.card__body', {}, [App.h('div', { id: 'lab-track' })])
    ]));
    cols.appendChild(right);
    main.appendChild(cols);
    root.appendChild(main);

    SY.labBaseline = baseline;
    SY.labRun();
  }
};

SY.labRun = function () {
  const st = App.state, lab = st.lab;
  const tunnel = App.$('#lab-tunnel'), track = App.$('#lab-track');
  if (!tunnel || !track) return;
  const caps = Engine.regCaps(st.regulations, Data);
  const driver = App.myDriverIds().length ? App.driver(App.myDriverIds()[0]) : App.driver('norris');

  const a = Engine.deriveCar(SY.labBaseline, Data.defaultSetup(), null, Data, { caps });
  const b = Engine.deriveCar(lab.components, lab.setup, null, Data, { caps });

  App.clear(tunnel);
  const rows = [
    ['Downforce', (a.ch.downforceFront + a.ch.downforceRear) / 2, (b.ch.downforceFront + b.ch.downforceRear) / 2, true],
    ['Drag', a.ch.drag, b.ch.drag, false],
    ['Aero efficiency', a.ch.aeroEfficiency, b.ch.aeroEfficiency, true],
    ['Mechanical grip', a.ch.mechGrip, b.ch.mechGrip, true],
    ['Power', a.ch.power, b.ch.power, true],
    ['Cooling margin', a.dom.cooling, b.dom.cooling, true],
    ['Reliability', a.ch.reliability, b.ch.reliability, true]
  ];
  rows.forEach(function (r) {
    const d = r[2] - r[1];
    tunnel.appendChild(App.h('div.labrow', {}, [
      App.h('span.labrow__k', { text: r[0] }),
      App.h('span.labrow__a.num', { text: r[1].toFixed(1) }),
      App.h('span.labrow__arrow', { text: '→' }),
      App.h('span.labrow__b.num', { text: r[2].toFixed(1) }),
      App.h('span.labrow__d.num' + (Math.abs(d) < 0.05 ? '' : ((d > 0) === r[3] ? '.is-gain' : '.is-loss')), {
        text: App.fmt.signed(d, 1) })
    ]));
  });
  const syn = b.synergy;
  tunnel.appendChild(App.h('div.labsyn', {}, Object.keys(syn.families).map(function (f) {
    const fam = syn.families[f];
    return App.h('div.labsyn__r', {}, [
      App.h('span', { text: fam.name }),
      App.h('i.labsyn__t', {}, [App.h('i.labsyn__f', { style: { '--w': Engine.clamp(fam.evenness * 100, 0, 100) + '%' } })]),
      App.h('span.num' + (fam.bonus > 0 ? '.is-gain' : '.is-loss'), { text: App.fmt.signed(fam.bonus, 2) })
    ]);
  })));
  tunnel.appendChild(App.h('p.muted', { text: 'Synergy is driven by how evenly a family is developed. A spread of twelve points inside a family wipes the bonus out entirely.' }));

  App.clear(track);
  lab.circuits.forEach(function (id) {
    const c = Data.circuitById(id);
    const shares = Engine.sectorShares(c);
    function lap(comps, setup) {
      return Engine.lapTime({
        Data, rng: null, derived: Engine.deriveCar(comps, setup, c, Data, { caps }), driver, circuit: c,
        tyre: Engine.newTyre('S', 0), fuelKg: 12, trackGrip: 0.94, wet: 0,
        energyEffect: 0, charge: 80, push: 'ATTACK', mode: 'quali', sectorShares: shares, dirtyAir: 0
      }).time;
    }
    const base = lap(SY.labBaseline, Data.defaultSetup());
    const now = lap(lab.components, lab.setup);
    const d = now - base;
    track.appendChild(App.h('div.labtrack', {}, [
      App.h('span.labtrack__n', { text: c.name }),
      App.h('i.labtrack__t', {}, [
        App.h('i.labtrack__f' + (d < 0 ? '.is-gain' : '.is-loss'), {
          style: { '--w': Engine.clamp(Math.abs(d) / 1.2 * 50, 1, 50) + '%' } })
      ]),
      App.h('span.labtrack__v.num' + (d < 0 ? '.is-gain' : '.is-loss'), { text: App.fmt.signed(d, 3) + 's' })
    ]));
  });
  track.appendChild(App.h('p.muted', { text: 'A car that gains at Monza and loses at Monaco has not got worse. It has become a different car, and the calendar decides whether that was a good idea.' }));
};
