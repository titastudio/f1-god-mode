WK.mountTower = function () {
  const live = App.state.weekend.live;
  const tower = App.clear(App.$('#tower'));
  const mine = App.myDriverIds();
  tower.appendChild(App.h('div.tw__head', {}, [
    App.h('span', { text: 'P' }), App.h('span', { text: 'Driver' }),
    App.h('span', { text: 'Tyre' }), App.h('span', { text: 'Best' }),
    App.h('span', { text: 'Gap' }), App.h('span', { text: 'Sec' }), App.h('span', { text: 'L' })
  ]));
  live.els.cutLine = App.h('div.tw__cut', { text: 'ELIMINATION ZONE' });
  live.els.towerBody = tower;

  for (let i = 0; i < live.cars.length; i++) {
    const c = live.cars[i];
    const cell = {
      pos: App.h('span.tw__p'),
      tyre: App.h('span.tw__t'),
      best: App.h('span.tw__b.num'),
      gap: App.h('span.tw__g.num'),
      laps: App.h('span.tw__l.num'),
      sq: [App.h('i.sq'), App.h('i.sq'), App.h('i.sq')]
    };
    cell.root = App.h('div.tw__row' + (mine.indexOf(c.driverId) !== -1 ? '.is-mine' : ''), {
      style: { '--tc': c.colour }, 'data-code': c.code, 'data-driver': c.driverId,
      onclick: function () { WK.select(c.driverId); }
    }, [
      cell.pos,
      App.h('span.tw__d', {}, [App.h('i.tw__bar'), App.h('b', { text: c.code }),
        App.h('em', { text: Data.teamById(c.teamId).shortName })]),
      cell.tyre, cell.best, cell.gap,
      App.h('span.tw__s', {}, cell.sq),
      cell.laps
    ]);
    live.els.rows[c.driverId] = cell;
    tower.appendChild(cell.root);
  }
};

WK.refreshTower = function () {
  const live = App.state.weekend.live, els = live.els;
  const cut = live.type === 'qualifying' && live.segKey ? Data.QUALI_SEGMENTS[live.segKey].advance : null;
  const leader = live.order.length ? WK.carById(live.order[0]).best : null;
  let activeSeen = 0;

  for (let i = 0; i < live.order.length; i++) {
    const c = WK.carById(live.order[i]);
    const cell = els.rows[c.driverId];
    if (!c.eliminated) activeSeen++;
    /* Re-appending an existing node moves it without destroying it, so the
       listener and any in-flight click survive the reorder. */
    els.towerBody.appendChild(cell.root);
    if (cut && activeSeen === cut && !c.eliminated) els.towerBody.appendChild(els.cutLine);

    cell.pos.textContent = String(i + 1);
    const comp = Data.COMPOUNDS[c.tyre.compound];
    cell.tyre.textContent = comp.short + (c.tyre.laps ? c.tyre.laps : '');
    cell.tyre.style.color = comp.colour;
    cell.best.textContent = c.best != null ? Engine.fmtLap(c.best) : (c.mode === 'GARAGE' ? 'PIT' : c.mode);
    const gap = (c.best != null && leader != null && i > 0) ? c.best - leader : null;
    cell.gap.textContent = gap != null ? App.fmt.gap(gap) : (i === 0 && c.best != null ? 'LEADER' : '—');
    cell.laps.textContent = String(c.laps);
    for (let k = 0; k < 3; k++) cell.sq[k].className = 'sq' + (c.liveSectors[k] ? ' sq--' + c.liveSectors[k] : '');
    cell.root.classList.toggle('is-out', !!c.eliminated);
    cell.root.classList.toggle('is-danger', !!(cut && !c.eliminated && activeSeen > cut));
    cell.root.classList.toggle('is-running', c.mode === 'PUSH');
    cell.root.classList.toggle('is-sel', live.selected === c.driverId);
  }
  if (!cut && els.cutLine.parentNode) els.cutLine.parentNode.removeChild(els.cutLine);
};

WK.mountMap = function () {
  const live = App.state.weekend.live;
  const host = App.clear(App.$('#live-map'));
  const circuit = WK.circuit();
  const svg = App.trackSVG(circuit, { size: 340, sectors: true });
  const NS = 'http://www.w3.org/2000/svg';
  const path = Engine.trackPath(circuit);
  live.els.path = path;
  const mine = App.myDriverIds();
  for (let i = 0; i < live.cars.length; i++) {
    const c = live.cars[i];
    const dot = document.createElementNS(NS, 'circle');
    dot.setAttribute('r', mine.indexOf(c.driverId) !== -1 ? 2.7 : 2.0);
    dot.setAttribute('fill', c.colour);
    dot.setAttribute('class', 'trackmap__car' + (mine.indexOf(c.driverId) !== -1 ? ' is-mine' : ''));
    dot.setAttribute('data-code', c.code);
    svg.appendChild(dot);
    live.els.dots[c.driverId] = dot;
  }
  host.appendChild(svg);
  live.els.mapOn = App.h('span');
  live.els.mapBest = App.h('span');
  host.appendChild(App.h('div.maplegend', {}, [live.els.mapOn, live.els.mapBest]));
};

WK.refreshMap = function () {
  const live = App.state.weekend.live, els = live.els;
  const path = els.path, pad = 8, span = 100 - pad * 2;
  let onTrack = 0;
  for (let i = 0; i < live.cars.length; i++) {
    const c = live.cars[i];
    const dot = els.dots[c.driverId];
    const running = c.mode !== 'GARAGE' && !c.eliminated;
    dot.style.display = running ? '' : 'none';
    if (!running) continue;
    onTrack++;
    /* lapProgress is a fraction and must stay one: a large tick could push it
       past 1 and place the car off the end of the point array. */
    c.lapProgress = Engine.clamp(c.lapProgress, 0, 0.99999);
    const f = Engine.clamp(c.lapProgress, 0, 0.99999) * path.pts.length;
    const i0 = Math.floor(f), t = f - i0;
    const a = path.pts[i0 % path.pts.length], b = path.pts[(i0 + 1) % path.pts.length];
    dot.setAttribute('cx', (pad + Engine.lerp(a.x, b.x, t) * span).toFixed(2));
    dot.setAttribute('cy', (pad + Engine.lerp(a.y, b.y, t) * span).toFixed(2));
    dot.setAttribute('opacity', c.mode === 'PUSH' ? '1' : '0.55');
  }
  els.mapOn.textContent = onTrack + ' on track  ·  ' + (live.cars.length - onTrack) + ' in the garage';
  els.mapBest.textContent = live.bestLap ? 'Session best ' + Engine.fmtLap(live.bestLap) : 'No time set';
};

/* Your cars, as a switcher at the top of the telemetry panel.
   WHY: with a team career you have two drivers, and before this the panel only
   ever opened on the first one. Every pit order and energy change silently
   applied to that car alone, so half your team was unreachable. */
/* One place that changes which car the telemetry is showing, so the tower
   highlight and the panel can never disagree about it. */
WK.select = function (driverId) {
  const live = App.state.weekend.live;
  live.selected = driverId;
  WK.mountTele();
  WK.refreshTele();
  WK.refreshTower();
};

WK.driverSwitch = function (currentId, onPick) {
  const mine = App.myDriverIds();
  const row = App.h('div.mycars');
  if (mine.length > 1) {
    row.appendChild(App.h('span.mycars__k', { text: 'Your cars' }));
    mine.forEach(function (id) {
      const d = Data.driverById(id);
      const team = Data.teamById(App.state.drivers[id].teamId);
      row.appendChild(App.h('button.mycars__b' + (id === currentId ? '.is-on' : ''), {
        text: d.last, 'data-mycar': id, style: { '--tc': team.colour },
        onclick: function () { onPick(id); }
      }));
    });
  }
  /* Anyone can inspect anyone. An observer has no cars of their own, so
     without this the panel is stuck on whoever happens to be leading. */
  const sel = App.h('select.sel.mycars__sel', { 'data-driver-pick': '1',
    onchange: function (e) { onPick(e.target.value); } });
  Data.DRIVERS.forEach(function (d) {
    const t = Data.teamById(App.state.drivers[d.id].teamId);
    sel.appendChild(App.h('option', { value: d.id, text: d.last + ' — ' + t.shortName,
      selected: d.id === currentId }));
  });
  row.appendChild(App.h('span.mycars__k', { text: mine.length > 1 ? 'Or any car' : 'Any car' }));
  row.appendChild(sel);
  return row;
};

WK.mountTele = function () {
  const live = App.state.weekend.live;
  const host = App.clear(App.$('#live-tele'));
  const id = live.selected || App.myDriverIds()[0] || live.order[0];
  const c = WK.carById(id);
  if (!c) return;
  const t = live.els.tele = { id };

  t.num = App.h('span.tele__num', { style: { '--tc': c.colour }, text: String(c.num) });
  t.mode = App.h('span.tele__mode');
  host.appendChild(App.h('div.tele__head', {}, [
    t.num, App.h('b', { text: c.name }),
    App.h('span.muted', { text: Data.teamById(c.teamId).name }), t.mode
  ]));
  host.appendChild(WK.driverSwitch(id, function (pick) { WK.select(pick); }));

  t.kv = {};
  const keys = ['Best lap', 'Last lap', 'Theoretical', 'S1', 'S2', 'S3',
                'Tyre', 'Wear', 'Core temp', 'Battery', 'PU temp', 'Fuel'];
  const grid = App.h('div.tele__grid');
  keys.forEach(function (k) {
    const v = App.h('span.kv__v.num', { text: '—' });
    t.kv[k] = v;
    grid.appendChild(App.h('div.kv', {}, [App.h('span.kv__k', { text: k }), v]));
  });
  host.appendChild(grid);

  t.meters = {};
  const bars = App.h('div.tele__bars');
  [['Tyre wear'], ['Battery'], ['PU thermal']].forEach(function (m) {
    const fill = App.h('i.meter__f'), val = App.h('span.meter__v');
    const row = App.h('div.meter', {}, [
      App.h('span.meter__k', { text: m[0] }),
      App.h('i.meter__t', {}, [fill]), val
    ]);
    t.meters[m[0]] = { row, fill, val };
    bars.appendChild(row);
  });
  host.appendChild(bars);
  host.appendChild(App.h('button.linkbtn', { text: 'Why this lap time?', onclick: function () {
    const car = WK.carById(live.els.tele.id);
    if (car && car.history.length) WK.whyModal(car);
    else App.toast('No completed lap for this car yet.');
  } }));
};

WK.refreshTele = function () {
  const live = App.state.weekend.live, t = live.els.tele;
  if (!t) return;
  const c = WK.carById(t.id);
  if (!c) return;
  const comp = Data.COMPOUNDS[c.tyre.compound];
  t.mode.textContent = c.eliminated ? 'ELIMINATED' : c.mode;
  const theo = c.bestSectors.every(s => s != null) ? c.bestSectors[0] + c.bestSectors[1] + c.bestSectors[2] : null;
  t.kv['Best lap'].textContent = c.best != null ? Engine.fmtLap(c.best) : '—';
  t.kv['Last lap'].textContent = c.last != null ? Engine.fmtLap(c.last) : '—';
  t.kv['Theoretical'].textContent = theo ? Engine.fmtLap(theo) : '—';
  t.kv['S1'].textContent = App.fmt.sec(c.bestSectors[0]);
  t.kv['S2'].textContent = App.fmt.sec(c.bestSectors[1]);
  t.kv['S3'].textContent = App.fmt.sec(c.bestSectors[2]);
  t.kv['Tyre'].textContent = comp.name + '  ' + c.tyre.laps + 'L';
  t.kv['Wear'].textContent = c.tyre.wear.toFixed(0) + '%';
  t.kv['Core temp'].textContent = c.tyre.temp.toFixed(0) + '°C';
  t.kv['Battery'].textContent = c.energy.charge.toFixed(0) + '%';
  t.kv['PU temp'].textContent = c.energy.heat.toFixed(0) + '°C';
  t.kv['Fuel'].textContent = c.fuelKg.toFixed(1) + ' kg';

  meter('Tyre wear', c.tyre.wear, c.tyre.wear > 75 ? 'bad' : (c.tyre.wear > 45 ? 'warn' : 'ok'));
  meter('Battery', c.energy.charge, c.energy.charge < 25 ? 'warn' : 'ok');
  meter('PU thermal', c.energy.heat - 30, c.energy.heat > 106 ? 'bad' : 'ok');

  function meter(k, v, tone) {
    const m = t.meters[k];
    m.fill.style.setProperty('--w', Engine.clamp(v, 0, 100) + '%');
    m.val.textContent = Math.round(v);
    m.row.className = 'meter meter--' + tone;
  }
};

WK.mountSide = function () {
  const live = App.state.weekend.live;
  const host = App.clear(App.$('#live-side'));
  host.appendChild(App.h('h3.side__h', { text: 'Race control & radio' }));
  live.els.feed = App.h('div.side__feed');
  host.appendChild(live.els.feed);
  live.els.msgSeen = 0;
};

WK.refreshSide = function () {
  const live = App.state.weekend.live, els = live.els;
  const total = live.messages.length;
  if (total === els.msgSeen) return;
  /* Messages are unshifted, so only the newest `total - seen` are unseen. */
  const fresh = live.messages.slice(0, total - els.msgSeen).reverse();
  for (let i = 0; i < fresh.length; i++) {
    const m = fresh[i];
    els.feed.insertBefore(App.h('div.msg.msg--' + m.kind, {}, [
      App.h('span.msg__t', { text: App.fmt.clock(m.t) }),
      App.h('span.msg__x', { text: m.text })
    ]), els.feed.firstChild);
  }
  els.msgSeen = total;
  while (els.feed.childNodes.length > 40) els.feed.removeChild(els.feed.lastChild);
};

WK.mountCtrl = function () {
  const live = App.state.weekend.live;
  const host = App.clear(App.$('#ctrl'));
  const e = live.els;

  e.play = App.h('button.ctrl__play', {
    id: 'btn-play', title: 'Play or pause',
    onclick: function () { live.running = !live.running; WK.refreshCtrl(); }
  });
  host.appendChild(e.play);

  e.speedBtns = {};
  const speeds = App.h('div.ctrl__speeds');
  [1, 2, 5, 10, 25, 50].forEach(function (s) {
    const b = App.h('button.spd', { text: s + '×', 'data-speed': s,
      onclick: function () { live.speed = s; WK.refreshCtrl(); } });
    e.speedBtns[s] = b;
    speeds.appendChild(b);
  });
  host.appendChild(speeds);

  e.skip = App.h('button.btn.btn--sm.btn--ghost', {
    id: 'btn-skip', text: 'Skip to end',
    onclick: function () { live.running = false; WK.runToEnd(); WK.mountTele(); WK.refresh(); }
  });
  host.appendChild(e.skip);

  if (App.can('setup') || App.can('orders') || App.can('world')) {
    host.appendChild(App.h('button.btn.btn--sm.btn--god', {
      id: 'btn-god', text: '⏸ God pause',
      onclick: function () { live.running = false; WK.refreshCtrl(); WK.godPanel(); }
    }));
  }
  e.cont = App.h('button.btn.btn--sm.btn--primary', {
    id: 'btn-continue', text: 'Continue', onclick: function () { App.route('weekend'); }
  });
  host.appendChild(e.cont);
  e.state = App.h('span.ctrl__state');
  host.appendChild(e.state);
};

WK.refreshCtrl = function () {
  const live = App.state.weekend.live, e = live.els;
  e.play.textContent = live.running ? '❚❚' : '▶';
  e.play.classList.toggle('is-on', live.running);
  e.play.disabled = live.finished;
  for (const s in e.speedBtns) e.speedBtns[s].classList.toggle('is-on', Number(s) === live.speed);
  e.skip.disabled = live.finished;
  e.cont.style.display = live.finished ? '' : 'none';
  e.state.textContent = live.finished ? 'Session complete' :
    (live.running ? 'Running at ' + live.speed + '×' : 'Paused');
};

WK.whyModal = function (c) {
  const lap = c.history[c.history.length - 1];
  const body = App.modal('Why ' + Engine.fmtLap(lap.time) + '?', { wide: true });
  body.appendChild(App.h('p.muted', { text: 'Every number below is the exact value the simulation used for this lap. They sum to the lap time.' }));
  const list = App.h('div.whylist');
  const sorted = lap.why.slice().sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta));
  for (let i = 0; i < sorted.length; i++) {
    const w = sorted[i];
    list.appendChild(App.h('div.whyrow' + (w.delta > 0 ? '.is-loss' : '.is-gain'), {}, [
      App.h('span.whyrow__k', { text: w.label }),
      App.h('span.whyrow__d', { text: w.detail || '' }),
      App.h('span.whyrow__v.num', { text: App.fmt.signed(w.delta, 3) + 's' })
    ]));
  }
  body.appendChild(list);

  body.appendChild(App.h('h3.modal__h', { text: 'Where the car spends the lap' }));
  const dom = App.h('div.whylist');
  const ds = lap.domainSplit.slice().sort((a, b) => b.delta - a.delta);
  for (let i = 0; i < ds.length; i++) {
    dom.appendChild(App.h('div.whyrow' + (ds[i].delta > 0 ? '.is-loss' : '.is-gain'), {}, [
      App.h('span.whyrow__k', { text: ds[i].label }),
      App.h('span.whyrow__d', { text: Math.round(ds[i].weight * 100) + '% of the lap  ·  rating ' + ds[i].value.toFixed(1) }),
      App.h('span.whyrow__v.num', { text: App.fmt.signed(ds[i].delta, 3) + 's' })
    ]));
  }
  body.appendChild(dom);
};



/* ---------------------------------------------------------------------------
 * GOD PANEL — freeze the world and change things you have no business changing
 * -------------------------------------------------------------------------*/
WK.godPanel = function () {
  const st = App.state, wk = st.weekend, live = wk.live;
  const body = App.modal('God pause', { wide: true });
  body.appendChild(App.h('p.muted', { text: 'The world is frozen. Everything you change here feeds straight back into the simulation.' }));

  const tabs = App.h('div.godtabs');
  const panel = App.h('div.godpanel');
  const sections = [];
  if (App.can('setup')) sections.push(['Car', drawCar]);
  if (App.can('orders')) sections.push(['Drivers', drawDrivers]);
  if (App.can('energy')) sections.push(['Energy', drawEnergy]);
  if (App.can('world')) sections.push(['World', drawWorld]);
  if (!sections.length) sections.push(['Car', drawCar]);

  sections.forEach(function (s, i) {
    tabs.appendChild(App.h('button.godtab' + (i === 0 ? '.is-on' : ''), {
      text: s[0], onclick: function (e) {
        App.$$('.godtab', tabs).forEach(b => b.classList.remove('is-on'));
        e.currentTarget.classList.add('is-on');
        App.clear(panel); s[1](panel);
      }
    }));
  });
  body.appendChild(tabs);
  body.appendChild(panel);
  sections[0][1](panel);

  function myCars() {
    const ids = App.myDriverIds();
    return live.cars.filter(c => ids.indexOf(c.driverId) !== -1 || App.can('world'));
  }

  function drawCar(p) {
    const ids = App.myDriverIds();
    const targets = ids.length ? ids : [live.order[0]];
    targets.forEach(function (id) {
      const c = WK.carById(id);
      if (!c) return;
      p.appendChild(App.h('h3.modal__h', { text: c.name }));
      const teamId = c.teamId;
      const setup = App.setupFor(teamId, wk.circuitId);
      const grid = App.h('div.setupgrid');
      Data.SETUP_FIELDS.forEach(function (f) {
        const val = App.h('span.slider__v.num', { text: String(setup[f.key]) });
        grid.appendChild(App.h('label.slider', {}, [
          App.h('span.slider__k', { text: f.name }),
          App.h('input', {
            type: 'range', min: f.min, max: f.max, step: f.step, value: setup[f.key],
            'data-setup': f.key,
            oninput: function (e) {
              setup[f.key] = Number(e.target.value);
              val.textContent = e.target.value;
              c.derived = App.derivedFor(id, wk.circuitId);
              st.interventions += 1;
            }
          }),
          val
        ]));
      });
      p.appendChild(grid);
      p.appendChild(App.h('p.muted', { text: 'Parc fermé is not enforced during practice. After qualifying it is.' }));
    });
  }

  function drawDrivers(p) {
    myCars().forEach(function (c) {
      const row = App.h('div.godrow', { style: { '--tc': c.colour } }, [
        App.h('b', { text: c.last }),
        modeSelect('Push', Object.keys(Data.PUSH_MODES), c.pushMode, function (v) { c.pushMode = v; st.interventions++; WK.say(c.sur + ': instruction — ' + Data.PUSH_MODES[v].name + '.', 'team'); }),
        App.h('button.btn.btn--sm.btn--ghost', { text: 'Box now', onclick: function () { c.mode = 'IN'; c.lapTarget = WK.circuit().base * 1.32; WK.say(c.sur + ': box this lap.', 'team'); } }),
        App.h('button.btn.btn--sm.btn--ghost', { text: 'Send out', onclick: function () { if (c.mode === 'GARAGE') { c.wait = 0; WK.say(c.sur + ': go, go, go.', 'team'); } } })
      ]);
      p.appendChild(row);
    });
    if (App.can('world')) {
      p.appendChild(App.h('h3.modal__h', { text: 'Rewrite a driver' }));
      const sel = App.h('select.sel');
      live.cars.forEach(c => sel.appendChild(App.h('option', { value: c.driverId, text: c.name })));
      const stat = App.h('select.sel');
      ['qual', 'race', 'tyre', 'wet', 'over', 'def', 'cons', 'craft', 'mental'].forEach(k => stat.appendChild(App.h('option', { value: k, text: k })));
      const amt = App.h('input.num-in', { type: 'number', value: 3, min: -20, max: 20 });
      p.appendChild(App.h('div.godrow', {}, [sel, stat, amt, App.h('button.btn.btn--sm.btn--god', {
        text: 'Apply', onclick: function () {
          const d = st.drivers[sel.value];
          d.s[stat.value] = Engine.clamp(d.s[stat.value] + Number(amt.value), 30, 100);
          const c = WK.carById(sel.value);
          if (c) c.driver = App.driver(sel.value);
          st.interventions++;
          App.toast(Data.driverById(sel.value).last + ' ' + stat.value + ' → ' + d.s[stat.value].toFixed(0));
        }
      })]));
    }
  }

  function drawEnergy(p) {
    myCars().forEach(function (c) {
      p.appendChild(App.h('div.godrow', { style: { '--tc': c.colour } }, [
        App.h('b', { text: c.last }),
        modeSelect('Mode', Object.keys(Data.ENERGY_MODES), c.energyMode, function (v) {
          c.energyMode = v; c.energy.mode = v; st.interventions++;
          WK.say(c.sur + ': energy mode ' + Data.ENERGY_MODES[v].name + '.', 'team');
        }),
        App.h('span.num', { text: 'Charge ' + c.energy.charge.toFixed(0) + '%' }),
        App.h('span.num', { text: 'PU ' + c.energy.heat.toFixed(0) + '°C' })
      ]));
    });
    p.appendChild(App.h('p.muted', { text: Data.ENERGY_MODES.ATTACK.desc }));
  }

  function drawWorld(p) {
    p.appendChild(App.h('h3.modal__h', { text: 'Weather' }));
    const wet = Engine.wetLevel(wk.weather);
    const val = App.h('span.slider__v.num', { text: Math.round(wet * 100) + '%' });
    p.appendChild(App.h('label.slider', {}, [
      App.h('span.slider__k', { text: 'Rain across the track' }),
      App.h('input', { type: 'range', min: 0, max: 100, value: Math.round(wet * 100), oninput: function (e) {
        const v = Number(e.target.value) / 100;
        wk.weather.sectors = [v, v, v];
        if (v > 0.05 && !wk.weather.front) wk.weather.front = { at: 0.5, strength: v, speed: 0.004 };
        val.textContent = e.target.value + '%';
        st.interventions++;
      } }),
      val
    ]));
    p.appendChild(App.h('div.godrow', {}, [
      App.h('button.btn.btn--sm.btn--god', { text: 'Dry the track', onclick: function () { wk.weather.sectors = [0, 0, 0]; wk.weather.front = null; WK.say('The rain has stopped.', 'rc'); st.interventions++; } }),
      App.h('button.btn.btn--sm.btn--god', { text: 'Send a downpour', onclick: function () { wk.weather.sectors = [0.9, 0.9, 0.9]; wk.weather.front = { at: 0.2, strength: 1, speed: 0.006 }; WK.say('Heavy rain now falling across the circuit.', 'rc'); st.interventions++; } }),
      App.h('button.btn.btn--sm.btn--god', { text: 'Rubber in the track', onclick: function () { wk.trackGrip = Math.min(0.99, wk.trackGrip + 0.06); st.interventions++; } })
    ]));

    p.appendChild(App.h('h3.modal__h', { text: 'Sabotage a rival' }));
    const sel = App.h('select.sel');
    Data.TEAMS.forEach(t => { if (t.id !== App.myTeamId()) sel.appendChild(App.h('option', { value: t.id, text: t.name })); });
    p.appendChild(App.h('div.godrow', {}, [
      sel,
      App.h('button.btn.btn--sm.btn--god', { text: 'Reduce reliability', onclick: function () {
        const ts = st.teams[sel.value];
        ts.components.chassis = Engine.clamp(ts.components.chassis - 4, 30, 102);
        ts.components.cooling = Engine.clamp(ts.components.cooling - 4, 30, 102);
        WK.refreshDerived();
        st.interventions++;
        App.toast(Data.teamById(sel.value).name + ' will be more fragile from here.');
      } }),
      App.h('button.btn.btn--sm.btn--god', { text: 'Give them 2 points of aero', onclick: function () {
        const ts = st.teams[sel.value];
        ts.components.floor = Engine.clamp(ts.components.floor + 2, 30, 102);
        WK.refreshDerived();
        st.interventions++;
        App.toast(Data.teamById(sel.value).name + ' just found some downforce.');
      } })
    ]));
    p.appendChild(App.h('p.muted', { text: 'Every intervention propagates. More power means more heat, more fuel, more wear and a shorter component life.' }));
  }

  function modeSelect(label, keys, current, onchange) {
    const sel = App.h('select.sel', { onchange: function (e) { onchange(e.target.value); } });
    keys.forEach(k => sel.appendChild(App.h('option', { value: k, text: k, selected: k === current })));
    return App.h('label.godsel', {}, [App.h('em', { text: label }), sel]);
  }
};

WK.refreshDerived = function () {
  const wk = App.state.weekend;
  if (!wk || !wk.live) return;
  for (let i = 0; i < wk.live.cars.length; i++) {
    const c = wk.live.cars[i];
    c.derived = App.derivedFor(c.driverId, wk.circuitId);
  }
};

/* ---------------------------------------------------------------------------
 * STRATEGY MODAL
 * -------------------------------------------------------------------------*/
/* Bulk actions: give both of your cars the same instruction in one move.
   A two-car team otherwise means doing everything twice. */
WK.bulkRunPlan = function (ids) {
  const wk = WK.ensure();
  wk.runPlans = wk.runPlans || {};
  const sess = WK.currentSession();
  const key = (sess ? sess.key : 'FP1');
  const source = wk.runPlans[key + ':' + ids[0]];
  if (!source) { App.toast('Set a run plan on the first car, then copy it across.'); WK.runPlanModal(ids[0]); return; }
  ids.forEach(function (id) { wk.runPlans[key + ':' + id] = JSON.parse(JSON.stringify(source)); });
  App.save();
  App.toast('Both cars will run ' + Data.driverById(ids[0]).last + '\'s programme.');
};

WK.bulkStrategy = function (ids) {
  const wk = WK.ensure();
  wk.strategy = wk.strategy || {};
  const chosen = wk.strategy[ids[0]];
  if (!chosen) { App.toast('Pick a strategy for the first car, then copy it across.'); WK.strategyModal(ids[0]); return; }
  ids.forEach(function (id) { wk.strategy[id] = chosen; });
  App.save();
  App.toast('Both cars will start on the ' + chosen + ' strategy.');
};

/* Practice run plans. The engineers write one by default; this is where you
   overrule them. Stored on the weekend so it survives until the session runs. */
WK.runPlanModal = function (driverId) {
  const wk = WK.ensure();
  wk.runPlans = wk.runPlans || {};
  const sess = WK.currentSession();
  const drv = App.driver(driverId);
  const key = (sess ? sess.key : 'FP1') + ':' + driverId;
  if (!wk.runPlans[key]) {
    wk.runPlans[key] = [
      { programme: 'setup', compound: 'M', laps: 7 },
      { programme: 'quali', compound: 'S', laps: 4 },
      { programme: 'race', compound: 'M', laps: 14 }
    ];
  }
  const plan = wk.runPlans[key];

  function draw() {
    const body = App.modal('Run plan — ' + drv.name + (sess ? '  ·  ' + sess.name : ''), { wide: true });
    body.appendChild(App.h('p.muted', { text: 'A session is only as useful as the programme you send the car out on. Practice position is not car strength: a long run on hards will always look slower than a low-fuel soft lap.' }));

    const list = App.h('div.runplan');
    plan.forEach(function (run, i) {
      const prog = Data.runProgrammeByKey(run.programme);
      const progSel = App.h('select.sel', { 'data-run-programme': i, onchange: function (e) {
        run.programme = e.target.value;
        const np = Data.runProgrammeByKey(run.programme);
        run.laps = np.laps;
        App.closeModal(); draw();
      } });
      Data.RUN_PROGRAMMES.forEach(rp => progSel.appendChild(App.h('option', { value: rp.key, text: rp.name, selected: rp.key === run.programme })));

      const tyreSel = App.h('select.sel', { 'data-run-compound': i, onchange: function (e) { run.compound = e.target.value; } });
      Data.DRY_COMPOUNDS.forEach(c => tyreSel.appendChild(App.h('option', { value: c, text: Data.COMPOUNDS[c].name, selected: c === run.compound })));

      const lapsIn = App.h('input.num-in', { type: 'number', min: 1, max: 30, value: run.laps, 'data-run-laps': i,
        onchange: function (e) { run.laps = Engine.clamp(Number(e.target.value), 1, 30); } });

      list.appendChild(App.h('div.runrow', {}, [
        App.h('span.runrow__n', { text: 'Run ' + (i + 1) }),
        progSel, tyreSel, lapsIn,
        App.h('button.iconbtn', { text: '✕', title: 'Remove this run', onclick: function () {
          plan.splice(i, 1); App.closeModal(); draw();
        } }),
        App.h('p.runrow__d', { text: prog.desc })
      ]));
    });
    body.appendChild(list);

    const totalLaps = plan.reduce((a, r) => a + r.laps, 0);
    const est = totalLaps * WK.circuit().base * 1.25 / 60;
    body.appendChild(App.h('p.muted', { text: totalLaps + ' laps planned, roughly ' + est.toFixed(0) +
      ' minutes of the session including in and out laps. A 60-minute session will not fit much more than 30 laps.' }));

    body.appendChild(App.h('div.godrow', {}, [
      App.h('button.btn.btn--sm', { id: 'btn-add-run', text: 'Add a run', disabled: plan.length >= 5, onclick: function () {
        plan.push({ programme: 'longrun', compound: 'H', laps: 12 }); App.closeModal(); draw();
      } }),
      App.h('button.btn.btn--sm.btn--ghost', { text: 'Let the engineers decide', onclick: function () {
        delete wk.runPlans[key]; App.closeModal(); App.toast('Back to the engineers\' programme.');
      } }),
      App.myDriverIds().length > 1 ? App.h('button.btn.btn--sm.btn--ghost', { id: 'btn-copy-run', text: 'Copy to both cars', onclick: function () {
        App.myDriverIds().forEach(function (oid) {
          wk.runPlans[(sess ? sess.key : 'FP1') + ':' + oid] = JSON.parse(JSON.stringify(plan));
        });
        App.toast('Both cars will run this programme.');
      } }) : null
    ]));
    App.save();
  }
  draw();
};

/* Power unit element usage for one driver. */
WK.elementsModal = function (driverId) {
  const st = App.state;
  const ds = st.drivers[driverId];
  const allowance = Engine.regAllowance(st.regulations, Data, 'puElements') || 4;
  const body = App.modal('Power unit allocation — ' + Data.driverById(driverId).name, {});
  body.appendChild(App.h('p.muted', { text: 'Each driver may use ' + allowance + ' of each element per season. The ' +
    (allowance + 1) + 'th brings a ten-place grid penalty, and every one after that a further five.' }));
  const list = App.h('div.whylist');
  Data.PU_ELEMENTS.forEach(function (el) {
    const slot = ds.elements[el.key];
    const over = slot.used - allowance;
    list.appendChild(App.h('div.whyrow' + (over > 0 ? '.is-loss' : ''), {}, [
      App.h('span.whyrow__k', { text: el.name }),
      App.h('span.whyrow__d', { text: 'element ' + slot.used + ' of ' + allowance + '  ·  ' + slot.wear.toFixed(0) + '% used' }),
      App.h('span.whyrow__v.num', { text: over > 0 ? '+' + over + ' over' : 'in allocation' })
    ]));
  });
  body.appendChild(list);
  const pen = Engine.gridPenalty(ds.elements, Data, allowance);
  body.appendChild(App.h('p' + (pen.places ? '.lede' : '.muted'), {
    text: pen.backOfGrid ? 'This driver would start from the back of the grid.'
        : (pen.places ? 'This driver carries a ' + pen.places + '-place grid penalty into the next race.'
                      : 'No penalty outstanding.')
  }));
};

WK.strategyModal = function (driverId) {
  const wk = WK.ensure(), circuit = WK.circuit();
  const drv = App.driver(driverId);
  const derived = App.derivedFor(driverId, circuit.id);
  const strategies = Engine.buildStrategies({ circuit, derived, driver: drv, Data, laps: circuit.laps });
  const body = App.modal('Strategy — ' + drv.name, { wide: true });
  body.appendChild(App.h('p.muted', { text: 'Modelled over ' + circuit.laps + ' laps with a ' + circuit.pitLoss.toFixed(1) + 's pit loss. The engineers rank by expected total time; you are free to ignore them.' }));

  const chosen = wk.strategy && wk.strategy[driverId];
  const list = App.h('div.strats');
  strategies.forEach(function (s) {
    const on = chosen === s.key;
    list.appendChild(App.h('button.strat' + (on ? '.is-on' : ''), {
      'data-strategy': s.key,
      onclick: function () {
        wk.strategy = wk.strategy || {};
        wk.strategy[driverId] = s.key;
        App.toast(Data.driverById(driverId).last + ' will start on ' + Data.COMPOUNDS[s.sequence[0]].name + ': ' + s.key + '.');
        WK.strategyModal(driverId);
      }
    }, [
      App.h('span.strat__seq', {}, s.sequence.map(function (cp) {
        return App.h('i.tyredot', { style: { '--tc': Data.COMPOUNDS[cp].colour }, text: cp });
      })),
      App.h('span.strat__stops', { text: s.stops + ' stop' + (s.stops === 1 ? '' : 's') }),
      App.h('span.strat__loss.num', { text: s.lossToBest === 0 ? 'Fastest' : '+' + s.lossToBest.toFixed(1) + 's' }),
      App.h('span.strat__conf', { text: s.confidence + '% confidence' }),
      App.h('span.strat__stints', { text: s.stints.map(x => x.compound + ' ' + x.laps + 'L (max ' + x.maxLaps + ')').join('  ·  ') })
    ]));
  });
  body.appendChild(list);
  body.appendChild(App.h('p.muted', { text: 'Stint maxima come from this car\'s tyre kindness and this driver\'s management, not a generic table. Running past the maximum falls off the cliff.' }));
};

WK.showSessionResult = function (sess) {
  const body = App.modal(sess.name + ' — classification', { wide: true });
  if (!sess.result) { body.appendChild(App.h('p.muted', { text: 'No classification stored.' })); return; }
  const list = App.h('div.classify');
  const lead = sess.result.times[sess.result.order[0]];
  sess.result.order.forEach(function (id, i) {
    const d = Data.driverById(id), t = Data.teamById(App.state.drivers[id].teamId);
    const time = sess.result.times[id];
    list.appendChild(App.h('div.crow', { style: { '--tc': t.colour } }, [
      App.h('span.crow__p', { text: String(i + 1) }),
      App.h('span.crow__n', {}, [App.h('i.crow__bar'), App.h('b', { text: d.last }), App.h('em', { text: t.shortName })]),
      App.h('span.crow__t.num', { text: time ? Engine.fmtLap(time) : '—' }),
      App.h('span.crow__g.num', { text: (time && i > 0) ? App.fmt.gap(time - lead) : '' })
    ]));
  });
  body.appendChild(list);
};

/* Run every remaining session of the weekend without watching, then report what
   happened. This is not a prediction — it plays the real simulation, it just
   does not render it. The confirmation exists because the result is permanent. */
WK.skipWeekend = function () {
  const wk = WK.ensure();
  if (!wk) return;
  const remaining = wk.sessions.filter(s => !s.done);
  if (!remaining.length) { App.route('weekend'); return; }

  const body = App.modal('Run the rest of the weekend without watching?');
  body.appendChild(App.h('p.lede', { text: 'The simulation plays out for real. You will get the result, not a forecast, and you cannot take it back.' }));
  body.appendChild(App.h('p.muted', { text: 'Still to run: ' + remaining.map(s => s.name).join(', ') + '.' }));
  body.appendChild(App.h('div.godrow', {}, [
    App.h('button.btn.btn--primary', { id: 'btn-confirm-skip', text: 'Run it', onclick: function () {
      App.closeModal();
      WK.runRemainingSessions();
      WK.weekendSummary();
    } }),
    App.h('button.btn.btn--ghost', { text: 'Cancel, I want to watch', onclick: function () {
      App.closeModal(); App.route('weekend');
    } })
  ]));
};

WK.runRemainingSessions = function () {
  const wk = WK.ensure();
  if (!wk) return;
  let guard = 12;
  while (wk.index < wk.sessions.length && guard-- > 0) {
    const sess = wk.sessions[wk.index];
    if (sess.type === 'race') App.race.simulate(sess);
    else { WK.buildLive(sess); WK.runToEnd(); }
  }
  App.save();
};

/* What happened while you were not looking. */
WK.weekendSummary = function () {
  const wk = App.state.weekend;
  const body = App.modal(wk.name + ' — how it went', { wide: true });
  const mine = App.myDriverIds();

  wk.sessions.forEach(function (s) {
    if (!s.result) return;
    body.appendChild(App.h('h3.modal__h', { text: s.name }));
    const top = s.result.order.slice(0, 3).map(function (id, i) {
      return (i + 1) + '. ' + Data.driverById(id).last;
    }).join('   ');
    body.appendChild(App.h('p', { text: top }));
    if (mine.length) {
      const rows = mine.map(function (id) {
        const p = s.result.order.indexOf(id);
        const cls = s.result.classification && s.result.classification.filter(c => c.id === id)[0];
        return Data.driverById(id).last + ': P' + (p + 1) +
          (cls && cls.dnf ? ' (retired — ' + cls.dnf + ')' : '') +
          (cls && cls.points ? '  ·  ' + cls.points + ' pts' : '');
      });
      body.appendChild(App.h('p.muted', { text: rows.join('     ') }));
    }
  });

  body.appendChild(App.h('div.godrow', {}, [
    App.h('button.btn.btn--primary', { text: 'Back to the circuit', onclick: function () {
      App.closeModal(); App.route('weekend');
    } })
  ]));
};
</script>
<!-- ==== app_race.js ==== -->
<script>
/* ============================================================================
 * app_race.js — the core gameplay loop, part 2: the Grand Prix
 *
 * The race runs lap by lap rather than second by second. Every lap each car
 * gets a full Engine.lapTime() call with its own tyre, fuel, energy and dirty
 * air state, then positions are resolved by cumulative time with an explicit
 * overtaking pass. Splitting this out of app_weekend.js keeps both files
 * inside the 2000-line ceiling.
 * ==========================================================================*/

App.race = {};
const RC = App.race;

/* ---------------------------------------------------------------------------
 * BUILD
 * -------------------------------------------------------------------------*/
RC.build = function (sess) {
  const st = App.state, wk = st.weekend, circuit = App.weekend.circuit();
  const rng = Engine.rng(st.rngSeed + wk.round * 4409 + (sess.sprint ? 77 : 11));
  const isSprint = !!sess.sprint;
  const laps = isSprint ? Math.max(8, Math.round(circuit.laps / 3)) : circuit.laps;

  let grid = isSprint ? wk.sprintGrid : wk.grid;
  if (!grid || !grid.length) grid = Data.DRIVERS.map(d => d.id);

  const wet = Engine.wetLevel(wk.weather);
  const cars = [];
  for (let i = 0; i < grid.length; i++) {
    const id = grid[i];
    const drv = App.driver(id);
    const team = Data.teamById(drv.teamId);
    const derived = App.derivedFor(id, circuit.id);
    const plan = RC.planFor(id, circuit, derived, drv, laps, rng, isSprint);
    const startCompound = Engine.bestCompoundFor(wet) || plan.sequence[0];
    const c = {
      driverId: id, code: Data.driverById(id).code, num: Data.driverById(id).num,
      sur: Data.driverById(id).last, name: drv.name,
      teamId: drv.teamId, colour: team.colour,
      driver: drv, derived: derived,
      grid: i + 1, position: i + 1,
      tyre: Engine.newTyre(startCompound, 0),
      energy: Engine.newEnergy(derived),
      health: Object.assign({}, wk.cars[id].health),
      fuelKg: isSprint ? Engine.raceFuel(circuit, laps) : Engine.raceFuel(circuit, laps),
      totalTime: (i) * 0.16,      /* grid slot offset, resolved at the start */
      lapsDone: 0, last: null, best: null,
      stops: 0, plan: plan, nextStop: plan.stopLaps[0] || 999, stintIndex: 0,
      pushMode: 'NORMAL', energyMode: 'BALANCED',
      dnf: null, penalty: 0, lapHistory: [], gap: 0, interval: 0,
      inPit: false, pitLap: -9, dirtyAir: 0, maxWear: 0,
      /* Positional model: the window of race time this car's current lap
         occupies. Motion is interpolated inside it, so the marker travels
         instead of teleporting once a lap. */
      lapStart: 0, lapDur: circuit.base, retiredAt: null
    };
    cars.push(c);
  }

  wk.live = {
    type: 'race', sprint: isSprint, key: sess.key, name: sess.name,
    lap: 0, totalLaps: laps, cars: cars,
    running: false, speed: 15, finished: false,
    sc: null, scLapsLeft: 0, red: null, redLapsLeft: 0, unlapping: false,
    messages: [], rngSeed: rng.s,
    order: cars.map(c => c.driverId), bestLap: null, bestLapBy: null,
    started: false, selected: null
  };
  st.rngSeed = rng.s;
  App.weekend.say((isSprint ? 'Sprint' : 'Grand Prix') + ' — ' + laps + ' laps. Formation lap complete.', 'rc');
  return wk.live;
};

RC.planFor = function (id, circuit, derived, drv, laps, rng, isSprint) {
  const wk = App.state.weekend;
  const strategies = Engine.buildStrategies({ circuit, derived, driver: drv, Data, laps });
  let chosen = strategies[0];
  const picked = wk.strategy && wk.strategy[id];
  if (picked) { const f = strategies.filter(s => s.key === picked)[0]; if (f) chosen = f; }
  else if (!isSprint && App.autoFor(id)) {
    /* AI teams pick from the top options, weighted by their strategy rating.
       Your own cars only get this if the auto engineer is on. */
    const rating = Data.teamById(App.state.drivers[id].teamId).ratings.strategy;
    const spread = Math.max(1, Math.round((100 - rating) / 12));
    chosen = strategies[Math.min(strategies.length - 1, rng.int(0, spread))];
  }
  if (isSprint) chosen = { key: 'M', sequence: ['M'], stints: [{ compound: 'M', laps }], stops: 0 };

  const stopLaps = [];
  let acc = 0;
  for (let i = 0; i < chosen.stints.length - 1; i++) { acc += chosen.stints[i].laps; stopLaps.push(acc); }
  /* No auto engineer and no strategy from the player means no stops are
     planned at all. The car will run until the driver refuses to continue on
     the tyre, which is slow — calling the stops is the player's job now. */
  if (!App.autoFor(id) && !picked) return { key: 'unplanned', sequence: chosen.sequence.slice(), stints: chosen.stints, stopLaps: [] };
  return { key: chosen.key, sequence: chosen.sequence.slice(), stints: chosen.stints, stopLaps };
};

RC.start = function (sess) {
  RC.build(sess);
  App.route('race');
};

/* ---------------------------------------------------------------------------
 * LAP SIMULATION
 * -------------------------------------------------------------------------*/
RC.tick = function () {
  const st = App.state, wk = st.weekend, live = wk.live, circuit = App.weekend.circuit();
  if (!live || live.finished) return;
  const rng = Engine.rng(live.rngSeed);
  live.lap += 1;

  Engine.weatherStep(wk.weather, 1 / live.totalLaps, rng);
  const wet = Engine.wetLevel(wk.weather);
  wk.trackGrip = Engine.clamp(wk.trackGrip + (wet > 0.2 ? -0.02 : 0.004), 0.6, 0.99);

  /* Red flag: the race is stopped, the cars go to the grid, and everyone gets
     a free tyre change. It is the single biggest strategic reset in the sport
     and it was missing entirely. */
  if (live.red) {
    live.redLapsLeft -= 1;
    if (live.redLapsLeft > 0) { live.lap -= 1; live.rngSeed = rng.s; return; }
    RC.restartFromRed(rng);
  }

  /* Safety car countdown, with the lapped cars allowed to un-lap themselves
     before the restart — which costs an extra lap behind the car. */
  if (live.sc) {
    live.scLapsLeft -= 1;
    if (live.sc === 'SC' && live.scLapsLeft === 1 && !live.unlapping) {
      const lapped = live.cars.filter(c => !c.dnf && c.lapsDone < live.cars[live.order.indexOf(live.order[0])].lapsDone);
      if (lapped.length) {
        live.unlapping = true;
        live.scLapsLeft += 1;
        App.weekend.say('Lapped cars may now overtake. ' + lapped.length + ' car' +
          (lapped.length === 1 ? '' : 's') + ' to un-lap.', 'rc');
      }
    }
    if (live.scLapsLeft <= 0) {
      App.weekend.say((live.sc === 'VSC' ? 'Virtual safety car' : 'Safety car') + ' ending this lap. Racing resumes.', 'rc');
      live.sc = null;
      live.unlapping = false;
    }
  }

  RC.reorder(live);
  const running = live.cars.filter(c => !c.dnf);
  /* Race context, rebuilt every lap. This is what makes energy deployment,
     tyre wear and fuel saving respond to where a car actually is rather than
     being a fixed setting: a car attacking spends charge, a car in a train
     cooks its tyres, a car with a gap does neither. */
  for (let i = 0; i < live.order.length; i++) {
    const c = RC.carById(live.order[i]);
    if (!c || c.dnf) continue;
    const ahead = i > 0 ? RC.carById(live.order[i - 1]) : null;
    const behind = i < live.order.length - 1 ? RC.carById(live.order[i + 1]) : null;
    const gapAhead = ahead && ahead.lapsDone === c.lapsDone ? c.totalTime - ahead.totalTime : 99;
    const gapBehind = behind && behind.lapsDone === c.lapsDone ? behind.totalTime - c.totalTime : 99;
    c.dirtyAir = gapAhead < 1.8 ? (1.8 - gapAhead) / 1.8 * 1.6 : 0;
    c.ctx = {
      attacking: gapAhead < 1.5,
      defending: gapBehind < 1.2,
      clearAir: gapAhead > 2.5 && gapBehind > 2.5,
      dirtyAir: c.dirtyAir,
      sc: !!live.sc,
      lapsLeft: live.totalLaps - c.lapsDone,
      position: i + 1
    };
    /* Backmarkers and blue flags. A lapped car must let the leaders through,
       which costs the leader a little and the lapped car rather more. */
    let traffic = 0;
    c.blueFlag = false;
    for (let j = 0; j < live.order.length; j++) {
      if (j === i) continue;
      const o = RC.carById(live.order[j]);
      if (!o || o.dnf) continue;
      const d = Math.abs((c.totalTime % circuit.base) - (o.totalTime % circuit.base));
      if (d > 2.2) continue;
      if (o.lapsDone < c.lapsDone) traffic += 1;
      else if (o.lapsDone > c.lapsDone) c.blueFlag = true;
    }
    /* Blue flags mean the car ahead moves over, so the leader loses far less
       than it would passing a car on the lead lap. */
    c.traffic = Math.min(3, traffic) * 0.45;
  }

  for (let i = 0; i < running.length; i++) RC.lapForCar(running[i], rng, wet, circuit, live);

  /* Position resolution and overtaking */
  RC.resolveOvertakes(rng, wet, circuit, live);
  RC.reorder(live);
  for (let i = 0; i < live.order.length; i++) {
    const c = RC.carById(live.order[i]);
    c.position = i + 1;
    if (i === 0) { c.gap = 0; c.interval = 0; }
    else {
      const lead = RC.carById(live.order[0]);
      const ahead = RC.carById(live.order[i - 1]);
      c.gap = c.lapsDone < lead.lapsDone ? -(lead.lapsDone - c.lapsDone) : c.totalTime - lead.totalTime;
      c.interval = c.lapsDone < ahead.lapsDone ? -(ahead.lapsDone - c.lapsDone) : c.totalTime - ahead.totalTime;
    }
  }

  /* Random incidents that trigger neutralisations. */
  if (!live.sc && live.lap > 1 && live.lap < live.totalLaps - 1) {
    const p = circuit.scChance / live.totalLaps * (1 + wet * 1.6);
    if (rng.chance(p)) RC.deploySC(rng.chance(0.42) ? 'VSC' : 'SC', 'Debris on the racing line', rng);
  }

  if (live.lap >= live.totalLaps) RC.finish(rng);
  live.rngSeed = rng.s;
};

RC.lapForCar = function (c, rng, wet, circuit, live) {
  const wk = App.state.weekend;

  /* Reliability */
  const fail = Engine.reliabilityCheck(c, rng, { stressMult: live.sc ? 0.4 : 1 });
  if (fail) {
    if (fail.terminal) {
      c.dnf = fail.part;
      c.retiredAt = c.lapsDone;
      App.weekend.say(c.sur + ' is out — ' + fail.part + ' failure.', 'bad');
      App.state.drivers[c.driverId].dnfs += 1;
      if (rng.chance(0.06)) RC.redFlag(c.sur + ' is stopped in a dangerous position', rng);
      else RC.deploySC(rng.chance(0.35) ? 'VSC' : 'SC', c.sur + ' stopped on track', rng);
      return;
    }
    c.health[fail.part === 'MGU-K' ? 'mguk' : 'ice'] = Engine.clamp((c.health.mguk || 100) - 18, 0, 100);
    App.weekend.say(c.sur + ' reports a problem with the ' + fail.part + '.', 'warn');
  }

  /* Pit stop */
  let pitTime = 0;
  const wantWet = Engine.bestCompoundFor(wet);
  const onWrongTyre = wantWet && Data.COMPOUNDS[c.tyre.compound].wet === 0 && c.tyre.laps > 1;
  const onDryInDry = !wantWet && Data.COMPOUNDS[c.tyre.compound].wet > 0 && c.tyre.laps > 2;
  /* With the auto engineer off, nobody calls your car in on schedule. The only
     automatic stops left are the ones a driver would make anyway: the wrong
     tyre for the conditions, or a tyre that has physically given up. */
  const scheduled = App.autoFor(c.driverId) && c.lapsDone >= c.nextStop && c.nextStop < live.totalLaps;
  /* A driver will come in on their own when the tyre is finished, but with
     nobody calling them they leave it far later than a strategist would. */
  const cliff = c.tyre.wear > (App.autoFor(c.driverId) ? 93 : 98);
  if ((scheduled || onWrongTyre || onDryInDry || cliff) && c.lapsDone < live.totalLaps - 1) {
    pitTime = RC.pitStop(c, rng, wet, circuit, live);
  }

  /* Energy, driven by where this car actually is in the race. */
  const ctx = c.ctx || {};
  const eEffect = Engine.energyLap(c.energy, c.derived, Data, {
    circuit, airTemp: wk.weather.airTemp, ctx
  });

  /* Fuel: is this car going to reach the flag, and what is it giving up to? */
  const fuelSave = Engine.fuelSaving({
    circuit, derived: c.derived, fuelKg: c.fuelKg,
    lapsLeft: Math.max(0, live.totalLaps - c.lapsDone)
  });
  if (fuelSave > 0.45 && !c.fuelWarned && App.myDriverIds().indexOf(c.driverId) !== -1) {
    c.fuelWarned = true;
    App.weekend.say(c.sur + ': "I am having to lift and coast, we are short on fuel."', 'warn');
  }

  /* Lap */
  const pressure = live.lap > live.totalLaps - 8 && c.position <= 5 ? 0.6 : 0;
  const res = Engine.lapTime({
    Data, rng, derived: c.derived, driver: c.driver, circuit,
    tyre: c.tyre, fuelKg: c.fuelKg, trackGrip: wk.trackGrip, wet,
    energyEffect: eEffect, charge: c.energy.charge, push: c.pushMode,
    form: c.driver.form, pressure, mode: 'race', sectorShares: wk.shares,
    dirtyAir: c.dirtyAir, fuelSave, traffic: c.traffic || 0,
    wetSectors: wk.weather.sectors.slice(),
    blueFlag: c.blueFlag ? 1 : 0
  });

  let t = res.time + pitTime;
  /* Neutralisations. Everyone circulates at a fixed reduced pace. */
  if (live.sc === 'SC') t = circuit.base * 1.42;
  else if (live.sc === 'VSC') t = circuit.base * 1.34;

  Engine.tyreLap(c.tyre, Data, {
    circuit, derived: c.derived, driver: c.driver,
    push: live.sc ? 'CONSERVE' : c.pushMode, wet, trackTemp: wk.weather.trackTemp,
    dirtyAir: c.dirtyAir, fuelKg: c.fuelKg, sc: !!live.sc
  });
  if (c.tyre.wear > c.maxWear) c.maxWear = c.tyre.wear;

  /* The car comes apart slowly across a race distance, and a rough circuit or a
     driver leaning on the kerbs makes it quicker. */
  const before = c.health.floor;
  const event = Engine.wearHealth(c.health, {
    circuit, derived: c.derived, rng, push: c.pushMode, wet, dirtyAir: c.dirtyAir
  });
  if (event === 'debris' && App.myDriverIds().indexOf(c.driverId) !== -1) {
    App.weekend.say(c.sur + ': "I picked something up, the car feels different."', 'radio');
  }
  if (Math.floor(before / 5) !== Math.floor(c.health.floor / 5)) RC.applyDamage(c);

  /* Fuel is a real quantity with a real bottom. Pushing burns more of it, a
     saving driver burns less, and a car that miscalculates does not finish. */
  const burn = Engine.fuelPerLap(circuit, c.derived, Data.PUSH_MODES[c.pushMode]) *
               (live.sc ? 0.55 : 1) * (1 - fuelSave * 0.14);
  c.fuelKg = Math.max(0, c.fuelKg - burn);
  c.fuelSave = fuelSave;
  if (c.fuelKg <= 0 && !c.dnf) {
    c.dnf = 'Out of fuel';
    c.retiredAt = c.lapsDone;
    App.state.drivers[c.driverId].dnfs += 1;
    App.weekend.say(c.sur + ' has run out of fuel.', 'bad');
  }
  c.lapStart = c.totalTime;
  c.lapDur = Math.max(1, t);
  c.totalTime += t;
  c.lapsDone += 1;
  c.last = t;
  c.inPit = pitTime > 0;
  if (!live.sc && !pitTime && (c.best == null || res.time < c.best)) c.best = res.time;
  if (!live.sc && !pitTime && (live.bestLap == null || res.time < live.bestLap)) {
    live.bestLap = res.time; live.bestLapBy = c.driverId;
  }
  c.lapHistory.push({ lap: c.lapsDone, time: t, tyre: c.tyre.compound, pos: c.position, why: res.why, domainSplit: res.domainSplit });
  if (c.lapHistory.length > 90) c.lapHistory.shift();

  /* Engineer prompts for the player's cars. */
  if (App.myDriverIds().indexOf(c.driverId) !== -1) {
    if (c.tyre.wear > 78 && c.tyre.wear < 82) App.weekend.say(c.sur + ': "These tyres are done, I need to come in."', 'radio');
    if (!App.autoFor(c.driverId) && c.tyre.wear > 86 && c.tyre.wear < 90) {
      App.weekend.say(c.sur + ': "Nobody is calling me in. I am falling off a cliff out here."', 'warn');
    }
    if (c.energy.heat > 108) App.weekend.say(c.sur + ': temperatures critical, lift and coast.', 'warn');
  }
};

RC.pitStop = function (c, rng, wet, circuit, live) {
  const team = Data.teamById(c.teamId);
  const crew = team.ratings.pitCrew;
  let stationary = 2.3 - (crew - 80) * 0.018 + Math.abs(rng.gauss(0, 0.22));

  /* Double stacking: a team can only service one car at a time. The second car
     of the same team stopping on the same lap queues behind its teammate. */
  /* `pitLap` is stamped for the lap being completed, which is lapsDone + 1 at
     the point the stop is taken. Comparing against lapsDone silently never
     matched and double-stacking never happened. */
  const thisLap = c.lapsDone + 1;
  c.pitLap = thisLap;
  const stacked = live.cars.filter(function (o) {
    return o !== c && o.teamId === c.teamId && !o.dnf && o.pitLap === thisLap;
  }).length;
  if (stacked) {
    stationary += 2.4 + rng.range(0, 1.4);
    App.weekend.say(c.sur + ' is double-stacked behind the sister car.', 'team');
  }

  if (rng.chance(0.030 + (100 - crew) * 0.0022)) {
    const unsafe = rng.chance(0.35);
    stationary += rng.range(1.4, 8.0);
    if (unsafe) {
      /* An unsafe release is a sanction, not just a slow stop. */
      c.totalTime += 5; c.penalty += 5;
      App.weekend.say('Unsafe release for ' + c.sur + '. Five second time penalty.', 'rc');
    } else {
      App.weekend.say('Slow stop for ' + c.sur + ' — problem with the ' +
        rng.pick(['front left', 'front right', 'rear left', 'rear right']) + ' wheel gun.', 'warn');
    }
  }
  const loss = (circuit.pitLoss + stationary - 2.3) * (live.sc ? 0.55 : 1);

  /* Choose the next compound. */
  let next;
  const wantWet = Engine.bestCompoundFor(wet);
  if (wantWet) next = wantWet;
  else {
    c.stintIndex += 1;
    next = c.plan.sequence[c.stintIndex] || 'M';
    if (Data.COMPOUNDS[next].wet > 0) next = 'M';
    const lapsLeft = live.totalLaps - c.lapsDone;
    const maxS = Engine.stintLength('S', circuit, c.derived, c.driver, Data);
    if (lapsLeft <= maxS * 0.9 && lapsLeft > 3) next = 'S';
  }
  next = App.weekend.takeSet(c.driverId, next);
  c.tyre = Engine.newTyre(next, 0);
  c.tyre.temp = 62;
  c.stops += 1;
  c.nextStop = c.plan.stopLaps[c.stops] || 999;
  c.inPit = true;
  App.weekend.say(c.sur + ' boxes — ' + Data.COMPOUNDS[next].name + ', ' + stationary.toFixed(1) + 's stationary.', 'team');
  return loss;
};

RC.resolveOvertakes = function (rng, wet, circuit, live) {
  const order = live.order.slice();
  for (let i = 1; i < order.length; i++) {
    const att = RC.carById(order[i]);
    const def = RC.carById(order[i - 1]);
    if (!att || !def || att.dnf || def.dnf) continue;
    if (att.lapsDone !== def.lapsDone) continue;
    if (att.totalTime >= def.totalTime) continue;   /* not actually ahead on time */
    if (live.sc) { att.totalTime = def.totalTime + 0.6; continue; }

    const tyreDelta = (Data.COMPOUNDS[att.tyre.compound].grip - Data.COMPOUNDS[def.tyre.compound].grip) +
                      (def.tyre.wear - att.tyre.wear) * 0.0022;
    let override = false;
    if (Engine.overrideReady(att.energy, att.ctx) && rng.chance(0.55)) {
      const mo = Engine.manualOverride(att.energy, att.derived);
      override = !!mo;
      if (mo && App.myDriverIds().indexOf(att.driverId) !== -1) App.weekend.say(att.sur + ' uses Manual Override on the straight.', 'team');
    }
    const r = Engine.attemptOvertake(att, def, circuit, rng, {
      attLap: att.last, defLap: def.last, override, drs: false, wet, tyreDelta
    });
    if (r.success) {
      att.totalTime += r.attCost; def.totalTime += r.defCost;
      if (att.totalTime >= def.totalTime) att.totalTime = def.totalTime - 0.08;
      App.weekend.say(att.sur + ' passes ' + def.sur + ' for P' + (i) + '.', 'pass');
      if (r.contact) {
        const victim = rng.chance(0.5) ? att : def;
        victim.health.frontWing = Engine.clamp(victim.health.frontWing - rng.range(8, 40), 0, 100);
        victim.totalTime += rng.range(0.6, 3.4);
        App.weekend.say('Contact between ' + att.sur + ' and ' + def.sur + '. ' + victim.sur + ' has damage.', 'warn');
        RC.applyDamage(victim);
        if (rng.chance(0.18)) {
          victim.dnf = 'Accident damage';
          App.state.drivers[victim.driverId].dnfs += 1;
          App.weekend.say(victim.sur + ' is out of the race.', 'bad');
          if (rng.chance(0.22)) RC.redFlag('Heavy accident and debris across the circuit', rng);
          else RC.deploySC('SC', 'Accident at turn ' + (rng.int(1, circuit.corners)), rng);
        }
      }
    } else {
      att.totalTime = def.totalTime + Math.max(0.12, r.attCost);
      def.totalTime += r.defCost;
    }
  }
  /* Reset Manual Override availability each lap. */
  for (let i = 0; i < live.cars.length; i++) if (live.cars[i].energy.charge > 50) live.cars[i].energy.overrideAvail = true;
};

/* Damage feeds back into the car's derived performance rather than a flat
   speed penalty, so the consequences show up where they physically would. */
RC.applyDamage = function (c) {
  const wk = App.state.weekend;
  const teamId = c.teamId;
  const comps = Object.assign({}, App.state.teams[teamId].components);
  comps.frontWing *= (c.health.frontWing / 100) * 0.35 + 0.65;
  comps.floor *= (c.health.floor / 100) * 0.30 + 0.70;
  comps.rearWing *= (c.health.rearWing / 100) * 0.30 + 0.70;
  c.derived = Engine.deriveCar(comps, App.setupFor(teamId, wk.circuitId), App.weekend.circuit(), Data);
};

/* A big enough incident stops the race. */
RC.redFlag = function (reason, rng) {
  const live = App.state.weekend.live;
  if (live.red || live.lap >= live.totalLaps - 2) return;
  live.red = reason;
  live.redLapsLeft = rng.int(2, 4);
  live.sc = null; live.scLapsLeft = 0;
  App.weekend.say('RED FLAG. ' + reason + '. The race is suspended.', 'rc');
};

RC.restartFromRed = function (rng) {
  const live = App.state.weekend.live;
  const wk = App.state.weekend;
  const wet = Engine.wetLevel(wk.weather);
  live.cars.forEach(function (c) {
    if (c.dnf) return;
    /* A red flag is a free tyre change under the regulations, and it repairs
       light damage — teams get to work on the cars in the pit lane. */
    const want = Engine.bestCompoundFor(wet) || (live.totalLaps - c.lapsDone > 25 ? 'M' : 'S');
    c.tyre = Engine.newTyre(App.weekend.takeSet(c.driverId, want), 0);
    c.tyre.temp = 70;
    c.health.frontWing = Math.min(100, c.health.frontWing + 30);
    c.health.floor = Math.min(100, c.health.floor + 12);
    RC.applyDamage(c);
    c.energy.charge = 92;
  });
  /* The field is reformed in order, so the gaps are wiped out. */
  RC.reorder(live);
  const lead = RC.carById(live.order[0]);
  live.order.forEach(function (id, i) {
    const c = RC.carById(id);
    if (c.lapsDone === lead.lapsDone) c.totalTime = lead.totalTime + i * 0.9;
  });
  live.red = null;
  live.redLapsLeft = 0;
  App.weekend.say('The race resumes behind the safety car. Everyone has fresh tyres and the gaps are gone.', 'rc');
  RC.deploySC('SC', 'Restart procedure', rng);
};

RC.deploySC = function (kind, reason, rng) {
  const live = App.state.weekend.live;
  if (live.sc) return;
  live.sc = kind;
  live.scLapsLeft = kind === 'VSC' ? rng.int(1, 3) : rng.int(2, 5);
  App.weekend.say((kind === 'VSC' ? 'Virtual safety car deployed' : 'Safety car deployed') + ' — ' + reason + '.', 'rc');
};

RC.reorder = function (live) {
  live.order = live.cars.slice().sort(function (a, b) {
    if (!!a.dnf !== !!b.dnf) return a.dnf ? 1 : -1;
    if (a.lapsDone !== b.lapsDone) return b.lapsDone - a.lapsDone;
    return a.totalTime - b.totalTime;
  }).map(c => c.driverId);
};

RC.carById = function (id) {
  const live = App.state.weekend.live;
  for (let i = 0; i < live.cars.length; i++) if (live.cars[i].driverId === id) return live.cars[i];
  return null;
};

/* ---------------------------------------------------------------------------
 * CLASSIFICATION
 * -------------------------------------------------------------------------*/
RC.finish = function (rng) {
  const st = App.state, wk = st.weekend, live = wk.live;
  const sess = wk.sessions[wk.index];
  live.finished = true;
  live.running = false;
  RC.reorder(live);

  const pts = live.sprint ? Data.SPRINT_POINTS : Data.POINTS;
  const classification = [];
  for (let i = 0; i < live.order.length; i++) {
    const c = RC.carById(live.order[i]);
    const p = c.dnf ? 0 : (pts[i] || 0);
    classification.push({ id: c.driverId, pos: i + 1, dnf: c.dnf, points: p, time: c.totalTime, stops: c.stops, gap: c.gap });
    const ds = st.drivers[c.driverId];
    ds.points += p;
    ds.xp += 320 + (22 - i) * 26 + (c.grid - (i + 1)) * 14;
    st.teams[c.teamId].points += p;
    if (!c.dnf && !live.sprint) {
      if (i === 0) { ds.wins += 1; st.teams[c.teamId].wins += 1; }
      if (i < 3) { ds.podiums += 1; st.teams[c.teamId].podiums += 1; }
    }
    /* Form moves with result relative to grid slot. */
    const delta = (c.grid - (i + 1)) / 22 + (c.dnf ? -0.3 : 0.05);
    ds.form = Engine.clamp(ds.form * 0.72 + delta, -1, 1);
    ds.morale = Engine.clamp(ds.morale + delta * 22, 5, 100);
  }

  /* Fastest lap point: top ten only, and only in a Grand Prix. */
  let flName = null;
  if (!live.sprint && live.bestLapBy) {
    const flPos = live.order.indexOf(live.bestLapBy);
    flName = Data.driverById(live.bestLapBy).last;
    if (flPos >= 0 && flPos < 10 && !RC.carById(live.bestLapBy).dnf) {
      st.drivers[live.bestLapBy].points += 1;
      st.teams[st.drivers[live.bestLapBy].teamId].points += 1;
    }
  }

  sess.done = true;
  sess.result = {
    headline: Data.driverById(live.order[0]).last + ' wins',
    order: live.order.slice(),
    times: live.cars.reduce(function (m, c) { m[c.driverId] = c.best; return m; }, {}),
    classification
  };
  wk.index += 1;

  const podium = live.order.slice(0, 3).map(id => Data.driverById(id).last);
  App.weekend.say('Chequered flag. ' + podium[0] + ' wins the ' + (live.sprint ? 'sprint' : 'Grand Prix') + '.', 'rc');

  /* Element life. A race is a race whether or not it was a sprint weekend. */
  if (!live.sprint) {
    const allowance = Engine.regAllowance(st.regulations, Data, 'puElements') || 4;
    live.cars.forEach(function (c) {
      const ds = st.drivers[c.driverId];
      const replaced = Engine.wearElements(ds.elements, Data, {
        stress: c.dnf ? 1.3 : 1,
        reliability: c.derived.dom.reliability,
        fuelUse: App.weekend.circuit().fuelUse || 1
      });
      if (!replaced.length) return;
      const pen = Engine.gridPenalty(ds.elements, Data, allowance);
      ds.gridPenalty = pen.backOfGrid ? 99 : pen.places;
      if (App.myDriverIds().indexOf(c.driverId) !== -1) {
        App.logEvent(c.sur + ' takes a new ' + replaced.map(k => {
          const e = Data.PU_ELEMENTS.filter(x => x.key === k)[0];
          return e ? e.name.toLowerCase() : k;
        }).join(' and ') + '.' + (ds.gridPenalty ? ' That is a ' + (ds.gridPenalty === 99 ? 'back-of-grid' : ds.gridPenalty + '-place') + ' penalty at the next round.' : ''),
          ds.gridPenalty ? 'warn' : 'info');
      }
    });
  }

  if (!live.sprint) {
    st.results.push({ round: wk.round, name: wk.name, podium, fastest: flName, classification });
    App.logEvent(wk.name + ': ' + podium[0] + ' wins from ' + podium[1] + ' and ' + podium[2] + '.', 'good');
    RC.postRaceInspection(rng);
    wk.classified = true;
  }
  App.save();
};

/* FIA post-race scrutineering. Teams running a grey-area part can be caught. */
RC.postRaceInspection = function (rng) {
  const st = App.state;
  for (const tid in st.teams) {
    const ts = st.teams[tid];
    if (!ts.illegal) continue;
    ts.illegal.races = (ts.illegal.races || 0) + 1;
    ts.fiaSuspicion += rng.range(6, 22);
    const caught = rng.chance(ts.illegal.risk + ts.fiaSuspicion / 400);
    if (!caught) continue;
    const team = Data.teamById(tid);
    App.logEvent('FIA technical inspection: ' + team.name + '\'s ' + Data.componentByKey(ts.illegal.component).name +
                 ' fails the deflection test. Both cars disqualified.', 'bad');
    const drivers = Data.DRIVERS.filter(d => st.drivers[d.id].teamId === tid);
    const last = st.results[st.results.length - 1];
    for (let i = 0; i < drivers.length; i++) {
      const row = last.classification.filter(r => r.id === drivers[i].id)[0];
      if (!row) continue;
      st.drivers[drivers[i].id].points -= row.points;
      ts.points -= row.points;
      row.points = 0; row.dsq = true;
    }
    ts.illegal = null;
    ts.fiaSuspicion = 0;
  }
};

/* Headless: run the whole race with no timers. */
RC.runToEnd = function () {
  const live = App.state.weekend.live;
  if (!live) return;
  let guard = live.totalLaps + 8;
  while (!live.finished && guard-- > 0) RC.tick();
  if (!live.finished) RC.finish(Engine.rng(live.rngSeed));
};

RC.simulate = function (sess) {
  RC.build(sess);
  RC.runToEnd();
};

/* Same mount-once / update-in-place discipline as the practice screen. See the
   invariant note in app_weekend.js: rebuilding on the interval makes the whole
   screen unclickable. */
App.screens.race = {
  render: function (root) {
    const wk = App.state.weekend, live = wk && wk.live;
    if (!live || live.type !== 'race') { App.route('weekend'); return; }
    root.appendChild(App.chrome('weekend'));
    const main = App.h('main.live.live--race');
    main.appendChild(App.h('div.live__bar', { id: 'race-bar' }));
    const grid = App.h('div.live__grid');
    grid.appendChild(App.h('div.live__tower', { id: 'race-tower' }));
    grid.appendChild(App.h('div.live__mid', {}, [
      App.h('div.live__map', { id: 'race-map' }),
      App.h('div.live__tele', { id: 'race-tele' })
    ]));
    grid.appendChild(App.h('div.live__side', { id: 'race-side' }));
    main.appendChild(grid);
    main.appendChild(App.h('div.ctrl', { id: 'race-ctrl' }));
    root.appendChild(main);

    RC.mount();
    live.running = !live.finished;
    /* 1x means real time: one lap of the race takes one lap time to watch,
       exactly like practice and qualifying. `acc` is the fraction of the
       current lap elapsed, so it advances by (seconds / lap duration) rather
       than by a fixed amount — the old version ran a lap per second, which was
       roughly 90x real time and made the map look like a fast-forward. */
    App.every(60, function () {
      if (live.running && !live.finished) {
        const lead = RC.carById(live.order[0]);
        const lapDur = Math.max(20, lead ? lead.lapDur : 90);
        live.acc = (live.acc || 0) + (0.060 * live.speed) / lapDur;
        while (live.acc >= 1 && !live.finished) { live.acc -= 1; RC.tick(); }
      }
      RC.refresh();
    });
  }
};

  live.els.path = Engine.trackPath(circuit, Data);
  live.els.pit = Engine.pitLane(live.els.path);
  live.els.trackLine = svg.querySelector('.trackmap__line');
  const mine = App.myDriverIds();
  live.els.mineSet = {};
  mine.forEach(id => { live.els.mineSet[id] = true; });
  live.cars.forEach(function (c) {

    dot.setAttribute('fill', c.colour);

    dot.setAttribute('data-code', c.code);
    svg.appendChild(dot);

  });

RC.refreshMap = function () {
  const live = App.state.weekend.live, els = live.els;
  const path = els.path, pad = 8, span = 100 - pad * 2;
  const lead = RC.carById(live.order[0]);
  if (!lead) return;

  /* A single race clock, interpolated between lap ticks, drives every car.
     Each car's position is where it was at that moment inside its own lap
     window, so the whole field moves continuously and correct relative gaps
     fall out of the arithmetic rather than being approximated. */
  const within = live.finished ? 1 : Engine.clamp(live.acc || 0, 0, 1);
  const clock = lead.lapStart + within * lead.lapDur;

  let running = 0, inPit = 0;
  live.cars.forEach(function (c) {
    const dot = els.dots[c.driverId];
    if (c.dnf) {
      /* Retired cars fade where they stopped rather than vanishing mid-frame. */
      const age = live.lap - (c.retiredAt || live.lap);
      if (age > 1) { dot.style.display = 'none'; return; }
      dot.style.display = '';
      dot.setAttribute('opacity', '0.28');
      dot.setAttribute('class', 'trackmap__car is-dnf');
      return;
    }
    dot.style.display = '';
    running++;
    let rel = (clock - c.lapStart) / Math.max(1, c.lapDur);
    rel = ((rel % 1) + 1) % 1;

    if (c.inPit && within < 0.28) {
      /* Travelling down the pit lane. Placed on the real lane geometry so the
         car is never drawn off the circuit. */
      inPit++;
      const lane = els.pit;
      const p = lane[Math.floor(Engine.clamp(within / 0.28, 0, 0.999) * lane.length)];
      dot.setAttribute('cx', (pad + p.x * span).toFixed(2));
      dot.setAttribute('cy', (pad + p.y * span).toFixed(2));
      dot.setAttribute('opacity', '0.9');
      dot.setAttribute('class', 'trackmap__car is-pit' + (els.mineSet[c.driverId] ? ' is-mine' : ''));
      return;
    }
    const f = Engine.clamp(rel, 0, 0.99999) * path.pts.length;
    const i0 = Math.floor(f), t = f - i0;
    const a = path.pts[i0 % path.pts.length], b = path.pts[(i0 + 1) % path.pts.length];
    dot.setAttribute('cx', (pad + Engine.lerp(a.x, b.x, t) * span).toFixed(2));
    dot.setAttribute('cy', (pad + Engine.lerp(a.y, b.y, t) * span).toFixed(2));
    dot.setAttribute('opacity', live.sc ? '0.7' : '1');
    dot.setAttribute('class', 'trackmap__car' + (els.mineSet[c.driverId] ? ' is-mine' : ''));
  });

  if (els.trackLine) {
    els.trackLine.setAttribute('class', 'trackmap__line' + (live.sc === 'SC' ? ' is-sc' : (live.sc === 'VSC' ? ' is-vsc' : '')));
  }
  els.mapOn.textContent = running + ' running' + (inPit ? '  ·  ' + inPit + ' in the pits' : '');
  els.mapFlag.textContent = live.sc ? live.sc + ' — ' + live.scLapsLeft + ' laps' : 'Green flag';
};

        text: d.last, 'data-mycar': id, style: { '--tc': team.colour },
        onclick: function () { onPick(id); }

  /* Anyone can inspect anyone. An observer has no cars of their own, so
     without this the panel is stuck on whoever happens to be leading. */
  const sel = App.h('select.sel.mycars__sel', { 'data-driver-pick': '1',
    onchange: function (e) { onPick(e.target.value); } });

RC.refreshTele = function () {
  const live = App.state.weekend.live, t = live.els.tele;
  if (!t) return;
  const c = RC.carById(t.id);
  if (!c) return;
  const comp = Data.COMPOUNDS[c.tyre.compound];

  t.pos.textContent = 'P' + c.position + ' from P' + c.grid;
  t.mode.textContent = c.dnf ? 'RETIRED' : c.pushMode;
  t.kv['Last lap'].textContent = c.last ? Engine.fmtLap(c.last) : '—';
  t.kv['Best lap'].textContent = c.best ? Engine.fmtLap(c.best) : '—';
