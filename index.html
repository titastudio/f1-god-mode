  t.kv['Wear'].textContent = c.tyre.wear.toFixed(0) + '%';
  t.kv['Core temp'].textContent = c.tyre.temp.toFixed(0) + '°C';
  t.kv['Battery'].textContent = c.energy.charge.toFixed(0) + '%';
  t.kv['PU temp'].textContent = c.energy.heat.toFixed(0) + '°C';
  t.kv['Fuel'].textContent = c.fuelKg.toFixed(1) + ' kg';
  const need = Math.max(0, live.totalLaps - c.lapsDone) * Engine.fuelPerLap(circuit, c.derived);
  t.kv['Fuel margin'].textContent = (c.fuelKg - need).toFixed(1) + ' kg' + (c.fuelSave > 0 ? '  saving' : '');
  t.kv['Energy map'].textContent = (c.energy.mode === 'AUTO' ? 'Auto → ' : '') +
    (Data.ENERGY_MODES[c.energy.effective || c.energy.mode] || Data.ENERGY_MODES.BALANCED).name;
  const cx = c.ctx || {};
  t.kv['Situation'].textContent = c.dnf ? '—'
    : (cx.sc ? 'Neutralised' : (cx.attacking ? 'Attacking' : (cx.defending ? 'Defending'
      : (cx.clearAir ? 'Clear air' : 'In traffic'))));
  t.kv['Stops'].textContent = String(c.stops);
  t.kv['Strategy'].textContent = c.plan.key;
  t.kv['Front wing'].textContent = c.health.frontWing.toFixed(0) + '%';
  if (t.pushBtns) for (const m in t.pushBtns) t.pushBtns[m].classList.toggle('is-on', c.pushMode === m);
  if (t.energyBtns) for (const m in t.energyBtns) t.energyBtns[m].classList.toggle('is-on', c.energy.mode === m);
};

RC.mountSide = function () {
  const live = App.state.weekend.live;
  const host = App.clear(App.$('#race-side'));
  host.appendChild(App.h('h3.side__h', { text: 'Race control & radio' }));
  live.els.feed = App.h('div.side__feed');
  host.appendChild(live.els.feed);
  live.els.msgSeen = 0;
};
RC.refreshSide = function () {
  const live = App.state.weekend.live, els = live.els;
  const total = live.messages.length;
  if (total === els.msgSeen) return;
  const fresh = live.messages.slice(0, total - els.msgSeen).reverse();
  fresh.forEach(function (m) {
    els.feed.insertBefore(App.h('div.msg.msg--' + m.kind, {}, [
      App.h('span.msg__t', { text: 'L' + Math.max(1, m.lap || live.lap) }),
      App.h('span.msg__x', { text: m.text })
    ]), els.feed.firstChild);
  });
  els.msgSeen = total;
  while (els.feed.childNodes.length > 44) els.feed.removeChild(els.feed.lastChild);
};

RC.mountCtrl = function () {
  const live = App.state.weekend.live, e = live.els;
  const host = App.clear(App.$('#race-ctrl'));
  e.play = App.h('button.ctrl__play', { id: 'btn-play', title: 'Play or pause',
    onclick: function () { live.running = !live.running; RC.refreshCtrl(); } });
  host.appendChild(e.play);
  e.speedBtns = {};
  const speeds = App.h('div.ctrl__speeds');
  [1, 5, 15, 30, 60, 120].forEach(function (s) {
    const b = App.h('button.spd', { text: s + '×', 'data-speed': s,
      onclick: function () { live.speed = s; RC.refreshCtrl(); } });
    e.speedBtns[s] = b; speeds.appendChild(b);
  });
  host.appendChild(speeds);
  e.nextLap = App.h('button.btn.btn--sm.btn--ghost', { id: 'btn-nextlap', text: 'Next lap',
    onclick: function () { RC.tick(); RC.refresh(); } });
  host.appendChild(e.nextLap);
  e.skip = App.h('button.btn.btn--sm.btn--ghost', { id: 'btn-skip', text: 'Skip to flag',
    onclick: function () { live.running = false; RC.runToEnd(); RC.refresh(); } });
  host.appendChild(e.skip);
  if (App.can('world')) {
    host.appendChild(App.h('button.btn.btn--sm.btn--god', { id: 'btn-god', text: '⏸ God pause',
      onclick: function () { live.running = false; RC.refreshCtrl(); RC.godPanel(); } }));
  }
  e.cont = App.h('button.btn.btn--sm.btn--primary', { id: 'btn-continue', text: 'Continue',
    onclick: function () {
      const wk = App.state.weekend;
      if (wk.index >= wk.sessions.length) { App.hub.advanceRound(); App.route('hub'); }
      else App.route('weekend');
    } });
  host.appendChild(e.cont);
  e.classif = App.h('button.btn.btn--sm.btn--ghost', { text: 'Classification',
    onclick: function () {
      const wk = App.state.weekend;
      App.weekend.showSessionResult(wk.sessions[wk.index - 1]);
    } });
  host.appendChild(e.classif);
  e.state = App.h('span.ctrl__state');
  host.appendChild(e.state);
};
RC.refreshCtrl = function () {
  const live = App.state.weekend.live, e = live.els;
  const wk = App.state.weekend;
  e.play.textContent = live.running ? '❚❚' : '▶';
  e.play.classList.toggle('is-on', live.running);
  e.play.disabled = live.finished;
  for (const s in e.speedBtns) e.speedBtns[s].classList.toggle('is-on', Number(s) === live.speed);
  e.nextLap.disabled = live.finished;
  e.skip.disabled = live.finished;
  e.cont.style.display = live.finished ? '' : 'none';
  e.classif.style.display = live.finished ? '' : 'none';
  if (live.finished) e.cont.textContent = wk.index >= wk.sessions.length ? 'Next round →' : 'Continue';
  e.state.textContent = live.finished ? 'Race complete' :
    (live.running ? live.speed + '× — lap ' + live.lap + (live.speed === 1 ? ' (real time)' : '')
                  : 'Paused on lap ' + live.lap);
};

/* Race-specific god panel: neutralisations and reliability on demand. */
RC.godPanel = function () {
  const live = App.state.weekend.live;
  const body = App.modal('God pause — lap ' + live.lap, { wide: true });
  body.appendChild(App.h('p.muted', { text: 'Change the race. Consequences propagate through tyres, energy, component life and the championship.' }));

  body.appendChild(App.h('h3.modal__h', { text: 'Race control' }));
  body.appendChild(App.h('div.godrow', {}, [
    App.h('button.btn.btn--sm.btn--god', { text: 'Deploy safety car', onclick: function () {
      RC.deploySC('SC', 'Race director intervention', Engine.rng(live.rngSeed));
      App.state.interventions++; RC.refresh();
    } }),
    App.h('button.btn.btn--sm.btn--god', { text: 'Deploy VSC', onclick: function () {
      RC.deploySC('VSC', 'Race director intervention', Engine.rng(live.rngSeed));
      App.state.interventions++; RC.refresh();
    } }),
    App.h('button.btn.btn--sm.btn--god', { text: 'Clear the track', onclick: function () {
      live.sc = null; live.scLapsLeft = 0; App.weekend.say('Track clear. Racing resumes.', 'rc');
      App.state.interventions++; RC.refresh();
    } })
  ]));

  body.appendChild(App.h('h3.modal__h', { text: 'Weather' }));
  const wk = App.state.weekend;
  const wetVal = App.h('span.slider__v.num', { text: Math.round(Engine.wetLevel(wk.weather) * 100) + '%' });
  body.appendChild(App.h('label.slider', {}, [
    App.h('span.slider__k', { text: 'Rain' }),
    App.h('input', { type: 'range', min: 0, max: 100, value: Math.round(Engine.wetLevel(wk.weather) * 100),
      oninput: function (e) {
        const v = Number(e.target.value) / 100;
        wk.weather.sectors = [v, v, v];
        wetVal.textContent = e.target.value + '%';
        App.state.interventions++;
      } }),
    wetVal
  ]));

  body.appendChild(App.h('h3.modal__h', { text: 'Intervene on a car' }));
  const sel = App.h('select.sel');
  live.cars.forEach(c => sel.appendChild(App.h('option', { value: c.driverId, text: (c.dnf ? '[OUT] ' : '') + c.name })));
  body.appendChild(App.h('div.godrow', {}, [
    sel,
    App.h('button.btn.btn--sm.btn--god', { text: 'Fresh tyres, no stop', onclick: function () {
      const c = RC.carById(sel.value); if (!c) return;
      c.tyre = Engine.newTyre('S', 0); c.tyre.temp = 96;
      App.weekend.say(c.sur + ' has fresh rubber. Nobody saw them stop.', 'team');
      App.state.interventions++; RC.refresh();
    } }),
    App.h('button.btn.btn--sm.btn--god', { text: 'Full charge', onclick: function () {
      const c = RC.carById(sel.value); if (!c) return;
      c.energy.charge = 100; c.energy.overrideAvail = true;
      App.state.interventions++; RC.refresh();
    } }),
    App.h('button.btn.btn--sm.btn--god', { text: 'End their race', onclick: function () {
      const c = RC.carById(sel.value); if (!c || c.dnf) return;
      c.dnf = 'Divine intervention';
      App.state.drivers[c.driverId].dnfs += 1;
      App.weekend.say(c.sur + ' has stopped. No explanation was offered.', 'bad');
      App.state.interventions++; RC.reorder(live); RC.refresh();
    } }),
    App.h('button.btn.btn--sm.btn--god', { text: '+10s penalty', onclick: function () {
      const c = RC.carById(sel.value); if (!c) return;
      c.totalTime += 10; c.penalty += 10;
      App.weekend.say(c.sur + ' receives a ten second time penalty.', 'rc');
      App.state.interventions++; RC.reorder(live); RC.refresh();
    } })
  ]));
};
</script>
<!-- ==== app_garage.js ==== -->
<script>
/* ============================================================================
 * app_garage.js — secondary screens
 *   · Garage: setup, the car component tree, and the "why are we slow" report
 *   · R&D: development projects, wind tunnel and CFD allocation, grey-area parts
 * ==========================================================================*/

App.garage = {};
const GA = App.garage;

/* ---------------------------------------------------------------------------
 * GARAGE
 * -------------------------------------------------------------------------*/
App.screens.garage = {
  render: function (root, params) {
    const st = App.state;
    root.appendChild(App.chrome('garage'));
    const main = App.h('main.page.page--garage');

    const mine = App.myDriverIds();
    if (!mine.length) {
      main.appendChild(App.h('h1.page__h', { text: 'No garage' }));
      main.appendChild(App.h('p.muted', { text: 'You are observing. Nobody is going to let you touch a car.' }));
      root.appendChild(main);
      return;
    }
    const driverId = params.driverId && mine.indexOf(params.driverId) !== -1 ? params.driverId : mine[0];
    const wk = App.weekend.ensure();
    const circuit = wk ? App.weekend.circuit() : Data.circuitById('bahrain');
    const teamId = st.drivers[driverId].teamId;
    const parcFerme = wk ? wk.sessions.some(s => s.type === 'qualifying' && s.done) : false;

    /* Driver switch */
    const head = App.h('div.gr__head', {}, [
      App.h('div', {}, [
        App.h('p.eyebrow', { text: Data.teamById(teamId).name + '  ·  ' + circuit.name }),
        App.h('h1.page__h', { text: 'Garage' })
      ]),
      App.h('div.gr__switch', {}, mine.map(function (id) {
        return App.h('button.pill' + (id === driverId ? '.is-on' : ''), {
          text: Data.driverById(id).last, 'data-driver': id,
          onclick: function () { App.route('garage', { driverId: id }); }
        });
      }))
    ]);
    main.appendChild(head);

    if (parcFerme) {
      main.appendChild(App.h('div.warnbar', { text: 'Parc fermé is in force. Qualifying has run, so the setup is locked until the race. Only tyre and energy choices remain open.' }));
    }
    if (!App.can('setup')) {
      main.appendChild(App.h('div.warnbar', { text: 'Your role does not include setup. Ask for a Technical Director career, or take God mode, if you want to touch these numbers.' }));
    }

    const cols = App.h('div.gr__cols');

    /* --- Setup --- */
    const setup = App.setupFor(teamId, circuit.id);
    const sBody = App.h('div.card__body');
    const readout = App.h('div.gr__readout', { id: 'gr-readout' });
    const preview = App.h('div.gr__preview', { id: 'gr-preview' });

    const locked = parcFerme || !App.can('setup');
    Data.SETUP_FIELDS.forEach(function (f) {
      const rec = circuit.target[f.key];
      const val = App.h('span.slider__v.num', { text: String(setup[f.key]) });
      const row = App.h('div.setrow', {}, [
        App.h('div.setrow__top', {}, [
          App.h('span.slider__k', { text: f.name }),
          rec != null ? App.h('span.setrow__rec', { text: 'Engineers say ' + rec }) : null,
          val
        ]),
        App.h('input.setrow__in', {
          type: 'range', min: f.min, max: f.max, step: f.step, value: setup[f.key],
          'data-setup': f.key, disabled: locked,
          oninput: function (e) {
            const from = setup[f.key];
            setup[f.key] = Number(e.target.value);
            val.textContent = e.target.value;
            GA.paintReadout(driverId, circuit);
            GA.previewChange(driverId, circuit, f, from, Number(e.target.value));
          }
        }),
        App.h('div.setrow__hint', {}, [
          App.h('span.hint.hint--up', { text: '↑ ' + f.up }),
          App.h('span.hint.hint--dn', { text: '↓ ' + f.down }),
          App.h('button.linkbtn.setrow__explain', { text: 'What is this?', onclick: function () {
            GA.settingModal(f, driverId, circuit);
          } })
        ])
      ]);
      sBody.appendChild(row);
    });
    sBody.appendChild(App.h('div.gr__acts', {}, [
      App.h('button.btn.btn--sm', { text: 'Take the engineers\' setup', disabled: locked, onclick: function () {
        const s = Data.defaultSetup();
        for (const k in circuit.target) s[k] = circuit.target[k];
        for (const k in s) setup[k] = s[k];
        App.route('garage', { driverId });
      } }),
      App.h('button.btn.btn--sm.btn--ghost', { text: 'Reset to neutral', disabled: locked, onclick: function () {
        const s = Data.defaultSetup();
        for (const k in s) setup[k] = s[k];
        App.route('garage', { driverId });
      } })
    ]));

    cols.appendChild(App.h('section.card.gr__setup', {}, [
      App.h('header.card__head', {}, [App.h('h2', { text: 'Setup' }), App.h('span.card__tag', { text: circuit.name })]),
      sBody
    ]));

    /* --- Live readout + component tree --- */
    const right = App.h('div.gr__right');
    right.appendChild(App.h('section.card', {}, [
      App.h('header.card__head', {}, [App.h('h2', { text: 'What that produces' })]),
      App.h('div.card__body', {}, [readout, preview])
    ]));
    right.appendChild(GA.componentTree(teamId, driverId, circuit));
    cols.appendChild(right);

    main.appendChild(cols);
    root.appendChild(main);
    GA.paintReadout(driverId, circuit);
  }
};

/* "If I change it, what happens?" — the predicted consequences of the move the
   player just made, shown before the car has run. These are predictions from
   the model, and the readout says so: the real answer comes from the track. */
GA.previewChange = function (driverId, circuit, field, from, to) {
  const host = App.$('#gr-preview');
  if (!host || from === to) return;
  const teamId = App.state.drivers[driverId].teamId;
  const base = Object.assign({}, App.setupFor(teamId, circuit.id));
  base[field.key] = from;
  const preview = Engine.setupPreview({
    components: App.state.teams[teamId].components, setup: base,
    field: field.key, value: to, circuit, driver: App.driver(driverId), Data
  });
  App.clear(host);
  host.appendChild(App.h('div.prevhead', {}, [
    App.h('b', { text: field.name + '  ' + from + ' → ' + to }),
    App.h('span.num' + (preview.lapDelta < 0 ? '.is-gain' : '.is-loss'), {
      text: App.fmt.signed(preview.lapDelta, 3) + 's predicted' })
  ]));
  const rows = App.h('div.prevrows');
  preview.rows.slice(0, 6).forEach(function (r) {
    rows.appendChild(App.h('span.prevchip' + (r.good ? '.is-good' : '.is-bad'), {
      text: r.label + ' ' + App.fmt.signed(r.delta, 1) }));
  });
  host.appendChild(rows);
  if (preview.stintTo !== preview.stintFrom) {
    host.appendChild(App.h('p.muted', { text: 'Medium-tyre stint ' + preview.stintFrom + ' → ' + preview.stintTo + ' laps.' }));
  }
  host.appendChild(App.h('p.muted', { text: 'A prediction, not a result. Run the car to find out whether the model was right.' }));
};

/* The education layer for a single setup value. */
GA.settingModal = function (field, driverId, circuit) {
  const body = App.modal(field.name, {});
  body.appendChild(App.h('div.acfeel', {}, [
    App.h('div.acfeel__c.acfeel__c--up', {}, [App.h('b', { text: 'Turn it up' }), App.h('p', { text: field.up })]),
    App.h('div.acfeel__c.acfeel__c--dn', {}, [App.h('b', { text: 'Turn it down' }), App.h('p', { text: field.down })])
  ]));
  const rec = circuit.target[field.key];
  body.appendChild(App.h('p.muted', { text: rec != null
    ? 'The engineers recommend ' + rec + ' here, based on what this circuit demands. You are under no obligation to agree with them.'
    : 'The engineers have no strong view on this one at this circuit.' }));

  /* Sweep the whole range and show where the lap time actually goes. */
  const teamId = App.state.drivers[driverId].teamId;
  const setup = App.setupFor(teamId, circuit.id);
  const comps = App.state.teams[teamId].components;
  const drv = App.driver(driverId);
  const shares = Engine.sectorShares(circuit);
  const pts = [];
  for (let v = field.min; v <= field.max; v += 5) {
    const s2 = Object.assign({}, setup); s2[field.key] = v;
    const t = Engine.lapTime({
      Data, rng: null, derived: Engine.deriveCar(comps, s2, circuit, Data), driver: drv, circuit,
      tyre: Engine.newTyre('S', 0), fuelKg: 12, trackGrip: 0.94, wet: 0,
      energyEffect: 0, charge: 80, push: 'ATTACK', mode: 'quali', sectorShares: shares, dirtyAir: 0
    }).time;
    pts.push({ v, t });
  }
  let best = pts[0], worst = pts[0];
  pts.forEach(p => { if (p.t < best.t) best = p; if (p.t > worst.t) worst = p; });
  body.appendChild(App.h('h3.modal__h', { text: 'Sweeping the whole range at ' + circuit.name }));
  const sweep = App.h('div.sweep');
  pts.forEach(function (p) {
    const frac = (worst.t - p.t) / Math.max(0.001, worst.t - best.t);
    sweep.appendChild(App.h('div.sweep__b' + (p.v === setup[field.key] ? '.is-now' : '') + (p === best ? '.is-best' : ''), {
      title: field.name + ' ' + p.v + ' → ' + Engine.fmtLap(p.t),
      style: { '--h': (12 + frac * 88) + '%' }
    }, [App.h('span', { text: String(p.v) })]));
  });
  body.appendChild(sweep);
  body.appendChild(App.h('p.muted', { text: 'Fastest in isolation is ' + best.v + ', worth ' +
    (worst.t - best.t).toFixed(3) + 's over the worst setting. Isolation is the catch: every other value on the car is held still here, and in reality they interact.' }));
};

GA.paintReadout = function (driverId, circuit) {
  const host = App.$('#gr-readout');
  if (!host) return;
  App.clear(host);
  const derived = App.derivedFor(driverId, circuit.id);
  const drv = App.driver(driverId);
  const dom = derived.dom;

  const rows = [
    ['High-speed corners', dom.highSpeed, circuit.dna.highSpeed],
    ['Medium-speed corners', dom.medSpeed, circuit.dna.medSpeed],
    ['Low-speed corners', dom.lowSpeed, circuit.dna.lowSpeed],
    ['Straights', dom.straight, circuit.dna.straight],
    ['Braking', dom.braking, circuit.dna.braking],
    ['Traction', dom.traction, circuit.dna.traction]
  ];
  const wrap = App.h('div.readout');
  rows.forEach(function (r) {
    wrap.appendChild(App.h('div.rd', {}, [
      App.h('span.rd__k', { text: r[0] }),
      App.h('i.rd__t', {}, [App.h('i.rd__f', { style: { '--w': Engine.clamp((r[1] - 25) / 70 * 100, 2, 100) + '%' } })]),
      App.h('span.rd__v.num', { text: r[1].toFixed(1) }),
      App.h('span.rd__w', { text: Math.round(r[2] * 100) + '% of lap' })
    ]));
  });
  host.appendChild(wrap);

  /* Estimated clean lap, so setup changes have a number attached. */
  const rng = Engine.rng(1234567);
  const est = Engine.lapTime({
    Data, rng: null, derived, driver: drv, circuit,
    tyre: Engine.newTyre('S', 0), fuelKg: 12, trackGrip: 0.94, wet: 0,
    energyEffect: 0, charge: 80, push: 'ATTACK', mode: 'quali',
    sectorShares: Engine.sectorShares(circuit), dirtyAir: 0
  });
  host.appendChild(App.h('div.estlap', {}, [
    App.h('span.estlap__k', { text: 'Estimated qualifying lap' }),
    App.h('span.estlap__v.num', { id: 'est-lap', text: Engine.fmtLap(est.time) })
  ]));

  const bal = dom.balance;
  host.appendChild(App.h('div.balance', {}, [
    App.h('span.balance__k', { text: 'Aero balance' }),
    App.h('i.balance__t', {}, [App.h('i.balance__m', { style: { '--x': Engine.clamp(bal * 100, 10, 90) + '%' } })]),
    App.h('span.balance__v.num', { text: (bal * 100).toFixed(1) + '% front' })
  ]));
  host.appendChild(App.h('p.muted', {
    text: bal > 0.52 ? 'Front-limited: the rear will feel loose and the rear tyres will pay for it.'
        : (bal < 0.48 ? 'Rear-limited: understeer mid-corner and the front-left will overheat.'
        : 'Neutral. Neither axle is being asked to do more than its share.')
  }));

  host.appendChild(App.h('div.gr__acts', {}, [
    App.h('button.btn.btn--sm.btn--ghost', {
      id: 'btn-whyslow', text: 'Why are we slow?', onclick: function () { GA.paceReport(driverId, circuit); } }),
    App.h('button.btn.btn--sm.btn--ghost', {
      id: 'btn-academy', text: 'What does this circuit need?',
      onclick: function () { App.route('academy', { tab: 'circuits', circuit: circuit.id }); } })
  ]));
};

/* ---------------------------------------------------------------------------
 * COMPONENT TREE
 * -------------------------------------------------------------------------*/
GA.componentTree = function (teamId, driverId, circuit) {
  const ts = App.state.teams[teamId];
  const derived = App.derivedFor(driverId, circuit.id);
  const body = App.h('div.card__body.card__body--tight');

  Data.COMPONENT_GROUPS.forEach(function (g) {
    body.appendChild(App.h('h3.tree__g', { text: g }));
    const grid = App.h('div.tree');
    Data.COMPONENTS.filter(c => c.group === g).forEach(function (comp) {
      const v = ts.components[comp.key];
      const leg = Engine.legality(comp.key, v, App.state.regulations, Data, ts);
      grid.appendChild(App.h('button.node', {
        'data-component': comp.key,
        style: { '--v': Engine.clamp((v - 65) / 40 * 100, 4, 100) + '%', '--lc': leg.colour },
        title: comp.name + ' — ' + leg.name,
        onclick: function () { GA.componentModal(comp, teamId, driverId, circuit); }
      }, [
        App.h('span.node__n', {}, [App.h('i.node__leg'), App.h('span', { text: comp.name })]),
        App.h('span.node__v.num', { text: v.toFixed(1) }),
        App.h('i.node__t', {}, [App.h('i.node__f')])
      ]));
    });
    body.appendChild(grid);
  });

  body.appendChild(App.h('p.muted', { text: 'Spec ' + ts.spec + '. Every component links to the channels it feeds and the domains those channels decide. Nothing in this game is a flat "+5 speed".' }));

  return App.h('section.card', {}, [
    App.h('header.card__head', {}, [App.h('h2', { text: 'The car' }), App.h('span.card__tag', { text: 'Rating ' + Engine.carRating(derived).toFixed(1) })]),
    body
  ]);
};

GA.componentModal = function (comp, teamId, driverId, circuit) {
  const ts = App.state.teams[teamId];
  const derived = App.derivedFor(driverId, circuit.id);
  const body = App.modal(comp.name, { wide: true });

  body.appendChild(App.h('p.lede', { text: comp.desc }));
  body.appendChild(App.h('div.compstat', {}, [
    App.h('div.compstat__v', {}, [App.h('b', { text: ts.components[comp.key].toFixed(1) }), App.h('em', { text: 'Development rating' })]),
    App.h('div.compstat__v', {}, [App.h('b', { text: comp.group }), App.h('em', { text: 'Discipline' })])
  ]));

  const leg = Engine.legality(comp.key, ts.components[comp.key], App.state.regulations, Data, ts);
  const arts = (Data.COMPONENT_REGS[comp.key] || []);
  body.appendChild(App.h('div.legbox', { style: { '--lc': leg.colour } }, [
    App.h('i.legbox__d'),
    App.h('span.legbox__s', { text: leg.name }),
    App.h('span.legbox__a', { text: arts.length
      ? 'Governed by ' + arts.map(id => { const d = Engine.ruleDef(id, Data); return d ? d.article : id; }).join(', ')
      : 'No article restricts this component directly.' }),
    App.h('button.linkbtn', { text: 'Open the rulebook', onclick: function () { App.closeModal(); App.route('regs'); } })
  ]));

  body.appendChild(App.h('h3.modal__h', { text: 'What it feeds' }));
  const chain = App.h('div.chain');
  for (const key in comp.affects) {
    const w = comp.affects[key];
    chain.appendChild(App.h('div.chain__row' + (w < 0 ? '.is-neg' : ''), {}, [
      App.h('span.chain__k', { text: GA.channelLabel(key) }),
      App.h('i.chain__t', {}, [App.h('i.chain__f', { style: { '--w': Math.min(100, Math.abs(w) * 200) + '%' } })]),
      App.h('span.chain__v.num', { text: App.fmt.signed(w, 2) }),
      App.h('span.chain__c.num', { text: 'now ' + derived.ch[key].toFixed(1) })
    ]));
  }
  body.appendChild(chain);

  body.appendChild(App.h('h3.modal__h', { text: 'Which channels those decide' }));
  body.appendChild(App.h('p.muted', { text: 'Downforce, drag and mechanical grip combine into the six lap-time domains. This circuit spends ' +
    Math.round(circuit.dna.highSpeed * 100) + '% of the lap in high-speed corners and ' +
    Math.round(circuit.dna.straight * 100) + '% on the straights, so that is where this component is worth the most today.' }));

  body.appendChild(App.h('h3.modal__h', { text: 'Where the rating came from' }));
  const contribs = [];
  for (const key in comp.affects) {
    const list = derived.why[key] || [];
    for (let i = 0; i < list.length; i++) if (list[i].src === comp.name) contribs.push({ key, amount: list[i].amount });
  }
  if (!contribs.length) body.appendChild(App.h('p.muted', { text: 'This component sits exactly at the reference rating of 80, so it is contributing nothing either way.' }));
  contribs.forEach(function (c) {
    body.appendChild(App.h('div.whyrow' + (c.amount > 0 ? '.is-gain' : '.is-loss'), {}, [
      App.h('span.whyrow__k', { text: GA.channelLabel(c.key) }),
      App.h('span.whyrow__d', { text: 'from a rating of ' + ts.components[comp.key].toFixed(1) + ' against the reference 80' }),
      App.h('span.whyrow__v.num', { text: App.fmt.signed(c.amount, 1) })
    ]));
  });

  if (App.can('rnd')) {
    body.appendChild(App.h('button.btn.btn--sm.btn--primary', {
      text: 'Develop this component', onclick: function () { App.closeModal(); App.route('rnd', { focus: comp.key }); }
    }));
  }
};

GA.channelLabel = function (key) {
  const map = {
    downforceFront: 'Front downforce', downforceRear: 'Rear downforce', drag: 'Drag',
    aeroEfficiency: 'Aero efficiency', activeAero: 'Active aero quality', mechGrip: 'Mechanical grip',
    platformStability: 'Platform stability', kerbs: 'Kerb tolerance', traction: 'Traction',
    braking: 'Braking', straightline: 'Straight-line speed', power: 'Power',
    energyDeploy: 'Energy deployment', energyRecovery: 'Energy recovery', energyCapacity: 'Store capacity',
    fuelEfficiency: 'Fuel efficiency', coolingCapacity: 'Cooling capacity', heat: 'Heat generated',
    reliability: 'Reliability', tyreKindness: 'Tyre kindness', rideSensitivity: 'Ride sensitivity',
    dirtyAir: 'Dirty-air tolerance', weight: 'Weight'
  };
  return map[key] || key;
};

/* ---------------------------------------------------------------------------
 * PACE REPORT — the deterministic "why are we slow" engineering report
 * -------------------------------------------------------------------------*/
GA.paceReport = function (driverId, circuit) {
  const st = App.state;
  const myTeam = st.drivers[driverId].teamId;
  const shares = Engine.sectorShares(circuit);
  const mineDrv = App.driver(driverId);
  const mineDer = App.derivedFor(driverId, circuit.id);

  function cleanLap(id) {
    const d = App.driver(id);
    return Engine.lapTime({
      Data, rng: null, derived: App.derivedFor(id, circuit.id), driver: d, circuit,
      tyre: Engine.newTyre('S', 0), fuelKg: 12, trackGrip: 0.94, wet: 0,
      energyEffect: 0, charge: 80, push: 'ATTACK', mode: 'quali', sectorShares: shares, dirtyAir: 0
    });
  }
  const mine = cleanLap(driverId);

  /* Rival = fastest car that is not ours. */
  let bestId = null, bestT = 1e9;
  for (let i = 0; i < Data.DRIVERS.length; i++) {
    const id = Data.DRIVERS[i].id;
    if (st.drivers[id].teamId === myTeam) continue;
    const t = cleanLap(id).time;
    if (t < bestT) { bestT = t; bestId = id; }
  }
  const theirs = cleanLap(bestId);
  const rep = Engine.paceReport(mine, theirs);
  const rivalTeam = Data.teamById(st.drivers[bestId].teamId);

  const body = App.modal('Why are we slow?', { wide: true });
  body.appendChild(App.h('p.lede', {
    text: rep.total > 0
      ? 'You are losing ' + rep.total.toFixed(3) + 's a lap to ' + rivalTeam.name + '.'
      : 'You are ' + Math.abs(rep.total).toFixed(3) + 's a lap faster than ' + rivalTeam.name + ', the next best car.'
  }));
  body.appendChild(App.h('p.muted', { text: 'Both laps are modelled on new softs, low fuel, 94% track grip and a maximum push, so the only difference is the machinery and the driver.' }));

  const list = App.h('div.whylist');
  rep.rows.forEach(function (r) {
    list.appendChild(App.h('div.whyrow' + (r.delta > 0 ? '.is-loss' : '.is-gain'), {}, [
      App.h('span.whyrow__k', { text: r.label }),
      App.h('span.whyrow__d', { text: 'you ' + r.mine.toFixed(1) + '  ·  them ' + r.theirs.toFixed(1) }),
      App.h('span.whyrow__v.num', { text: App.fmt.signed(r.delta, 3) + 's' })
    ]));
  });
  body.appendChild(list);

  body.appendChild(App.h('h3.modal__h', { text: 'What the data says to do' }));
  const advice = App.h('ul.advice');
  const worst = rep.rows[0];
  const suggestions = [];
  if (worst.key === 'straight') suggestions.push('Take angle out of the rear wing, or close the cooling exits. You are carrying drag you are not being paid for.');
  if (worst.key === 'highSpeed' || worst.key === 'medSpeed') suggestions.push('More total downforce, or a stiffer platform so the floor works consistently.');
  if (worst.key === 'lowSpeed') suggestions.push('Soften the springs and the anti-roll bars. Mechanical grip, not aero, decides these corners.');
  if (worst.key === 'traction') suggestions.push('More differential lock and less rear anti-roll. Stop the car spinning the rears on exit.');
  if (worst.key === 'braking') suggestions.push('Move brake bias forward and add rear stability. You are arriving at the apex without confidence.');
  if (Math.abs(mineDer.dom.balance - 0.5) > 0.02) suggestions.push('Aero balance is at ' + (mineDer.dom.balance * 100).toFixed(1) + '% front, costing ' + mineDer.dom.balanceLoss.toFixed(1) + ' points of grip everywhere. Fix that before anything else.');
  if (mineDer.dom.cooling < 45) suggestions.push('Cooling is marginal. You will derate before the end of a stint.');
  if (!suggestions.length) suggestions.push('Nothing structural is wrong. The remaining gap is development, not setup.');
  suggestions.forEach(s => advice.appendChild(App.h('li', { text: s })));
  body.appendChild(advice);
};

        App.h('span.typecard__r', { text: Math.round(t.risk * 100) + '% risk of a miss' })
      ]));
    });
    formBody.appendChild(typeSel);

    /* Packages: several components developed as one device, for a synergy
       bonus you cannot get by doing them one at a time. */
    formBody.appendChild(App.h('h3.tree__g', { text: 'Or develop a package' }));
    const packs = App.h('div.rnd__types');
    Data.PACKAGES.forEach(function (pk) {
      const afford = ts.budget >= pk.cost && ts.atr >= pk.atr;

        App.h('span', { text: pk.members.map(m => Data.componentByKey(m).name).join(', ') }),

      ]));

    formBody.appendChild(App.h('p.muted', { text: Data.FAMILIES.floor.desc }));

      id: 'btn-start-project', text: 'Commit to the single-component programme',
      onclick: function () {
        const t = Data.projectTypeByKey(pick.type);
        if (ts.budget < t.cost || ts.atr < t.atr) { App.toast('Not enough budget or tunnel allowance.', 'bad'); return; }
        const r = Engine.rng(st.rngSeed);
        ts.budget -= t.cost; ts.atr -= t.atr; ts.cfd = Engine.clamp(ts.cfd - t.atr * 0.6, 0, 100);
        ts.projects.push({
          component: pick.component, typeKey: t.key, typeName: t.name,
          roundsLeft: t.weeks, expectedGain: Engine.projectExpectedGain(t.key, team, pick.component, Data, r),
          done: false
        });
        st.rngSeed = r.s;
        App.logEvent('Development started: ' + t.name + ' on the ' + Data.componentByKey(pick.component).name + '.');
        App.save();
        App.route('rnd', { focus: pick.component });
      }
    }));
    formBody.appendChild(App.h('p.muted', { text: 'The wind tunnel says one thing and the track says another. Expected gain is what the tunnel promises; the correlation rating decides how close the track comes.' }));

    cols.appendChild(App.h('section.card', {}, [
      App.h('header.card__head', {}, [App.h('h2', { text: 'Start a programme' })]), formBody
    ]));

    /* Active + history */
    const listBody = App.h('div.card__body.card__body--tight');
    const open = ts.projects.filter(p => !p.done);
    const closed = ts.projects.filter(p => p.done).slice(-10).reverse();
    if (!open.length) listBody.appendChild(App.h('p.muted', { text: 'Nothing in development. The car you have is the car you race.' }));
    open.forEach(function (p) {
      listBody.appendChild(App.h('div.proj', {}, [
        App.h('b', { text: p.package ? p.typeName : Data.componentByKey(p.component).name }),
        App.h('span', { text: p.typeName }),
        App.h('span.num', { text: 'expect +' + p.expectedGain.toFixed(2) }),
        App.h('span.proj__eta', { text: p.roundsLeft + ' round' + (p.roundsLeft === 1 ? '' : 's') })
      ]));
    });
    if (closed.length) {
      listBody.appendChild(App.h('h3.tree__g', { text: 'Delivered' }));
      closed.forEach(function (p) {
        listBody.appendChild(App.h('div.proj.proj--' + p.verdict, {}, [
          App.h('b', { text: p.package ? p.typeName : Data.componentByKey(p.component).name }),
          App.h('span', { text: p.typeName }),
          App.h('span.num', { text: 'promised ' + p.expectedGain.toFixed(2) + ' → got ' + p.actual.toFixed(2) }),
          App.h('span.proj__eta', { text: p.verdict })
        ]));
      });
    }
    cols.appendChild(App.h('section.card', {}, [
      App.h('header.card__head', {}, [App.h('h2', { text: 'Programmes' })]), listBody
    ]));

    if (ts.illegal) {
      const comp = Data.componentByKey(ts.illegal.component);
      const caughtChance = Engine.clamp(ts.illegal.risk + ts.fiaSuspicion / 400, 0, 0.95);
      greyBody.appendChild(App.h('p.lede', { text: 'You are running an interpretation of the ' + comp.name.toLowerCase() + ' regulations that the FIA has not blessed.' }));
      greyBody.appendChild(App.h('div.compstat', {}, [
        App.h('div.compstat__v', {}, [App.h('b', { text: '+' + ts.illegal.gain.toFixed(1) }), App.h('em', { text: 'Rating on the ' + comp.name.toLowerCase() })]),
        App.h('div.compstat__v', {}, [App.h('b', { text: Math.round(caughtChance * 100) + '%' }), App.h('em', { text: 'Chance of being caught next race' })]),
        App.h('div.compstat__v', {}, [App.h('b', { text: Math.round(ts.fiaSuspicion) }), App.h('em', { text: 'FIA suspicion, rising each race' })]),
        App.h('div.compstat__v', {}, [App.h('b', { text: String(ts.illegal.races || 0) }), App.h('em', { text: 'Races run with it' })])
      ]));

      greyBody.appendChild(App.h('h3.tree__g', { text: 'What to do about it — including backing out' }));
      greyBody.appendChild(App.h('div.greyacts', {}, [
        greyAction('Refine the design', App.fmt.money(8) + '  ·  20% tunnel',
          'Make it harder to detect. Cuts the risk roughly in half and clears some accumulated suspicion. Does not change the performance.',
          ts.budget >= 8 && ts.atr >= 20, 'btn-refine-illegal', function () {
            const r = Engine.rng(st.rngSeed);
            ts.budget -= 8; ts.atr -= 20;
            ts.illegal.risk = Math.max(0.03, ts.illegal.risk * r.range(0.40, 0.62));
            ts.fiaSuspicion = Math.max(0, ts.fiaSuspicion - r.range(10, 24));
            st.rngSeed = r.s;
            App.logEvent('The grey-area ' + comp.name.toLowerCase() + ' has been redesigned to survive closer inspection.');
            App.save(); App.route('rnd');
          }),

        greyAction('Push it further', App.fmt.money(12) + '  ·  26% tunnel',
          'Take the same interpretation to its logical extreme. More performance, and a great deal more chance the stewards notice.',
          ts.budget >= 12 && ts.atr >= 26, 'btn-push-illegal', function () {
            const r = Engine.rng(st.rngSeed);
            ts.budget -= 12; ts.atr -= 26;
            ts.illegal.gain += r.range(1.5, 4.0);
            ts.illegal.risk = Engine.clamp(ts.illegal.risk * r.range(1.4, 1.9), 0, 0.75);
            st.rngSeed = r.s;
            App.logEvent('The ' + comp.name.toLowerCase() + ' interpretation has been pushed further. The gain is real. So is the exposure.', 'warn');
            App.save(); App.route('rnd');
          }),

        greyAction('Make the case to the FIA', App.fmt.money(5),
          'Present the reasoning before anyone protests. If they accept it, the part is legalised and folded into the car for good. If they do not, suspicion jumps.',
          ts.budget >= 5, 'btn-legalise-illegal', function () {
            const r = Engine.rng(st.rngSeed);
            ts.budget -= 5;
            const odds = Engine.clamp(0.42 - ts.fiaSuspicion / 260 + (team.ratings.engineering - 82) * 0.010, 0.05, 0.72);
            const won = r.chance(odds);
            if (won) {
              ts.components[ts.illegal.component] = Engine.applyGain(ts.components[ts.illegal.component], ts.illegal.gain);
              App.logEvent('The FIA accepts your reading of the rules. The ' + comp.name.toLowerCase() + ' is now simply part of the car — and every rival will copy it.', 'good');
              ts.illegal = null; ts.fiaSuspicion = 0;
            } else {
              ts.fiaSuspicion += r.range(18, 40);
              App.logEvent('The FIA rejects your interpretation and will be watching the ' + comp.name.toLowerCase() + ' closely.', 'bad');
            }
            st.rngSeed = r.s;
            App.save(); App.route('rnd');
          }),

        greyAction('Cancel — take it off the car', 'Free, undoes everything',
          'Changes your mind. The legal part goes back on, you lose the performance immediately, and the FIA\'s interest in you disappears with it. Nothing you have spent on refining or pushing it is refunded.',
          true, 'btn-remove-illegal', function () {
            ts.illegal = null; ts.fiaSuspicion = 0;
            App.logEvent('The grey-area part has been withdrawn before anyone had to ask about it.');
            App.save(); App.route('rnd');
          })
      ]));
      greyBody.appendChild(App.h('p.muted', { text: 'If it fails scrutineering, both cars lose their points from that race and the part comes off anyway.' }));
    } else {
      greyBody.appendChild(App.h('p.lede', { text: 'The technical department has found a reading of the rules that is defensible, aggressive, and probably not what the regulations intended.' }));
      const pickIllegal = { component: 'floorBody' };
      const preview = App.h('div.compstat', { id: 'illegal-preview' });
      const sel = App.h('select.sel', { id: 'illegal-part', onchange: function (e) {
        pickIllegal.component = e.target.value; drawPreview();
      } });
      Data.COMPONENTS.forEach(c => sel.appendChild(App.h('option', { value: c.key, text: c.name, selected: c.key === 'floorBody' })));

      function drawPreview() {
        App.clear(preview);
        /* Deterministic per component so the preview is honest: this is the
           part you will actually get, not a re-roll on commit. */
        const r = Engine.rng(st.seed + st.round * 97 + pickIllegal.component.length * 613);
        const gain = r.range(2.5, 6.5), risk = r.range(0.10, 0.30);
        pickIllegal.gain = gain; pickIllegal.risk = risk;
        const comp = Data.componentByKey(pickIllegal.component);
        preview.appendChild(App.h('div.compstat__v', {}, [App.h('b', { text: '+' + gain.toFixed(1) }), App.h('em', { text: 'Rating gained' })]));
        preview.appendChild(App.h('div.compstat__v', {}, [App.h('b', { text: Math.round(risk * 100) + '%' }), App.h('em', { text: 'Caught in the first race' })]));
        preview.appendChild(App.h('div.compstat__v', {}, [App.h('b', { text: comp.group }), App.h('em', { text: 'Discipline' })]));
      }
      greyBody.appendChild(App.h('div.godrow', {}, [sel]));
      greyBody.appendChild(preview);
      drawPreview();
      greyBody.appendChild(App.h('div.godrow', {}, [
        App.h('button.btn.btn--sm.btn--god', { id: 'btn-run-illegal', text: 'Run it', onclick: function () {
        ts.illegal = { component: pickIllegal.component, gain: pickIllegal.gain, risk: pickIllegal.risk, races: 0 };
        App.logEvent('A grey-area ' + Data.componentByKey(pickIllegal.component).name.toLowerCase() + ' has been fitted. The stewards will be looking.', 'warn');
        App.save();
        App.route('rnd');
      } })
      ]));
      /* No decline button here on purpose: nothing is committed until you run
         it, and the way out afterwards is "Take it off the car" alongside the
         other three decisions. A second dismiss control competing with the one
         real action just made the card ambiguous. */
      greyBody.appendChild(App.h('p.muted', { text: 'Nothing is committed until you run it. Once it is on the car you can refine it to hide it, push it further for more, argue it into legality, or take it straight back off.' }));
    }

    function greyAction(title, cost, desc, enabled, id, onclick) {
      /* The cancel option is styled apart from the three that commit you
         further, so the way out is never mistaken for another gamble. */
      const isCancel = title.indexOf('Cancel') === 0;
      return App.h('div.greyact' + (enabled ? '' : '.is-off') + (isCancel ? '.greyact--out' : ''), {}, [
        App.h('div.greyact__top', {}, [App.h('b', { text: title }), App.h('span.greyact__c', { text: cost })]),
        App.h('p', { text: desc }),
        App.h('button.btn.btn--sm' + (isCancel ? '' : '.btn--god'), { id, text: title, disabled: !enabled, onclick })
      ]);
    }
    cols.appendChild(App.h('section.card', {}, [
      App.h('header.card__head', {}, [App.h('h2', { text: 'Technical interpretation' })]), greyBody
    ]));

    main.appendChild(cols);
    root.appendChild(main);

    function res(k, v, frac) {
      return App.h('div.rres', {}, [
        App.h('span.rres__k', { text: k }),
        App.h('span.rres__v.num', { text: v }),
        App.h('i.rres__t', {}, [App.h('i.rres__f', { style: { '--w': Engine.clamp(frac * 100, 0, 100) + '%' } })])
      ]);
    }
  }
};
</script>
<!-- ==== app_academy.js ==== -->
<script>
/* ============================================================================
 * app_academy.js — the F1 Technical Academy
 *
 * The education layer. Every number on this screen is computed from the same
 * model that runs the races (Engine.componentStars, Engine.circuitProfile,
 * Engine.effectChain), not from a hand-written table of stars. That is the
 * point: if the simulation changes, the teaching changes with it, and the
 * player is never learning something the game does not actually do.
 * ==========================================================================*/

App.academy = {};
const AC = App.academy;

/* Explanation depth. Stored on state so it persists across screens. */
AC.LEVELS = [
  { key: 'beginner', name: 'Beginner', hint: 'Plain language, no jargon.' },
  { key: 'intermediate', name: 'Intermediate', hint: 'What is actually going on, and why it is a trade-off.' },
  { key: 'engineer', name: 'Engineer', hint: 'The channels, the numbers and the second-order effects.' }
];
AC.level = function () { return (App.state && App.state.settings && App.state.settings.eduLevel) || 'intermediate'; };
AC.setLevel = function (k) {
  App.state.settings = App.state.settings || {};
  App.state.settings.eduLevel = k;
};

/* A reference car to measure sensitivity against. Uses the player's car when
   they have one, so the stars reflect the machinery they actually run. */
AC.refCar = function () {
  const tid = App.myTeamId();
  if (tid) return App.state.teams[tid].components;
  const avg = {};
  Data.COMPONENT_KEYS.forEach(function (k) {
    let s = 0;
    Data.TEAMS.forEach(t => { s += t.base[k]; });
    avg[k] = s / Data.TEAMS.length;
  });
  return avg;
};

AC.stars = function (n) {
  let s = '';
  for (let i = 0; i < 5; i++) s += i < n ? '★' : '☆';
  return s;
};

/* ---------------------------------------------------------------------------
 * SCREEN
 * -------------------------------------------------------------------------*/
App.screens.academy = {
  render: function (root, params) {
    root.appendChild(App.chrome('academy'));
    const main = App.h('main.page.page--academy');
    const tab = params.tab || 'components';

    main.appendChild(App.h('div.gr__head', {}, [
      App.h('div', {}, [
        App.h('p.eyebrow', { text: 'F1 Technical Academy' }),
        App.h('h1.page__h', { text: 'How the car actually works' }),
        App.h('p.muted', { text: 'Every rating here is measured from the same simulation that runs your races. Nothing on this page is a decorative number.' })
      ]),
      App.h('div.gr__switch', {}, AC.LEVELS.map(function (l) {
        return App.h('button.pill' + (AC.level() === l.key ? '.is-on' : ''), {
          text: l.name, 'data-level': l.key, title: l.hint,
          onclick: function () { AC.setLevel(l.key); App.route('academy', { tab }); }
        });
      }))
    ]));

    const tabs = App.h('div.godtabs.actabs');
    [['components', 'Components'], ['circuits', 'Circuit engineering'],
     ['matrix', 'Track × component'], ['concepts', 'Core concepts'],
     ['courses', 'Courses']].forEach(function (t) {
      tabs.appendChild(App.h('button.godtab' + (tab === t[0] ? '.is-on' : ''), {
        text: t[1], 'data-tab': t[0], onclick: function () { App.route('academy', { tab: t[0] }); }
      }));
    });
    main.appendChild(tabs);

    const panel = App.h('div', { id: 'ac-panel' });
    main.appendChild(panel);
    root.appendChild(main);

    if (tab === 'components') AC.drawComponents(panel, params);
    else if (tab === 'circuits') AC.drawCircuits(panel, params);
    else if (tab === 'matrix') AC.drawMatrix(panel);
    else if (tab === 'courses') AC.drawCourses(panel, params);
    else AC.drawConcepts(panel);
  }
};

/* ---------------------------------------------------------------------------
 * COMPONENTS
 * -------------------------------------------------------------------------*/
AC.drawComponents = function (panel, params) {
  const circuitId = params.circuit || (App.state.weekend ? App.state.weekend.circuitId : App.state.calendar[Math.min(App.state.round, App.state.calendar.length) - 1].circuit);
  const circuit = Data.circuitById(circuitId);
  const comps = AC.refCar();
  const setup = Data.defaultSetup();
  const stars = Engine.componentStars(circuit, comps, setup, Data);
  const byKey = {};
  stars.forEach(s => { byKey[s.key] = s; });

  panel.appendChild(App.h('p.muted.ac__ctx', { text: 'Sensitivities shown for ' + circuit.name + '. Pick a different circuit on the Circuit engineering tab and these will change.' }));

  Data.COMPONENT_GROUPS.forEach(function (g) {
    panel.appendChild(App.h('h3.tree__g', { text: g }));
    const grid = App.h('div.accards');
    const inGroup = Data.COMPONENTS.filter(c => c.group === g);
    if (!inGroup.length) return;
    inGroup.forEach(function (comp) {
      const s = byKey[comp.key];
      const edu = Data.COMPONENT_EDU[comp.key];
      grid.appendChild(App.h('button.accard', {
        'data-component': comp.key,
        onclick: function () { AC.componentModal(comp.key, circuit); }
      }, [
        App.h('div.accard__top', {}, [
          App.h('b', { text: comp.name }),
          App.h('span.accard__st', { text: AC.stars(s.stars), title: App.fmt.signed(s.seconds, 3) + 's per 10 rating points here' })
        ]),
        App.h('p.accard__d', { text: edu ? edu.what : comp.desc }),
        App.h('span.accard__w' + (s.seconds < 0 ? '.is-neg' : ''), { text: App.fmt.signed(s.seconds, 3) + 's per lap for 10 points of development' })
      ]));
    });
    panel.appendChild(grid);
  });
};

AC.componentModal = function (key, circuit) {
  const comp = Data.componentByKey(key);
  const edu = Data.COMPONENT_EDU[key];
  const level = AC.level();
  const body = App.modal(comp.name, { wide: true });

  body.appendChild(App.h('div.acfact', {}, [
    fact('Where is it?', edu.where),
    fact('What does it do?', edu.what)
  ]));

  if (level !== 'beginner') {
    body.appendChild(App.h('h3.modal__h', { text: 'How it works' }));
    body.appendChild(App.h('p.lede', { text: edu.how }));
  }

  body.appendChild(App.h('h3.modal__h', { text: 'What the driver feels' }));
  body.appendChild(App.h('div.acfeel', {}, [
    App.h('div.acfeel__c.acfeel__c--up', {}, [App.h('b', { text: 'More of it' }), App.h('p', { text: edu.feelMore })]),
    App.h('div.acfeel__c.acfeel__c--dn', {}, [App.h('b', { text: 'Less of it' }), App.h('p', { text: edu.feelLess })])
  ]));

  body.appendChild(App.h('h3.modal__h', { text: 'The short version' }));
  body.appendChild(App.h('p.lede', { text: edu[level] }));

  /* Cause → effect chain, two levels deep. */
  if (level !== 'beginner') {
    body.appendChild(App.h('h3.modal__h', { text: 'Cause and effect at ' + circuit.name }));
    const chain = Engine.effectChain(key, circuit, Data);
    const wrap = App.h('div.acchain');
    chain.forEach(function (link) {
      const outs = link.outputs.slice(0, 3);
      wrap.appendChild(App.h('div.acchain__row', {}, [
        App.h('span.acchain__a', { text: comp.name }),
        App.h('span.acchain__arrow', { text: '→' }),
        App.h('span.acchain__b' + (link.weight < 0 ? '.is-neg' : ''), {
          text: App.garage.channelLabel(link.channel) + ' ' + (link.weight > 0 ? '↑' : '↓')
        }),
        App.h('span.acchain__arrow', { text: '→' }),
        App.h('span.acchain__c', { text: outs.length
          ? outs.map(o => o.label + (o.strength > 0 ? ' ↑' : ' ↓')).join(', ')
          : 'no direct lap-time route' })
      ]));
    });
    body.appendChild(wrap);
  }

  /* Where in the world this component matters. */
  body.appendChild(App.h('h3.modal__h', { text: 'Where it matters most' }));
  const comps = AC.refCar(), setup = Data.defaultSetup();
  const rows = Data.CIRCUITS.filter(c => !c.historical).map(function (c) {
    return { c, s: Engine.componentSensitivity(key, c, comps, setup, Data) };
  });
  rows.sort((a, b) => b.s - a.s);
  const max = rows[0].s;
  const list = App.h('div.actracks');
  [0, 1, 2, 3].forEach(function (i) { list.appendChild(trackRow(rows[i], 'high')); });
  list.appendChild(App.h('div.actracks__sep', { text: 'least sensitive' }));
  [rows.length - 3, rows.length - 2, rows.length - 1].forEach(function (i) { list.appendChild(trackRow(rows[i], 'low')); });
  body.appendChild(list);
  body.appendChild(App.h('p.muted', { text: 'Measured by adding ten development points to this component and asking the lap-time model what happened at each circuit. It is not a table someone typed in.' }));

  function trackRow(r, tone) {
    return App.h('div.actrack.actrack--' + tone, {}, [
      App.h('span.actrack__n', { text: r.c.name }),
      App.h('i.actrack__t', {}, [App.h('i.actrack__f', { style: { '--w': Engine.clamp(r.s / max * 100, 2, 100) + '%' } })]),
      App.h('span.actrack__v.num', { text: App.fmt.signed(r.s, 3) + 's' })
    ]);
  }
  function fact(k, v) {
    return App.h('div.acfact__r', {}, [App.h('span.acfact__k', { text: k }), App.h('p', { text: v })]);
  }
};

/* ---------------------------------------------------------------------------
 * CIRCUIT ENGINEERING
 * -------------------------------------------------------------------------*/
AC.drawCircuits = function (panel, params) {
  const circuitId = params.circuit || (App.state.weekend ? App.state.weekend.circuitId : App.state.calendar[Math.min(App.state.round, App.state.calendar.length) - 1].circuit);
  const circuit = Data.circuitById(circuitId);

  const picker = App.h('div.acpicker');
  Data.CIRCUITS.forEach(function (c) {
    picker.appendChild(App.h('button.chipbtn' + (c.id === circuitId ? '.is-on' : ''), {
      text: c.name.replace('Circuit de ', '').replace(' Circuit', '').replace('Autodromo ', ''),
      'data-circuit': c.id,
      onclick: function () { App.route('academy', { tab: 'circuits', circuit: c.id }); }
    }));
  });
  panel.appendChild(picker);

  const profile = Engine.circuitProfile(circuit);
  const cols = App.h('div.accols');

  /* Demands */
  const dBody = App.h('div.card__body');
  profile.demands.forEach(function (d) {
    dBody.appendChild(App.h('div.acdemand', {}, [
      App.h('span.acdemand__k', { text: d.label }),
      App.h('span.acdemand__s', { text: AC.stars(d.stars) }),
      App.h('span.acdemand__w.num', { text: Math.round(d.w * 100) + '% of lap' })
    ]));
  });
  dBody.appendChild(App.h('p.muted', { text: circuit.notes }));
  cols.appendChild(App.h('section.card', {}, [
    App.h('header.card__head', {}, [App.h('h2', { text: 'What this circuit demands' }),
      App.h('span.card__tag', { text: circuit.length.toFixed(3) + ' km  ·  ' + circuit.corners + ' corners' })]),
    dBody
  ]));

  /* Priorities with a why on each */
  const pBody = App.h('div.card__body.card__body--tight');
  profile.priorities.forEach(function (p) {
    const why = App.h('p.acprio__why', { text: p.why, style: { display: 'none' } });
    pBody.appendChild(App.h('div.acprio', {}, [
      App.h('div.acprio__top', {}, [
        App.h('span.acprio__k', { text: p.label }),
        App.h('span.acprio__v', { text: p.value }),
        App.h('button.linkbtn.acprio__b', { text: 'Why?', onclick: function (e) {
          const open = why.style.display !== 'none';
          why.style.display = open ? 'none' : '';
          e.currentTarget.textContent = open ? 'Why?' : 'Hide';
        } })
      ]),
      why
    ]));
  });
  cols.appendChild(App.h('section.card', {}, [
    App.h('header.card__head', {}, [App.h('h2', { text: 'What the car should look like' })]), pBody
  ]));

  /* Map with corner data */
  const path = Engine.trackPath(circuit, Data);
  const mBody = App.h('div.card__body');
  mBody.appendChild(App.h('div.mapwrap', {}, [App.trackSVG(circuit, { size: 320, labels: true, sectors: true })]));
  const cornerList = App.h('div.accorners');
  path.corners.forEach(function (cn) {
    const type = cn.speed > 200 ? 'High speed' : (cn.speed > 130 ? 'Medium speed' : 'Low speed');
    cornerList.appendChild(App.h('div.accorner', {}, [
      App.h('span.accorner__n', { text: 'T' + cn.num }),
      App.h('span.accorner__s.num', { text: cn.speed + ' km/h' }),
      App.h('span.accorner__g.num', { text: 'G' + cn.gear }),
      App.h('span.accorner__t', { text: type })
    ]));
  });
  mBody.appendChild(cornerList);
  cols.appendChild(App.h('section.card', {}, [
    App.h('header.card__head', {}, [App.h('h2', { text: 'Corner by corner' })]), mBody
  ]));

  panel.appendChild(cols);

  /* Component ranking for this circuit */
  const comps = AC.refCar();
  const stars = Engine.componentStars(circuit, comps, Data.defaultSetup(), Data);
  const rBody = App.h('div.card__body.card__body--tight');
  stars.forEach(function (s) {
    const comp = Data.componentByKey(s.key);
    rBody.appendChild(App.h('div.acrank', {}, [
      App.h('span.acrank__n', { text: comp.name }),
      App.h('span.acrank__s', { text: AC.stars(s.stars) }),
      App.h('i.acrank__t', {}, [App.h('i.acrank__f', { style: { '--w': Engine.clamp(s.frac * 100, 2, 100) + '%' } })]),
      App.h('span.acrank__v.num' + (s.seconds < 0 ? '.is-neg' : ''), { text: App.fmt.signed(s.seconds, 3) + 's' }),
      App.h('button.linkbtn', { text: 'Open', onclick: function () { AC.componentModal(s.key, circuit); } })
    ]));
  });
  panel.appendChild(App.h('section.card.ac__rank', {}, [
    App.h('header.card__head', {}, [
      App.h('h2', { text: 'Where development money is worth most here' }),
      App.h('span.card__tag', { text: 'per 10 rating points' })
    ]), rBody
  ]));
};

/* ---------------------------------------------------------------------------
 * TRACK × COMPONENT MATRIX
 * -------------------------------------------------------------------------*/
AC.drawMatrix = function (panel) {
  const comps = AC.refCar(), setup = Data.defaultSetup();
  const circuits = Data.CIRCUITS.filter(c => !c.historical);
  panel.appendChild(App.h('p.muted.ac__ctx', { text: 'Each cell is how much a component is worth at that circuit, relative to the most valuable component there. Read down a column to see what a circuit rewards; read across a row to see where a component earns its keep.' }));

  const table = App.h('div.acmatrix');
  const head = App.h('div.acmrow.acmrow--head');
  head.appendChild(App.h('span.acmc.acmc--label', { text: 'Component' }));
  circuits.forEach(function (c) {
    head.appendChild(App.h('span.acmc.acmc--h', { title: c.name }, [
      App.h('span', { text: c.country.slice(0, 3).toUpperCase() })
    ]));
  });
  table.appendChild(head);

  const cache = {};
  circuits.forEach(function (c) {
    const stars = Engine.componentStars(c, comps, setup, Data);
    cache[c.id] = {};
    stars.forEach(s => { cache[c.id][s.key] = s; });
  });

  Data.COMPONENTS.forEach(function (comp) {
    const row = App.h('div.acmrow');
    row.appendChild(App.h('span.acmc.acmc--label', { text: comp.name }));
    circuits.forEach(function (c) {
      const s = cache[c.id][comp.key];
      row.appendChild(App.h('span.acmc.acmc--v', {
        title: comp.name + ' at ' + c.name + ': ' + AC.stars(s.stars) + '  (' + App.fmt.signed(s.seconds, 3) + 's per 10 points)',
        style: { '--f': s.frac.toFixed(3) },
        onclick: function () { AC.componentModal(comp.key, c); }
      }, [App.h('i.acmdot')]));
    });
    table.appendChild(row);
  });
  panel.appendChild(App.h('div.acmwrap', {}, [table]));
  panel.appendChild(App.h('p.muted', { text: 'Brighter is more sensitive. Click any cell to open that component at that circuit. These values are measured, not authored, so they move when your car changes.' }));
};

/* ---------------------------------------------------------------------------
 * CORE CONCEPTS
 * -------------------------------------------------------------------------*/
AC.drawConcepts = function (panel) {
  const grid = App.h('div.acconcepts');
  Data.CONCEPT_EDU.forEach(function (c) {
    grid.appendChild(App.h('section.card.acconcept', { 'data-concept': c.key }, [
      App.h('header.card__head', {}, [App.h('h2', { text: c.name })]),
      App.h('div.card__body', {}, [
        App.h('p.lede', { text: c.summary }),
        App.h('p.muted', { text: c.body })
      ])
    ]));
  });
  panel.appendChild(grid);

  /* A live demonstration of the downforce/drag trade-off using the real model. */
  const circuit = Data.circuitById(App.state.weekend ? App.state.weekend.circuitId : 'suzuka');
  const comps = AC.refCar();
  const driver = App.myDriverIds().length ? App.driver(App.myDriverIds()[0]) : App.driver('norris');
  const demo = App.h('div.card__body');
  const out = App.h('div.acdemo__out', { id: 'ac-demo-out' });
  const val = App.h('span.slider__v.num', { text: '25' });

  demo.appendChild(App.h('p.lede', { text: 'Move the rear wing and watch what happens at ' + circuit.name + '. Nothing here is a mock-up — it is the lap-time model responding.' }));
  demo.appendChild(App.h('label.slider', {}, [
    App.h('span.slider__k', { text: 'Rear wing angle' }),
    App.h('input', { type: 'range', min: 0, max: 50, value: 25, id: 'ac-demo-wing',
      oninput: function (e) { val.textContent = e.target.value; run(Number(e.target.value)); } }),
    val
  ]));
  demo.appendChild(out);
  panel.appendChild(App.h('section.card', {}, [
    App.h('header.card__head', {}, [App.h('h2', { text: 'Try it: the downforce and drag trade-off' })]), demo
  ]));

  function run(v) {
    const preview = Engine.setupPreview({
      components: comps, setup: Data.defaultSetup(), field: 'rearWing', value: v,
      circuit, driver, Data
    });
    App.clear(out);
    out.appendChild(App.h('div.acdemo__lap', {}, [
      App.h('span', { text: 'Lap time change' }),
      App.h('b.num' + (preview.lapDelta < 0 ? '.is-gain' : '.is-loss'), { text: App.fmt.signed(preview.lapDelta, 3) + 's' })
    ]));
    const list = App.h('div.whylist');
    preview.domains.forEach(function (d) {
      list.appendChild(App.h('div.whyrow' + (d.delta > 0 ? '.is-loss' : '.is-gain'), {}, [
        App.h('span.whyrow__k', { text: d.label }),
        App.h('span.whyrow__d', { text: '' }),
        App.h('span.whyrow__v.num', { text: App.fmt.signed(d.delta, 3) + 's' })
      ]));
    });
    out.appendChild(list);
    out.appendChild(App.h('p.muted', { text: 'Balance ' + (preview.balanceTo * 100).toFixed(1) +
      '% front  ·  medium-tyre stint ' + preview.stintTo + ' laps' }));
  }
  run(25);
};

/* ---------------------------------------------------------------------------
 * COURSES
 * Short lessons, each with one question. Progression lives on state.academy
 * so it survives a save and carries across seasons.
 * -------------------------------------------------------------------------*/
AC.progress = function () {
  App.state.academy = App.state.academy || { done: {}, score: 0, attempts: 0 };
  return App.state.academy;
};
AC.totalLessons = function () {
  let n = 0;
  Data.COURSES.forEach(c => { n += c.lessons.length; });
  return n;
};

AC.drawCourses = function (panel, params) {
  const prog = AC.progress();
  const total = AC.totalLessons();
  const done = Object.keys(prog.done).length;

  panel.appendChild(App.h('div.coursehead', {}, [
    App.h('div', {}, [
      App.h('span.coursehead__n.num', { text: done + ' / ' + total }),
      App.h('span.muted', { text: ' lessons complete' })
    ]),
    App.h('i.coursebar', {}, [App.h('i.coursebar__f', { style: { '--w': (done / total * 100) + '%' } })]),
    prog.attempts ? App.h('span.muted', { text: Math.round(prog.score / prog.attempts * 100) + '% answered correctly first time' }) : null
  ]));

  Data.COURSES.forEach(function (course) {
    const complete = course.lessons.every(l => prog.done[l.key]);
    const body = App.h('div.card__body.card__body--tight');
    course.lessons.forEach(function (lesson) {
      const isDone = !!prog.done[lesson.key];
      body.appendChild(App.h('button.lesson' + (isDone ? '.is-done' : ''), {
        'data-lesson': lesson.key,
        onclick: function () { AC.lessonModal(course, lesson); }
      }, [
        App.h('i.lesson__d'),
        App.h('span.lesson__t', { text: lesson.title }),
        App.h('span.lesson__s', { text: isDone ? 'Passed' : 'Not attempted' })
      ]));
    });
    panel.appendChild(App.h('section.card.course' + (complete ? '.is-complete' : ''), {}, [
      App.h('header.card__head', {}, [
        App.h('h2', { text: course.name }),
        App.h('span.card__tag', { text: course.lessons.filter(l => prog.done[l.key]).length + ' / ' + course.lessons.length })
      ]), body
    ]));
  });
  panel.appendChild(App.h('p.muted', { text: 'Every question is about something the simulation actually does. If a lesson says a worn tyre falls off a cliff, the tyre model in your races has that cliff in it.' }));
};

AC.lessonModal = function (course, lesson) {
  const prog = AC.progress();
  const body = App.modal(lesson.title, { wide: true });
  body.appendChild(App.h('p.eyebrow', { text: course.name }));
  body.appendChild(App.h('p.lede', { text: lesson.body }));
  body.appendChild(App.h('h3.modal__h', { text: lesson.q }));

  const result = App.h('div.quizresult');
  let answered = false;
  const opts = App.h('div.quizopts');
  lesson.options.forEach(function (text, i) {
    const btn = App.h('button.quizopt', { 'data-option': i, onclick: function () {
      if (answered) return;
      answered = true;
      const right = i === lesson.answer;
      prog.attempts += 1;
      if (right) prog.score += 1;
      App.$$('.quizopt', opts).forEach(function (b, j) {
        if (j === lesson.answer) b.classList.add('is-right');
        else if (j === i) b.classList.add('is-wrong');
        b.disabled = true;
      });
      App.clear(result);
      result.appendChild(App.h('p.quizresult__v' + (right ? '.is-right' : '.is-wrong'), {
        text: right ? 'Correct.' : 'Not quite.'
      }));
      result.appendChild(App.h('p.muted', { text: lesson.why }));
      if (right && !prog.done[lesson.key]) {
        prog.done[lesson.key] = true;
        result.appendChild(App.h('p.muted', { text: 'Lesson complete.' }));
      }
      result.appendChild(App.h('button.btn.btn--sm.btn--primary', { id: 'btn-lesson-close', text: 'Back to the courses', onclick: function () {
        App.closeModal(); App.route('academy', { tab: 'courses' });
      } }));
      App.save();
    } }, [App.h('span.quizopt__i', { text: String.fromCharCode(65 + i) }), App.h('span', { text })]);
    opts.appendChild(btn);
  });
  body.appendChild(opts);
  body.appendChild(result);
};
</script>
